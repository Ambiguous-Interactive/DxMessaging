; Vale configuration for the DxMessaging documentation surface.
;
; The rule packs under .vale/styles/DxMessaging/ are the authoritative source
; for the banned-phrase list. Vale is a LOCAL-ONLY tool (run `vale docs/ README.md`);
; no CI workflow runs it. It catches structural prose problems (passive voice,
; sentence complexity, capitalization) that simple linters cannot express.
;
; See .llm/skills/documentation-style/references/human-prose-policy.md for the policy.

StylesPath = .vale/styles

Packages = write-good

MinAlertLevel = warning

Vocab = DxMessaging

[*.md]
BasedOnStyles = Vale, DxMessaging, write-good

; Exclude inline code spans, fenced code blocks, and HTML attributes from
; prose scanning. Vale's TokenIgnores and BlockIgnores accept regular
; expressions delimited with parentheses.
TokenIgnores = (`[^`]+`)
BlockIgnores = (?s)(```.*?```)

; The DxMessaging skill files describe the policy itself, so the marketing,
; hedge, and filler rules cannot reasonably apply. Capitalization rules are
; still enforced.
;
; The pattern ends in `**`, not `**/*.md`. Whether a trailing `**/` can match
; zero intermediate directories varies between glob engines, and each of these
; skills keeps the policy text in BOTH `SKILL.md` and `references/*.md`. A bare
; `**` covers the directory subtree with no dependence on that edge case.
[.llm/skills/{documentation-style,markdown-authoring,documentation-code-samples}/**]
BasedOnStyles = DxMessaging
DxMessaging.Marketing = NO
DxMessaging.Hedges = NO
DxMessaging.LLMFiller = NO

; The generated mirrors copy each skill's description verbatim, so the three
; policy skills need the same exemption in both mirror roots.
[{.claude,.agents}/skills/{documentation-style,markdown-authoring,documentation-code-samples}/**]
BasedOnStyles = DxMessaging
DxMessaging.Marketing = NO
DxMessaging.Hedges = NO
DxMessaging.LLMFiller = NO

; Scan only XML doc comments inside .cs sources. Anything that is not a ///
; line is treated as a block to ignore.
[*.cs]
BasedOnStyles = DxMessaging
BlockIgnores = (?m)^(?!\s*///).*$
