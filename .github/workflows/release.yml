name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package-version: ${{ steps.verify.outputs.package-version }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify semver tag matches package.json
        id: verify
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release must be dispatched from a tag ref, not ${GITHUB_REF_TYPE}."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s\n' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must use vX.Y.Z semver format."
            exit 1
          fi
          PACKAGE_VERSION="$(jq -r '.version // empty' package.json)"
          if [ -z "${PACKAGE_VERSION}" ]; then
            echo "::error::package.json version is missing."
            exit 1
          fi
          if [ "${tag}" != "v${PACKAGE_VERSION}" ]; then
            echo "::error::Tag ${tag} does not match package.json version v${PACKAGE_VERSION}."
            exit 1
          fi
          # package.json advertises changelogUrl; never publish a version that
          # CHANGELOG.md does not mention. Use fixed-string heading checks so
          # semver punctuation cannot alter regex matching semantics.
          if ! grep -Fqx "## [${PACKAGE_VERSION}]" CHANGELOG.md \
            && ! grep -Fqx "## ${PACKAGE_VERSION}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no exact heading for ${PACKAGE_VERSION}."
            exit 1
          fi
          {
            echo "package-version=${PACKAGE_VERSION}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate package
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Setup .NET
        # validate:all runs check:analyzers, which builds the source
        # generators against the SDK pinned in SourceGenerators/global.json.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: SourceGenerators/global.json

      - name: Install Node dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i --no-audit --no-fund
          fi

      - name: Run release validation
        run: |
          set -euo pipefail
          node --test scripts/
          npm run validate:all

      - name: Pack npm package
        id: pack
        run: |
          set -euo pipefail
          mkdir -p .artifacts/release
          # npm pack ignores --provenance (provenance is a publish-only
          # feature); the artifact is attested by the attest-build-provenance
          # step below.
          pack_json="$(npm pack --json)"
          package_file="$(printf '%s' "${pack_json}" | jq -r '.[0].filename')"
          mv "${package_file}" ".artifacts/release/${package_file}"
          (cd .artifacts/release && sha256sum "${package_file}" > "${package_file}.sha256")
          echo "package-file=${package_file}" >> "${GITHUB_OUTPUT}"

      - name: Generate the GitHub Release notes from CHANGELOG.md
        # The published release body is the matching `## [version]` CHANGELOG
        # section plus an install footer, built by the SINGLE shared extractor
        # that release-prepare.yml and release-drafter.yml also call. Never a
        # stub: shipping `Release vX.Y.Z` with no changelog was a v3.1.0 defect.
        # --version takes the bare package version (the `## [X.Y.Z]` heading has
        # no `v`), not the tag. verify-tag already proved the heading exists.
        env:
          PACKAGE_VERSION: ${{ needs.verify-tag.outputs.package-version }}
        run: |
          set -euo pipefail
          node scripts/release/release-notes.js \
            --version "${PACKAGE_VERSION}" \
            --footer \
            --out .artifacts/release/release-notes.md

      - name: Verify tarball packaging invariants (issue 204 guard)
        # Centralized validator checks tarball contents for forbidden
        # build-artifact paths and Unity .meta pairing invariants.
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.package-file }}
        run: |
          set -euo pipefail
          node scripts/validate-npm-meta.js --tarball ".artifacts/release/${PACKAGE_FILE}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package
          path: .artifacts/release/
          if-no-files-found: error
          # Artifacts are immutable per name within a run; a "re-run all jobs"
          # recovery would 409 against the first attempt's upload without this.
          overwrite: true

      - name: Attest release package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: .artifacts/release/*.tgz

  runner-preflight:
    name: Self-hosted runner registration preflight
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require a registered Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@168b8dea5351f1cc448ed499e354cb31ad64ef10 # post-v1.10.0
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  unity-checks:
    name: Trusted Unity release checks
    needs:
      - verify-tag
      - runner-preflight
    runs-on: [self-hosted, Windows, RAM-64GB]
    # Workflow-level permissions are `contents: read` (no checks: write), so
    # this job needs its own checks: write or game-ci's check-run creation
    # 403s and the release Unity gate silently stops failing on red tests.
    permissions:
      actions: read
      contents: read
      checks: write
    timeout-minutes: 900
    steps:
      - name: Remove stale Unity editor validator
        timeout-minutes: 2
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $parent = [IO.Path]::GetFullPath((Join-Path $workspace '.ci'))
          $target = [IO.Path]::GetFullPath((Join-Path $parent 'unity-helpers'))
          if (-not $target.StartsWith("$workspace\", [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Validator checkout path escaped the workspace.'
          }
          if (Test-Path -LiteralPath $parent) {
            $parentItem = Get-Item -LiteralPath $parent -Force
            if (($parentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Validator checkout parent is a reparse point.'
            }
          }
          if (Test-Path -LiteralPath $target) {
            $targetItem = Get-Item -LiteralPath $target -Force
            if (($targetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              $targetItem.Delete()
            } else {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          if (Test-Path -LiteralPath $target) {
            throw 'Validator checkout directory could not be removed.'
          }

      - name: Checkout trusted Unity editor validator
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
        with:
          repository: Ambiguous-Interactive/unity-helpers
          ref: 76712db791093a9c6b2eccdd9c7bd1b4f1cdb24d
          path: .ci/unity-helpers
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Require manually installed Unity editor
        timeout-minutes: 10
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          & "$env:GITHUB_WORKSPACE/.ci/unity-helpers/scripts/unity/ensure-editor.ps1" `
            -UnityVersion '2022.3.45f1' `
            -InstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -ProvisioningProfile EditorOnly `
            -DiagnosticsPath (Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation') `
            -CiManagedOnly `
            -RequireHealthyExisting

      - name: Bind validated Unity editor
        timeout-minutes: 2
        shell: pwsh
        run: |
          # ensure-editor writes this summary from a finally block, so the evidence
          # exists for a failed gate too, and writing it under RUNNER_TEMP keeps it
          # out of reach of the repository checkout that follows.
          $source = Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation\ensure-editor-summary.json'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Unity editor validation evidence was not written: $source"
          }
          $summary = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3\2022.3.45f1\Editor\Unity.exe'))
          # A summary written by a failed gate can record no editor at all, and
          # GetFullPath('') throws an ArgumentException instead of saying so.
          $recorded = [string]$summary.editorPath
          $actual = if ($recorded) { [IO.Path]::GetFullPath($recorded) } else { '(none recorded)' }
          if (-not [string]::Equals($actual, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Validated editor '$actual' did not match the canonical editor '$expected'."
          }
          "UNITY_EDITOR_PATH=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Enable Git long paths
        timeout-minutes: 2
        shell: pwsh
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Print runner diagnostics
        timeout-minutes: 2
        # Composite action runs PowerShell internally; `shell: bash` on this
        # self-hosted Windows runner resolved to the WSL stub at
        # C:\Windows\System32\bash.exe and failed with "Windows Subsystem
        # for Linux has no installed distributions." See FIX #4 sweep
        # report in the dev/wallstop/swap branch: never use plain
        # `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      # Single source of truth for the assembly include list: the canonical
      # asmdef-discovery.js module. Extracted into a composite action shared by
      # all three Unity workflows; shell: pwsh is enforced inside the composite.
      - name: Compute test assembly list
        id: compute
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: editmode

      # Unity work skips when no test assembly matched. Credential validation
      # and lock acquisition remain unconditional. The editor gate ran before
      # the repository checkout, so a failure there has already failed the job.
      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@168b8dea5351f1cc448ed499e354cb31ad64ef10 # post-v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: release-editmode
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Redact credentials from Unity release artifacts
        id: redact_validation
        if: always()
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: |
            ${{ runner.temp }}/dx-unity-editor-validation
            .artifacts/unity

      - name: Upload Unity editor validation diagnostics
        if: ${{ always() && steps.redact_validation.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-release-editor-validation-editmode
          path: ${{ runner.temp }}/dx-unity-editor-validation
          if-no-files-found: warn
          retention-days: 14

      - name: Run Unity Test Runner
        id: run_tests
        if: ${{ steps.compute.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 120
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!UnityRuntime;!PerfBench;!PerfGate;!PerfBaseline"
        run: |
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '2022.3.45f1' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode 'editmode' `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/release-editmode' `
            -LicenseReturnOwner Central `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      # CANCELLATION + TIMEOUT DIAGNOSTIC: when Unity 2022 hangs in csc the
      # runner step times out (or the operator cancels), and the verify
      # step below skips -- so its catastrophic-pattern scan never fires
      # either. This step covers both
      # failure() AND cancelled() so the operator has SOMETHING to look at
      # in the GitHub summary; matches unity-tests.yml / unity-benchmarks.yml.
      - name: Dump Unity log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/release-editmode
          label: Unity release editmode

      # CLASS GUARD: Unity can fail before NUnit writes results. The shared
      # composite fails unless a results XML exists AND reports total > 0.
      # Gated with !cancelled() (NOT always()) so a user-initiated cancel
      # does not race against this step and emit a misleading "tests did not
      # run" annotation. Also skips when setup/editor-validation/lock work failed
      # before the Unity run step attempted; that earlier failure remains the
      # actionable signal. Matches unity-tests.yml and unity-benchmarks.yml.
      - name: Verify tests actually ran
        if: >-
          ${{
            !cancelled() &&
            steps.compute.outcome == 'success' &&
            (steps.compute.outputs.is-empty == 'true' || steps.run_tests.outcome != 'skipped')
          }}
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/release-editmode
          label: Unity release editmode
          expected-empty: ${{ steps.compute.outputs.is-empty }}

      - name: Redact credentials from release Unity artifacts
        id: redact_release
        if: always()
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: |
            ${{ runner.temp }}/dx-unity-editor-validation
            .artifacts/unity

      - name: Upload release Unity artifacts
        if: ${{ always() && steps.redact_release.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-release-editmode
          path: .artifacts/unity/release-editmode
          if-no-files-found: warn
          retention-days: 14

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@168b8dea5351f1cc448ed499e354cb31ad64ef10
        with:
          unity-version: 2022.3.45f1
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: release-editmode

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@168b8dea5351f1cc448ed499e354cb31ad64ef10
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@168b8dea5351f1cc448ed499e354cb31ad64ef10 # post-v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: release-editmode
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@168b8dea5351f1cc448ed499e354cb31ad64ef10
        with:
          # A leg that aborts before `Acquire organization Unity lock` runs never
          # took a seat, and this gate's own contract treats `acquired: false` as
          # proof that licensed cleanup was not required. Feeding it the skipped
          # step's EMPTY output instead made it fail closed on work that never
          # started, so a leg with one honest failure reported two (#327).
          #
          # This does not weaken the gate. It reads `outcome`, not `acquired`, and
          # only the two values that prove the step never executed map to 'false'.
          # An acquire that RAN and failed part-way reports outcome=failure while
          # `acquired` reads empty, so the empty value still flows through and the
          # gate still fails -- that ambiguous shape is the seat leak the bare
          # `if: always()` above exists to catch, and it stays caught.
          acquired: ${{ (steps.acquire_lock.outcome == 'skipped' || steps.acquire_lock.outcome == '') && 'false' || steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  unitypackage:
    name: Export .unitypackage
    # Runs AFTER unity-checks so the licensed editmode gate has already proven
    # the payload compiles before we spend another licensed editor session on
    # the export. REQUIRED, release-blocking: publish needs this job, so a failed
    # export blocks the whole release (including the irreversible npm publish);
    # the release is atomic and never ships without the .unitypackage.
    needs:
      - verify-tag
      - runner-preflight
      - unity-checks
    runs-on: [self-hosted, Windows, RAM-64GB]
    permissions:
      actions: read
      contents: read
    timeout-minutes: 900
    steps:
      - name: Remove stale Unity editor validator
        timeout-minutes: 2
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $parent = [IO.Path]::GetFullPath((Join-Path $workspace '.ci'))
          $target = [IO.Path]::GetFullPath((Join-Path $parent 'unity-helpers'))
          if (-not $target.StartsWith("$workspace\", [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Validator checkout path escaped the workspace.'
          }
          if (Test-Path -LiteralPath $parent) {
            $parentItem = Get-Item -LiteralPath $parent -Force
            if (($parentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Validator checkout parent is a reparse point.'
            }
          }
          if (Test-Path -LiteralPath $target) {
            $targetItem = Get-Item -LiteralPath $target -Force
            if (($targetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              $targetItem.Delete()
            } else {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          if (Test-Path -LiteralPath $target) {
            throw 'Validator checkout directory could not be removed.'
          }

      - name: Checkout trusted Unity editor validator
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
        with:
          repository: Ambiguous-Interactive/unity-helpers
          ref: 76712db791093a9c6b2eccdd9c7bd1b4f1cdb24d
          path: .ci/unity-helpers
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Require manually installed Unity editor
        timeout-minutes: 10
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          & "$env:GITHUB_WORKSPACE/.ci/unity-helpers/scripts/unity/ensure-editor.ps1" `
            -UnityVersion '2022.3.45f1' `
            -InstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -ProvisioningProfile EditorOnly `
            -DiagnosticsPath (Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation') `
            -CiManagedOnly `
            -RequireHealthyExisting

      - name: Bind validated Unity editor
        timeout-minutes: 2
        shell: pwsh
        run: |
          # ensure-editor writes this summary from a finally block, so the evidence
          # exists for a failed gate too, and writing it under RUNNER_TEMP keeps it
          # out of reach of the repository checkout that follows.
          $source = Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation\ensure-editor-summary.json'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Unity editor validation evidence was not written: $source"
          }
          $summary = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3\2022.3.45f1\Editor\Unity.exe'))
          # A summary written by a failed gate can record no editor at all, and
          # GetFullPath('') throws an ArgumentException instead of saying so.
          $recorded = [string]$summary.editorPath
          $actual = if ($recorded) { [IO.Path]::GetFullPath($recorded) } else { '(none recorded)' }
          if (-not [string]::Equals($actual, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Validated editor '$actual' did not match the canonical editor '$expected'."
          }
          "UNITY_EDITOR_PATH=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Enable Git long paths
        timeout-minutes: 2
        shell: pwsh
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Print runner diagnostics
        timeout-minutes: 2
        # Composite action runs PowerShell internally; never use plain
        # `shell: bash` on self-hosted Windows runners (see unity-checks).
        uses: ./.github/actions/print-self-hosted-runner-diagnostics

      - name: Setup Node.js
        timeout-minutes: 5
        # export-unitypackage.ps1 stages the payload with `npm pack`, so the
        # shipped bytes are identical to the npm/UPM artifact.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@168b8dea5351f1cc448ed499e354cb31ad64ef10 # post-v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: release-unitypackage
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Redact credentials from Unity unitypackage artifacts
        id: redact_validation
        if: always()
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: |
            ${{ runner.temp }}/dx-unity-editor-validation
            .artifacts/unity

      - name: Upload Unity editor validation diagnostics
        if: ${{ always() && steps.redact_validation.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-release-editor-validation-unitypackage
          path: ${{ runner.temp }}/dx-unity-editor-validation
          if-no-files-found: warn
          retention-days: 14
          # The documented recovery for a failed export is re-running this
          # job; the if: always() uploads from the failed attempt would 409
          # against immutable artifact names without overwrite.
          overwrite: true

      - name: Export the .unitypackage
        id: export_unitypackage
        if: ${{ steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 120
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          PACKAGE_VERSION: ${{ needs.verify-tag.outputs.package-version }}
        run: |
          $dist = '.artifacts/unity/release-unitypackage-dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $output = Join-Path $dist "com.wallstop-studios.dxmessaging-$env:PACKAGE_VERSION.unitypackage"
          ./scripts/unity/export-unitypackage.ps1 `
            -UnityVersion '2022.3.45f1' `
            -OutputPath $output `
            -ArtifactsPath '.artifacts/unity/release-unitypackage' `
            -LicenseReturnOwner Central

      - name: Dump Unity log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/release-unitypackage
          label: Unity release unitypackage export

      - name: Redact credentials from unitypackage artifacts
        id: redact_unitypackage
        if: always()
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: |
            ${{ runner.temp }}/dx-unity-editor-validation
            .artifacts/unity

      - name: Upload the .unitypackage artifact
        # This step had no condition, which implies success(). Naming any condition removes that
        # implicit guard, so success() has to be restated alongside the redaction gate.
        if: ${{ success() && steps.redact_unitypackage.outcome == 'success' }}
        timeout-minutes: 20
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-unitypackage
          path: .artifacts/unity/release-unitypackage-dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload export diagnostics
        if: ${{ always() && steps.redact_unitypackage.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-release-unitypackage
          path: .artifacts/unity/release-unitypackage
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@168b8dea5351f1cc448ed499e354cb31ad64ef10
        with:
          unity-version: 2022.3.45f1
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: release-unitypackage

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@168b8dea5351f1cc448ed499e354cb31ad64ef10
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@168b8dea5351f1cc448ed499e354cb31ad64ef10 # post-v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: release-unitypackage
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@168b8dea5351f1cc448ed499e354cb31ad64ef10
        with:
          # A leg that aborts before `Acquire organization Unity lock` runs never
          # took a seat, and this gate's own contract treats `acquired: false` as
          # proof that licensed cleanup was not required. Feeding it the skipped
          # step's EMPTY output instead made it fail closed on work that never
          # started, so a leg with one honest failure reported two (#327).
          #
          # This does not weaken the gate. It reads `outcome`, not `acquired`, and
          # only the two values that prove the step never executed map to 'false'.
          # An acquire that RAN and failed part-way reports outcome=failure while
          # `acquired` reads empty, so the empty value still flows through and the
          # gate still fails -- that ambiguous shape is the seat leak the bare
          # `if: always()` above exists to catch, and it stays caught.
          acquired: ${{ (steps.acquire_lock.outcome == 'skipped' || steps.acquire_lock.outcome == '') && 'false' || steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  release-checks-success:
    name: Release Checks Success
    if: always()
    needs:
      - runner-preflight
      - unity-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require release test validation
        shell: bash
        run: |
          test "${{ needs.runner-preflight.result }}" = success
          test "${{ needs.unity-checks.result }}" = success

  release-export-success:
    name: Release Export Success
    if: always()
    needs:
      - runner-preflight
      - unitypackage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require release export validation
        shell: bash
        run: |
          test "${{ needs.runner-preflight.result }}" = success
          test "${{ needs.unitypackage.result }}" = success

  publish:
    name: Publish npm package and GitHub Release
    needs:
      - verify-tag
      - validate
      - unity-checks
      - unitypackage
      - release-checks-success
      - release-export-success
    # ATOMIC RELEASE: the .unitypackage is a REQUIRED asset, so publish runs only
    # when every upstream job -- including unitypackage -- succeeds (default
    # needs-gating; no always() escape hatch). A failed export therefore blocks
    # the IRREVERSIBLE npm publish too, so neither npm nor the GitHub Release can
    # advertise a version whose .unitypackage is missing (the v3.1.0 failure
    # mode). Recovery is to fix the export and re-run: the npm publish step below
    # is re-runnable (it skips a version already on the registry).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          registry-url: "https://registry.npmjs.org"

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: .artifacts/release

      - name: Download the .unitypackage artifact
        # Guaranteed present: publish only runs when the unitypackage job
        # succeeded (job-level needs), so this never blocks the npm publish.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-unitypackage
          path: .artifacts/unitypackage

      - name: Stage the .unitypackage release asset
        id: unitypackage_asset
        # The .unitypackage is a REQUIRED asset, so a missing or empty file here
        # is a HARD error -- never a silent downgrade to a tgz-only release.
        run: |
          set -euo pipefail
          mapfile -t unitypackage_files < <(find .artifacts/unitypackage -maxdepth 1 -type f -name '*.unitypackage' | sort)
          if [ "${#unitypackage_files[@]}" -lt 1 ] || [ ! -s "${unitypackage_files[0]}" ]; then
            echo "::error::No non-empty .unitypackage was found in the export artifact; refusing to publish an incomplete release."
            exit 1
          fi
          unitypackage_file="${unitypackage_files[0]}"
          # Same checksum pattern as the npm tarball in the validate job.
          (cd .artifacts/unitypackage && sha256sum "$(basename "${unitypackage_file}")" > "$(basename "${unitypackage_file}").sha256")
          {
            echo "unitypackage-file=${unitypackage_file}"
            echo "unitypackage-checksum=${unitypackage_file}.sha256"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate downloaded release package
        id: release_package
        run: |
          set -euo pipefail
          pkg="$(jq -r .name package.json)"
          ver="${{ needs.verify-tag.outputs.package-version }}"
          node scripts/validate-npm-meta.js \
            --release-dir .artifacts/release \
            --expected-name "${pkg}" \
            --expected-version "${ver}"
          mapfile -t package_files < <(find .artifacts/release -maxdepth 1 -type f -name '*.tgz' | sort)
          package_file="${package_files[0]}"
          checksum_file="${package_file}.sha256"
          {
            echo "package-file=${package_file}"
            echo "checksum-file=${checksum_file}"
          } >> "${GITHUB_OUTPUT}"

      - name: Assemble the Asset Store submission staging artifact
        # The official classic and UPM publishing tools document Editor UI,
        # not a sanctioned headless API (re-verified 2026-08-28).
        # This tested generator STAGES the
        # submission inputs, store media, manifest, and manual
        # checklists. It runs before npm publish so missing store collateral
        # fails before the irreversible registry action.
        run: |
          set -euo pipefail
          node scripts/release/asset-store-submission.js \
            --out .artifacts/asset-store-submission \
            --package-file "${{ steps.release_package.outputs.package-file }}" \
            --package-checksum "${{ steps.release_package.outputs.checksum-file }}" \
            --unitypackage-file "${{ steps.unitypackage_asset.outputs.unitypackage-file }}" \
            --unitypackage-checksum "${{ steps.unitypackage_asset.outputs.unitypackage-checksum }}" \
            --tag "${{ needs.verify-tag.outputs.tag }}"

      - name: Upload the Asset Store submission staging artifact
        # Upload before npm publication so a green irreversible registry step
        # never precedes delivery of the operator's exact staged inputs.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asset-store-submission
          path: .artifacts/asset-store-submission/
          if-no-files-found: error
          # overwrite: a release workflow re-run may replace the artifact from
          # an earlier attempt before the idempotent npm/release steps resume.
          overwrite: true
          retention-days: 30

      # ORDERING INVARIANT: a published GitHub Release must never exist without
      # the matching npm version. The IRREVERSIBLE npm publish runs FIRST; the
      # GitHub Release is created/finalized only AFTER it succeeds. If the npm
      # publish failed and the GitHub Release ran first, a non-draft Release
      # would advertise a version that npm never received.
      - name: Publish to npm with provenance
        run: |
          set -euo pipefail
          npx --yes --package=npm@^11.5.1 npm --version
          package_file="${{ steps.release_package.outputs.package-file }}"
          # Make publish safely RE-RUNNABLE: if this exact name@version is
          # already on the registry (a prior run published it before failing
          # downstream), skip the publish instead of failing on the
          # immutable-version error. The GitHub Release step still runs after.
          pkg="$(jq -r .name package.json)"
          ver="${{ needs.verify-tag.outputs.package-version }}"
          if npx --yes --package=npm@^11.5.1 npm view "${pkg}@${ver}" version \
              >/dev/null 2>&1; then
            echo "::notice::${pkg}@${ver} is already on the npm registry; skipping publish."
          else
            npx --yes --package=npm@^11.5.1 npm publish "${package_file}" --provenance --access public
          fi

      # Runs only AFTER npm publish above succeeds (or confirmed the version
      # already exists), preserving the ordering invariant: no published
      # GitHub Release without the matching npm version. The required
      # .unitypackage (+ .sha256) always rides along (guaranteed by Stage).
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNITYPACKAGE_FILE: ${{ steps.unitypackage_asset.outputs.unitypackage-file }}
          UNITYPACKAGE_CHECKSUM: ${{ steps.unitypackage_asset.outputs.unitypackage-checksum }}
        run: |
          set -euo pipefail
          tag="${{ needs.verify-tag.outputs.tag }}"
          package_file="${{ steps.release_package.outputs.package-file }}"
          checksum_file="${{ steps.release_package.outputs.checksum-file }}"
          # The .unitypackage (+ .sha256) is guaranteed by the Stage step above.
          assets=("${package_file}" "${checksum_file}" "${UNITYPACKAGE_FILE}" "${UNITYPACKAGE_CHECKSUM}")
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              "${assets[@]}" \
              --clobber
            gh release edit "${tag}" \
              --title "${tag}" \
              --notes-file .artifacts/release/release-notes.md \
              --draft=false
          else
            gh release create "${tag}" \
              "${assets[@]}" \
              --title "${tag}" \
              --notes-file .artifacts/release/release-notes.md \
              --verify-tag
          fi

      - name: Verify the published Release has every expected asset
        # Closes the v3.1.0 failure mode for good: assert the published release
        # carries all four assets (tgz + .sha256, unitypackage + .sha256). Runs
        # after npm publish + release creation, so a missing asset fails the run
        # LOUDLY instead of shipping a silently-incomplete release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_FILE: ${{ steps.release_package.outputs.package-file }}
          CHECKSUM_FILE: ${{ steps.release_package.outputs.checksum-file }}
          UNITYPACKAGE_FILE: ${{ steps.unitypackage_asset.outputs.unitypackage-file }}
          UNITYPACKAGE_CHECKSUM: ${{ steps.unitypackage_asset.outputs.unitypackage-checksum }}
        run: |
          set -euo pipefail
          tag="${{ needs.verify-tag.outputs.tag }}"
          expected=(
            "$(basename "${PACKAGE_FILE}")"
            "$(basename "${CHECKSUM_FILE}")"
            "$(basename "${UNITYPACKAGE_FILE}")"
            "$(basename "${UNITYPACKAGE_CHECKSUM}")"
          )
          published="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
          missing=()
          for name in "${expected[@]}"; do
            if ! printf '%s\n' "${published}" | grep -Fqx "${name}"; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release ${tag} is missing expected assets: ${missing[*]}"
            exit 1
          fi
          echo "::notice::Release ${tag} has all ${#expected[@]} expected assets."
