name: Unity Tests

on:
  pull_request:
    branches:
      - master
    # Documentation and isolated tooling pull requests never reach this workflow, so they never
    # need the licensed Unity matrix: the docs-only skip that head-check used to
    # decide in-band is now decided by the trigger itself. The required
    # "Unity CI Success" context still reports for those pull requests through
    # unity-docs-gate.yml, which evaluates the same closed documentation-only
    # allowlist. Keep this list in lockstep with that workflow and with the
    # documentation-only pattern that perf-numbers.yml uses.
    # The tooling entries do not participate in Unity compilation or execution.
    paths-ignore:
      - "docs/**"
      - ".docs-tests/**"
      - ".devcontainer/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/llm/**"
      - "scripts/wiki/**"
      - "scripts/__tests__/llm-harness.test.js"
      - "scripts/__tests__/llm-harness.test.js.meta"
      - "*.md"
      - "progress/**"
      - ".llm/**"
      - ".agents/**"
      - ".claude/**"
      - "Samples~/**/*.md"
      - "Samples~/**/*.markdown"
      - "AGENTS.md"
      - "GOAL.md"
      - "PLAN.md"
      - "llms.txt"
      - "mkdocs.yml"
      - "requirements-docs.in"
      - "requirements-docs.txt"
      - "requirements-brand.in"
      - "requirements-brand.txt"
  push:
    branches:
      - master
    paths-ignore:
      - "docs/architecture/performance.md"
      - "docs/architecture/perf-baseline.csv"
      - "docs/architecture/perf-baseline-profile.json"
  workflow_dispatch:
    inputs:
      shipping_fidelity:
        description: "Run the exhaustive stripped-player matrix"
        type: boolean
        default: false
      shipping_native_payload:
        description: "Retain the High semantic native payload (requires shipping fidelity)"
        type: boolean
        default: false
      consumer_install_validation:
        description: "Validate Git, UPM tarball, and classic package consumers"
        type: boolean
        default: false

concurrency:
  # The organization enrollment contract (build-lock #274) requires literal
  # `cancel-in-progress: true` on this group: a queued superseded run wastes a
  # paid self-hosted seat. Cancellation is safe for licensed work -- the
  # acquire action traps cancellation signals and releases before activation,
  # the cleanup chain runs under `if: always()`, and the scheduled reaper
  # recovers a holder whose runner died. Licensed Unity work is still
  # serialized by the organization build lock, not by this group, and every
  # leg re-checks the pull-request head before it can reach that lock. Pull
  # requests therefore share one group across head revisions so this setting
  # actually cancels superseded runs; push and dispatch runs stay keyed by ref.
  group: unity-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: read

jobs:
  runner-preflight:
    name: Self-hosted runner registration preflight
    # Runs on GitHub-hosted infrastructure before any self-hosted matrix entry
    # can queue. Reader-App or inventory failures are intentionally fail closed.
    #
    # Dependabot and fork pull requests are excluded for the same reason their
    # licensed jobs are: their jobs read from the separate Dependabot or fork
    # secret store, so `secrets.BUILD_LOCK_READER_APP_ID` resolves empty and the
    # fail-closed preflight aborts with "Missing required input: reader-app-id"
    # before it can check anything. Running it there cannot pass, and the
    # licensed Unity secrets below are unreadable for the same reason.
    # Dependency bumps are validated by the full matrix on the post-merge push
    # to master. This exact guard expression is the enrollment policy's
    # trusted-revision shape and is checked verbatim by the organization audit.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      # A superseded run's preflight is never cancelled: cancel-in-progress is
      # false so a newer run can only queue behind it, and every licensed leg
      # re-checks the pull-request head before it can reach the lock.
      group: ${{ github.workflow }}-runner-preflight-${{ github.event.pull_request.number && format('{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Require a registered Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  unity-tests:
    name: Unity ${{ matrix.unity-version }} all modes
    needs:
      - runner-preflight
    # Same-repository pull requests run licensed validation with organization
    # secrets and no environment approval. Fork pull requests and Dependabot
    # pull requests remain static-only: neither can read the organization Unity
    # serial or build-lock App secrets, so a licensed leg there fails on missing
    # credentials rather than on the change under test. This exact guard
    # expression is the enrollment policy's trusted-revision shape and is
    # checked verbatim by the organization audit. A superseded pull-request run
    # still starts, but each leg aborts at the `Require current PR head before
    # setup` guard before any expensive setup.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 1050
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        unity-version:
          - 2021.3.45f1
          - 2022.3.45f1
          - 6000.3.16f1
          - 6000.5.2f1
        # Every leg of this job also builds the standalone IL2CPP player, so the
        # reviewed static map keeps the editor gate verifying the
        # StandaloneWindowsIl2Cpp payload at gate time. A literal EditorOnly
        # profile here would let a leg reach the organization lock without the
        # IL2CPP modules its player build needs (#333). The enrollment audit
        # accepts exactly this map expression, keyed by a literal test-mode
        # axis, and no other dynamic form.
        test-mode:
          - standalone
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      # Contract item 3: the central immutable gate validates the runner-owned
      # editor before any credential reference or checkout. CI never installs,
      # repairs, or provisions an editor; a missing or unhealthy editor is an
      # offline runner-maintenance failure. The gate exposes the validated
      # executable through its editor-path output, and every Unity-consuming
      # step below binds it as UNITY_EDITOR_PATH step env, so the licensed work
      # runs the exact editor the gate validated.
      - name: Require manually installed Unity editor
        id: ensure_unity_editor
        timeout-minutes: 10
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/ensure-unity-editor@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          unity-version: ${{ matrix.unity-version }}
          install-root: ${{ runner.tool_cache }}\u6-v3
          provisioning-profile: ${{ fromJSON('{"editmode":"EditorOnly","playmode":"EditorOnly","standalone":"StandaloneWindowsIl2Cpp"}')[matrix.test-mode] }}
          diagnostics-path: unity-editor-check.json
          ci-managed-only: true
          require-healthy-existing: true

      # Contract item 3: only the current-PR-head guard may precede the editor
      # gate, so this input check lives after it. It still fails before any
      # checkout, credential reference, or lock acquisition.
      - name: Require one optional manual validation mode
        if: ${{ inputs.shipping_fidelity && inputs.consumer_install_validation }}
        timeout-minutes: 1
        shell: pwsh
        run: throw 'shipping_fidelity and consumer_install_validation are mutually exclusive.'

      - name: Enable Git long paths
        timeout-minutes: 2
        shell: pwsh
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Print runner diagnostics
        timeout-minutes: 2
        # Composite action runs PowerShell internally; `shell: bash` on this
        # self-hosted Windows runner resolved to the WSL stub at
        # C:\Windows\System32\bash.exe and failed with "Windows Subsystem
        # for Linux has no installed distributions." See FIX #4 sweep
        # report in the dev/wallstop/swap branch: never use plain
        # `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "default (organization lock wraps the Unity section)"

      - name: Setup Node.js
        id: setup_node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install artifact tooling dependencies
        id: install_dependencies
        timeout-minutes: 2
        shell: pwsh
        # Unity imports node_modules beside the local package. Keep tooling under a
        # hidden directory so dependency installation does not add thousands of assets.
        run: |
          $tooling = Join-Path $env:GITHUB_WORKSPACE '.artifacts/node-tooling'
          New-Item -ItemType Directory -Path $tooling -Force | Out-Null
          Copy-Item package.json, package-lock.json -Destination $tooling
          npm ci --prefix "$tooling" --userconfig "$env:GITHUB_WORKSPACE/.npmrc" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NODE_PATH=$(Join-Path $tooling 'node_modules')" >> $env:GITHUB_ENV

      # Single source of truth for the assembly include list: the canonical
      # asmdef-discovery.js module. Extracted into a composite action so all
      # three Unity workflows share one implementation. shell: pwsh is enforced
      # inside the composite.
      - name: Compute EditMode test assembly list
        id: compute
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: editmode

      - name: Compute PlayMode test assembly list
        id: compute_playmode
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: playmode

      - name: Compute standalone test assembly list
        id: compute_standalone
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: standalone
          runtime-only: "true"

      # Unity work skips when no test assembly matched. Credential validation
      # and lock acquisition remain unconditional. The editor gate ran before
      # the repository checkout, so a failure there has already failed the job.
      # Editors and modules are installed manually by a runner administrator;
      # CI only verifies the exact trusted tool-cache install.
      # IL2CPP compiles generated C++ with `cl.exe`; Mono legs never touch it.
      # `assert-unity-host-prereqs` covers the VC++ RUNTIME (so the Editor
      # launches) but not the BUILD TOOLS (so IL2CPP can compile), and that gap
      # cost three licence seats and ~2h on 2026-07-31 (#333): three standalone
      # legs each took the organization lock, consumed a seat, built for twenty
      # minutes, then died with a message naming neither the host nor the cause.
      # Runs BEFORE the lock so a broken host costs seconds, not a seat.
      - name: Require an MSVC C++ toolchain for IL2CPP
        timeout-minutes: 3
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: ./scripts/unity/assert-msvc-toolchain.ps1

      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Require current PR head before lock acquisition
        if: >-
          ${{
            steps.compute.outputs.is-empty != 'true' ||
            steps.compute_playmode.outputs.is-empty != 'true' ||
            steps.compute_standalone.outputs.is-empty != 'true' ||
            matrix.unity-version == '2021.3.45f1' ||
            matrix.unity-version == '6000.5.2f1'
          }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          lock-name: wallstop-organization-builds
          # Every matrix axis is part of the holder identity, so each expanded
          # leg owns a distinct lock holder.
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}-all-modes
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Run Unity Test Runner
        id: run_editmode
        if: ${{ !cancelled() && steps.compute.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 90
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_TEST_ASSEMBLIES: ${{ steps.compute.outputs.assemblies }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!UnityRuntime;!PerfBench;!PerfGate;!PerfBaseline"
          CONSUMER_INSTALL_VALIDATION: ${{ inputs.consumer_install_validation }}
        run: |
          if ($env:CONSUMER_INSTALL_VALIDATION -eq 'true') {
            $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t\${{ matrix.unity-version }}-unitypackage'
            $licenseReturnOwner = 'Central'
            ./scripts/unity/export-unitypackage.ps1 `
              -UnityVersion '${{ matrix.unity-version }}' `
              -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-editmode' `
              -ProjectPath $projectPath `
              -GitRevision '${{ github.sha }}' `
              -VerifyConsumerInstalls `
              -LicenseReturnOwner $licenseReturnOwner
          } else {
            $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t\${{ matrix.unity-version }}-editmode'
            $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
            ./scripts/unity/run-ci-tests.ps1 `
              -UnityVersion '${{ matrix.unity-version }}' `
              -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
              -TestMode editmode `
              -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
              -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-editmode' `
              -ProjectPath $projectPath `
              -CachePath $cachePath `
              -LicenseReturnOwner Central `
              -ReleaseCodeOptimization `
              -ReleasePlayerBuild
          }

      - name: Run Unity PlayMode tests
        id: run_playmode
        if: ${{ !cancelled() && !inputs.consumer_install_validation && steps.compute_playmode.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 90
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_TEST_ASSEMBLIES: ${{ steps.compute_playmode.outputs.assemblies }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!PerfBench;!PerfGate;!PerfBaseline"
        run: |
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t\${{ matrix.unity-version }}-playmode'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode playmode `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-playmode' `
            -ProjectPath $projectPath `
            -CachePath $cachePath `
            -LicenseReturnOwner Central `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      - name: Run Unity standalone tests
        id: run_standalone
        if: ${{ !cancelled() && !inputs.consumer_install_validation && steps.compute_standalone.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 150
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_TEST_ASSEMBLIES: ${{ steps.compute_standalone.outputs.assemblies }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!PerfBench;!PerfGate;!PerfBaseline"
        run: |
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t\${{ matrix.unity-version }}-standalone'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode standalone `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-standalone' `
            -ProjectPath $projectPath `
            -CachePath $cachePath `
            -LicenseReturnOwner Central `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      # Explicitly requested dispatch runs cover semantic and 1/16/256/1000-message
      # shipping topologies at every stripping level on the endpoint editors. Keep the
      # group last because each cell builds another IL2CPP player, and the
      # central cleanup action below returns the final activation before the
      # editor-scoped organization lock is released.
      - name: Run stripped shipping-fidelity players
        id: run_shipping
        if: >-
          ${{
            !cancelled() &&
            steps.acquire_lock.outputs.acquired == 'true' &&
            github.event_name == 'workflow_dispatch' &&
            inputs.shipping_fidelity &&
            (matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.5.2f1')
          }}
        continue-on-error: true
        timeout-minutes: 150
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_RETAIN_NATIVE_PAYLOAD: ${{ inputs.shipping_native_payload }}
        run: |
          $projectPathRoot = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
          ./scripts/unity/run-shipping-fidelity-matrix.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-shipping' `
            -ProjectPathRoot $projectPathRoot `
            -CachePath $cachePath `
            -RetainNativePayload:($env:DXM_RETAIN_NATIVE_PAYLOAD -eq 'true')

      # A mode failure is tolerated until the test modes and shipping group have
      # had a chance to run. Preserve diagnostics and result verification, then fail
      # the editor-scoped job from one summary gate before central cleanup.
      - name: Dump EditMode log tail on failure or cancellation
        if: ${{ steps.run_editmode.outcome == 'failure' || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode
          label: Unity ${{ matrix.unity-version }} editmode

      - name: Dump PlayMode log tail on failure or cancellation
        if: ${{ steps.run_playmode.outcome == 'failure' || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode
          label: Unity ${{ matrix.unity-version }} playmode

      - name: Dump standalone log tail on failure or cancellation
        if: ${{ steps.run_standalone.outcome == 'failure' || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone
          label: Unity ${{ matrix.unity-version }} standalone

      - name: Dump shipping-fidelity log tail on failure or cancellation
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.shipping_fidelity &&
            (matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.5.2f1')) &&
            (steps.run_shipping.outcome == 'failure' || cancelled())
          }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-shipping
          label: Unity ${{ matrix.unity-version }} shipping fidelity

      # CLASS GUARD: Unity can fail before NUnit writes results. The shared
      # composite fails unless a results XML exists AND reports total > 0.
      # Skip on cancellation so a user-cancelled run does not emit the
      # generic "tests did not run" annotation -- the cancellation itself
      # is the explanation. Also skip if setup/editor-validation/lock work failed
      # before the Unity run step attempted; that earlier failure is then the
      # actionable signal. The guard still runs for intentional empty targets,
      # after a Unity-run failure (to surface "tests did not run" /
      # catastrophic-compile diagnostics), and on success (to confirm a real
      # result XML exists).
      - name: Verify EditMode tests actually ran
        id: verify_editmode
        if: >-
          ${{
            !cancelled() &&
            !inputs.consumer_install_validation &&
            steps.compute.outcome == 'success' &&
            (steps.compute.outputs.is-empty == 'true' || steps.run_editmode.outcome != 'skipped')
          }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode
          label: Unity ${{ matrix.unity-version }} editmode
          expected-empty: ${{ steps.compute.outputs.is-empty }}

      - name: Verify PlayMode tests actually ran
        id: verify_playmode
        if: >-
          ${{
            !cancelled() &&
            !inputs.consumer_install_validation &&
            steps.compute_playmode.outcome == 'success' &&
            (steps.compute_playmode.outputs.is-empty == 'true' || steps.run_playmode.outcome != 'skipped')
          }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode
          label: Unity ${{ matrix.unity-version }} playmode
          expected-empty: ${{ steps.compute_playmode.outputs.is-empty }}

      - name: Verify standalone tests actually ran
        id: verify_standalone
        if: >-
          ${{
            !cancelled() &&
            !inputs.consumer_install_validation &&
            steps.compute_standalone.outcome == 'success' &&
            (steps.compute_standalone.outputs.is-empty == 'true' || steps.run_standalone.outcome != 'skipped')
          }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone
          label: Unity ${{ matrix.unity-version }} standalone
          expected-empty: ${{ steps.compute_standalone.outputs.is-empty }}

      - name: Redact sensitive data from Unity test artifacts
        id: redact_tests
        # Require this run's Node and dependency install, not files left by a previous run.
        # An aborted install must also skip uploads, which require successful redaction.
        if: ${{ always() && steps.setup_node.outcome == 'success' && steps.install_dependencies.outcome == 'success' }}
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: |
            .artifacts/unity

      # Content-addressed retention for issue #508. The manifest names every evidence
      # file with its SHA-256 and embeds the normalized matrix result, so the uploaded
      # artifact stays verifiable and replayable while the uploaded artifact is retained.
      # Redaction runs first so no sensitive data can be sealed into a bundle.
      - name: Seal shipping-fidelity evidence bundle
        id: seal_shipping
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' && inputs.shipping_fidelity &&
            (matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.5.2f1') &&
            steps.run_shipping.outcome == 'success'
          }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '.artifacts/unity/${{ matrix.unity-version }}-shipping'
          node scripts/unity/perf-evidence-bundle.js seal $root `
            --experiment-id 'shipping-fidelity-matrix-${{ matrix.unity-version }}' `
            --artifact-class 'shipping-fidelity-matrix' `
            --reducer 'shipping-fidelity-matrix-v1' `
            --source-commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw "Sealing the shipping evidence bundle failed ($LASTEXITCODE)." }
          node scripts/unity/perf-evidence-bundle.js replay (Join-Path $root 'evidence-manifest.json') > $null
          if ($LASTEXITCODE -ne 0) { throw "Replaying the shipping evidence bundle failed ($LASTEXITCODE)." }

      - name: Upload EditMode test artifacts
        if: ${{ always() && steps.redact_tests.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-editmode
          path: .artifacts/unity/${{ matrix.unity-version }}-editmode
          if-no-files-found: warn
          retention-days: 14

      - name: Upload PlayMode test artifacts
        if: ${{ always() && !inputs.consumer_install_validation && steps.redact_tests.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-playmode
          path: .artifacts/unity/${{ matrix.unity-version }}-playmode
          if-no-files-found: warn
          retention-days: 14

      - name: Upload standalone test artifacts
        if: ${{ always() && !inputs.consumer_install_validation && steps.redact_tests.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-standalone
          path: .artifacts/unity/${{ matrix.unity-version }}-standalone
          if-no-files-found: warn
          retention-days: 14

      - name: Upload shipping-fidelity artifacts
        if: >-
          ${{
            steps.redact_tests.outcome == 'success' &&
            steps.seal_shipping.outcome == 'success' &&
            always() &&
            !cancelled() &&
            steps.acquire_lock.outputs.acquired == 'true' &&
            github.event_name == 'workflow_dispatch' &&
            inputs.shipping_fidelity &&
            (matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.5.2f1')
          }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-shipping
          path: .artifacts/unity/${{ matrix.unity-version }}-shipping
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload shipping native payload
        if: >-
          ${{
            steps.redact_tests.outcome == 'success' &&
            steps.run_shipping.outcome == 'success' &&
            steps.acquire_lock.outputs.acquired == 'true' &&
            always() &&
            !cancelled() &&
            github.event_name == 'workflow_dispatch' &&
            inputs.shipping_fidelity &&
            inputs.shipping_native_payload &&
            (matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.5.2f1')
          }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-shipping-native-payload
          path: .artifacts/unity/${{ matrix.unity-version }}-shipping-native-payload
          if-no-files-found: error
          retention-days: 14

      - name: Require every Unity mode to pass
        if: ${{ !cancelled() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        shell: pwsh
        env:
          EDIT_COMPUTE: ${{ steps.compute.outcome }}
          EDIT_EMPTY: ${{ steps.compute.outputs.is-empty }}
          EDIT_RUN: ${{ steps.run_editmode.outcome }}
          EDIT_VERIFY: ${{ steps.verify_editmode.outcome }}
          PLAY_COMPUTE: ${{ steps.compute_playmode.outcome }}
          PLAY_EMPTY: ${{ steps.compute_playmode.outputs.is-empty }}
          PLAY_RUN: ${{ steps.run_playmode.outcome }}
          PLAY_VERIFY: ${{ steps.verify_playmode.outcome }}
          STANDALONE_COMPUTE: ${{ steps.compute_standalone.outcome }}
          STANDALONE_EMPTY: ${{ steps.compute_standalone.outputs.is-empty }}
          STANDALONE_RUN: ${{ steps.run_standalone.outcome }}
          STANDALONE_VERIFY: ${{ steps.verify_standalone.outcome }}
          SHIPPING_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.shipping_fidelity && (matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.5.2f1') }}
          SHIPPING_RUN: ${{ steps.run_shipping.outcome }}
          CONSUMER_INSTALL_VALIDATION: ${{ inputs.consumer_install_validation }}
        run: |
          $failures = @()
          if ($env:CONSUMER_INSTALL_VALIDATION -eq 'true') {
            if ($env:EDIT_RUN -ne 'success') {
              $failures += "consumer installs: $env:EDIT_RUN"
            }
            foreach ($mode in @(@{ Name = 'playmode'; Run = $env:PLAY_RUN }, @{ Name = 'standalone'; Run = $env:STANDALONE_RUN })) {
              if ($mode.Run -ne 'skipped') { $failures += "$($mode.Name): consumer validation unexpectedly ran tests ($($mode.Run))" }
            }
          } else {
            foreach ($mode in @(
              @{ Name = 'editmode'; Compute = $env:EDIT_COMPUTE; Empty = $env:EDIT_EMPTY; Run = $env:EDIT_RUN; Verify = $env:EDIT_VERIFY },
              @{ Name = 'playmode'; Compute = $env:PLAY_COMPUTE; Empty = $env:PLAY_EMPTY; Run = $env:PLAY_RUN; Verify = $env:PLAY_VERIFY },
              @{ Name = 'standalone'; Compute = $env:STANDALONE_COMPUTE; Empty = $env:STANDALONE_EMPTY; Run = $env:STANDALONE_RUN; Verify = $env:STANDALONE_VERIFY }
            )) {
              if ($mode.Compute -ne 'success') {
                $failures += "$($mode.Name): assembly discovery $($mode.Compute)"
              } elseif ($mode.Empty -eq 'true' -and $mode.Run -ne 'skipped') {
                $failures += "$($mode.Name): empty discovery unexpectedly ran tests ($($mode.Run))"
              } elseif ($mode.Empty -ne 'true' -and $mode.Run -ne 'success') {
                $failures += "$($mode.Name): test run $($mode.Run)"
              }
              if ($mode.Verify -ne 'success') {
                $failures += "$($mode.Name): result verification $($mode.Verify)"
              }
            }
          }
          if ($env:SHIPPING_REQUIRED -eq 'true' -and $env:SHIPPING_RUN -ne 'success') {
            $failures += "shipping: fidelity run $env:SHIPPING_RUN"
          } elseif ($env:SHIPPING_REQUIRED -ne 'true' -and $env:SHIPPING_RUN -ne 'skipped') {
            $failures += "shipping: unrequested fidelity run ($env:SHIPPING_RUN)"
          }
          if ($failures.Count -gt 0) {
            throw "Unity mode failures: $($failures -join '; ')"
          }
          Write-Host 'All required Unity test modes and shipping-fidelity runs completed.'

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@d79e1cc2acc892b619db2ca46f78291ca427016b
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          # The enrollment contract requires a literal evidence suffix; the
          # matrix leg is already identified by the acquire holder identity,
          # and each leg owns a private RUNNER_TEMP.
          evidence-suffix: unity-tests-all-modes

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@d79e1cc2acc892b619db2ca46f78291ca427016b
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}-all-modes
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@d79e1cc2acc892b619db2ca46f78291ca427016b
        with:
          # Typed binding to the one acquire step, exactly as the enrollment
          # contract requires. A leg that aborts before acquire ran reports an
          # empty output, and the gate itself treats missing or invalid
          # acquisition state as fail-closed; only the literal `acquired=false`
          # from a completed acquire marks cleanup as not applicable.
          acquired: ${{ steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  # Single aggregate gate so branch protection can require ONE "Unity CI Success"
  # context instead of the individual matrix and preflight contexts.
  #
  # Exactly always() -- NEVER a falsifiable job-level if. A skipped required
  # check counts as passing and the latest run on a SHA wins, so a guard that
  # can be false on a pull_request could launder a red/pending gate into a
  # false green. The step below is the enrollment policy's closed trusted-skip
  # shape: fork and Dependabot pull requests skip both the preflight and the
  # licensed matrix (neither can read the organization secrets those jobs
  # require), and every other trusted run must have executed Unity
  # successfully. Documentation-only pull requests never trigger this workflow
  # (the pull_request paths-ignore decides that before any job runs), and for
  # those runs unity-docs-gate.yml reports the same "Unity CI Success" context
  # green, so the required check never goes absent. A superseded pull-request
  # run fails its per-leg head guard before it can reach the lock.
  unity-ci-success:
    name: Unity CI Success
    permissions:
      actions: read
    needs:
      - runner-preflight
      - unity-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Unity CI result shape
        shell: bash
        env:
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          UNITY_TESTS_RESULT: ${{ needs.unity-tests.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ "${FORK_PR}" = "true" ] || [ "${DEPENDABOT_PR}" = "true" ]; then
            test "${RUNNER_PREFLIGHT_RESULT}" = skipped
            test "${UNITY_TESTS_RESULT}" = skipped
          else
            test "${RUNNER_PREFLIGHT_RESULT}" = success
            test "${UNITY_TESTS_RESULT}" = success
          fi
