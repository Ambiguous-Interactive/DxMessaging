name: Unity Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths-ignore:
      - "docs/architecture/performance.md"
      - "docs/architecture/perf-baseline.csv"
  workflow_dispatch:

concurrency:
  # Push runs share one group per ref, so consecutive default-branch pushes stay
  # serialized. Pull-request runs add the head SHA. Serializing those bought
  # nothing and cost the head that matters: `cancel-in-progress: false` below is
  # deliberate (a hard cancel mid-lease is the seat leak the four-layer
  # license-return guarantee exists to prevent), so a superseded run held the
  # shared group while its remaining legs waited on a scarce self-hosted runner
  # purely to abort on the per-leg head guard, and the run for the current head
  # sat pending with zero jobs for as long as that took -- 33 minutes on #402.
  # Licensed Unity work is serialized by the organization build lock, not by this
  # group, and every leg re-checks the pull-request head before it can reach that
  # lock, so two runs of one pull request can never both do licensed work (#332).
  group: unity-tests-${{ github.event.pull_request.number && format('{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: read

jobs:
  head-check:
    name: Unity head freshness
    # A second push to a pull request queues a second full matrix and does not
    # retire the first: `cancel-in-progress: false` above is deliberate, because
    # a hard cancel mid-lock is the exact scenario the four-layer license-return
    # guarantee exists to avoid. The head-SHA-keyed concurrency group above lets
    # the new run start anyway, so what is left to avoid is the superseded run
    # handing a scarce self-hosted runner to every remaining leg purely so that
    # leg can abort.
    #
    # Deciding it here, on GitHub-hosted infrastructure and before the lock is
    # in reach, costs a superseded run one cheap job instead of four
    # self-hosted ones. The per-leg `Require current PR head before setup`
    # guard stays: it covers the push that lands after this job has already
    # passed.
    #
    # Fail open. Anything other than a pull request, and any lookup that does
    # not return a head SHA, reports `superseded=false` and runs the matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.head.outputs.relevant }}
      superseded: ${{ steps.head.outputs.superseded }}
    steps:
      - name: Compare the event head against the live pull-request head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          relevant=true
          superseded=false
          if [ "${EVENT_NAME}" = pull_request ]; then
            live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" || live=
            if [ -z "${live}" ]; then
              echo "::warning::Live head lookup failed; treating ${EVENT_HEAD_SHA} as current."
            elif [ "${live}" != "${EVENT_HEAD_SHA}" ]; then
              echo "::notice::${EVENT_HEAD_SHA} is superseded by ${live}; skipping the Unity matrix."
              superseded=true
            fi
            if files="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')"; then
              documentation_only_pattern='^(docs/|\.docs-tests/|progress/|\.llm/|\.agents/|\.claude/|Samples~/.*\.(md|markdown)(\.meta)?$|(AGENTS|GOAL|PLAN)\.md(\.meta)?$|llms\.txt$|mkdocs\.yml$|requirements-docs\.(in|txt)(\.meta)?$)'
              non_documentation="$(printf '%s\n' "${files}" | grep -Ev "${documentation_only_pattern}" || true)"
              if [ -n "${files}" ] && [ -z "${non_documentation}" ]; then
                echo "::notice::Only documentation and agent-context files changed; skipping licensed Unity tests."
                relevant=false
              fi
            else
              echo "::warning::Changed-file lookup failed; running licensed Unity tests."
            fi
          fi
          echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"
          echo "superseded=${superseded}" >> "${GITHUB_OUTPUT}"

  runner-preflight:
    name: Self-hosted runner registration preflight
    # Runs on GitHub-hosted infrastructure before any self-hosted matrix entry
    # can queue. Reader-App or inventory failures are intentionally fail closed.
    #
    # Dependabot pull requests are excluded for the same reason fork pull
    # requests are: their jobs read from the separate Dependabot secret store,
    # so `secrets.BUILD_LOCK_READER_APP_ID` resolves empty and the fail-closed
    # preflight aborts with "Missing required input: reader-app-id" before it
    # can check anything. Running it there cannot pass, and the licensed Unity
    # secrets below are unreadable for the same reason. Dependency bumps are
    # validated by the full matrix on the post-merge push to master.
    needs:
      - head-check
    if: >-
      ${{
        needs.head-check.outputs.superseded != 'true' &&
        needs.head-check.outputs.relevant != 'false' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      # Keyed exactly like the workflow-level group. A `github.ref`-only key was
      # unreachable while that group serialized every run of a pull request; now
      # that it does not, the key has to match, or a newer run would cancel a
      # superseded run's preflight, skip that run's whole matrix, and leave its
      # aggregate reporting a result shape the gate below does not describe.
      group: ${{ github.workflow }}-runner-preflight-${{ github.event.pull_request.number && format('{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require a registered Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@c054699118065984d49b97cce685da090d57ab37 # post-v1.10.0
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  unity-tests:
    name: Unity ${{ matrix.unity-version }} all modes
    needs:
      - head-check
      - runner-preflight
    # Same-repository pull requests run licensed validation with organization
    # secrets and no environment approval. Fork pull requests and Dependabot
    # pull requests remain static-only: neither can read the organization Unity
    # serial or build-lock App secrets, so a licensed leg there fails on missing
    # credentials rather than on the change under test.
    if: >-
      ${{
        needs.head-check.outputs.superseded != 'true' &&
        needs.head-check.outputs.relevant != 'false' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository))
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 900
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        unity-version:
          - 2021.3.45f1
          - 2022.3.45f1
          - 6000.3.16f1
          - 6000.5.2f1
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@c054699118065984d49b97cce685da090d57ab37 # post-v1.10.0
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Remove stale Unity editor validator
        timeout-minutes: 2
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $parent = [IO.Path]::GetFullPath((Join-Path $workspace '.ci'))
          $target = [IO.Path]::GetFullPath((Join-Path $parent 'unity-helpers'))
          if (-not $target.StartsWith("$workspace\", [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Validator checkout path escaped the workspace.'
          }
          if (Test-Path -LiteralPath $parent) {
            $parentItem = Get-Item -LiteralPath $parent -Force
            if (($parentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Validator checkout parent is a reparse point.'
            }
          }
          if (Test-Path -LiteralPath $target) {
            $targetItem = Get-Item -LiteralPath $target -Force
            if (($targetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              $targetItem.Delete()
            } else {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          if (Test-Path -LiteralPath $target) {
            throw 'Validator checkout directory could not be removed.'
          }

      - name: Checkout trusted Unity editor validator
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
        with:
          repository: Ambiguous-Interactive/unity-helpers
          ref: 76712db791093a9c6b2eccdd9c7bd1b4f1cdb24d
          path: .ci/unity-helpers
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Require manually installed Unity editor
        timeout-minutes: 10
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          & "$env:GITHUB_WORKSPACE/.ci/unity-helpers/scripts/unity/ensure-editor.ps1" `
            -UnityVersion '${{ matrix.unity-version }}' `
            -InstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -ProvisioningProfile StandaloneWindowsIl2Cpp `
            -DiagnosticsPath (Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation') `
            -CiManagedOnly `
            -RequireHealthyExisting

      - name: Bind validated Unity editor
        timeout-minutes: 2
        shell: pwsh
        run: |
          # ensure-editor writes this summary from a finally block, so the evidence
          # exists for a failed gate too, and writing it under RUNNER_TEMP keeps it
          # out of reach of the repository checkout that follows.
          $source = Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation\ensure-editor-summary.json'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Unity editor validation evidence was not written: $source"
          }
          $summary = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3\${{ matrix.unity-version }}\Editor\Unity.exe'))
          # A summary written by a failed gate can record no editor at all, and
          # GetFullPath('') throws an ArgumentException instead of saying so.
          $recorded = [string]$summary.editorPath
          $actual = if ($recorded) { [IO.Path]::GetFullPath($recorded) } else { '(none recorded)' }
          if (-not [string]::Equals($actual, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Validated editor '$actual' did not match the canonical editor '$expected'."
          }
          "UNITY_EDITOR_PATH=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Enable Git long paths
        timeout-minutes: 2
        shell: pwsh
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Print runner diagnostics
        timeout-minutes: 2
        # Composite action runs PowerShell internally; `shell: bash` on this
        # self-hosted Windows runner resolved to the WSL stub at
        # C:\Windows\System32\bash.exe and failed with "Windows Subsystem
        # for Linux has no installed distributions." See FIX #4 sweep
        # report in the dev/wallstop/swap branch: never use plain
        # `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "default (organization lock wraps the Unity section)"

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      # Single source of truth for the assembly include list: the canonical
      # asmdef-discovery.js module. Extracted into a composite action so all
      # three Unity workflows share one implementation. shell: pwsh is enforced
      # inside the composite.
      - name: Compute EditMode test assembly list
        id: compute
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: editmode

      - name: Compute PlayMode test assembly list
        id: compute_playmode
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: playmode

      - name: Compute standalone test assembly list
        id: compute_standalone
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: standalone
          runtime-only: "true"

      # Unity work skips when no test assembly matched. Credential validation
      # and lock acquisition remain unconditional. The editor gate ran before
      # the repository checkout, so a failure there has already failed the job.
      # Editors and modules are installed manually by a runner administrator;
      # CI only verifies the exact trusted tool-cache install.
      # IL2CPP compiles generated C++ with `cl.exe`; Mono legs never touch it.
      # `assert-unity-host-prereqs` covers the VC++ RUNTIME (so the Editor
      # launches) but not the BUILD TOOLS (so IL2CPP can compile), and that gap
      # cost three licence seats and ~2h on 2026-07-31 (#333): three standalone
      # legs each took the organization lock, consumed a seat, built for twenty
      # minutes, then died with a message naming neither the host nor the cause.
      # Runs BEFORE the lock so a broken host costs seconds, not a seat.
      - name: Require an MSVC C++ toolchain for IL2CPP
        timeout-minutes: 3
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: ./scripts/unity/assert-msvc-toolchain.ps1

      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Require current PR head before lock acquisition
        if: >-
          ${{
            steps.compute.outputs.is-empty != 'true' ||
            steps.compute_playmode.outputs.is-empty != 'true' ||
            steps.compute_standalone.outputs.is-empty != 'true'
          }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@c054699118065984d49b97cce685da090d57ab37 # post-v1.10.0
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@c054699118065984d49b97cce685da090d57ab37 # post-v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-all-modes
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Upload Unity editor validation diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-editor-validation-${{ matrix.unity-version }}-all-modes
          path: ${{ runner.temp }}/dx-unity-editor-validation
          if-no-files-found: warn
          retention-days: 14

      - name: Run Unity Test Runner
        id: run_editmode
        if: ${{ !cancelled() && steps.compute.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 90
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_TEST_ASSEMBLIES: ${{ steps.compute.outputs.assemblies }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!UnityRuntime;!PerfBench;!PerfGate;!PerfBaseline"
        run: |
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t\${{ matrix.unity-version }}-editmode'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode editmode `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-editmode' `
            -ProjectPath $projectPath `
            -CachePath $cachePath `
            -LicenseReturnOwner Central `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      - name: Run Unity PlayMode tests
        id: run_playmode
        if: ${{ !cancelled() && steps.compute_playmode.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 90
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_TEST_ASSEMBLIES: ${{ steps.compute_playmode.outputs.assemblies }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!UnityRuntime;!PerfBench;!PerfGate;!PerfBaseline"
        run: |
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t\${{ matrix.unity-version }}-playmode'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode playmode `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-playmode' `
            -ProjectPath $projectPath `
            -CachePath $cachePath `
            -LicenseReturnOwner Central `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      # Keep standalone last. Its IL2CPP build is the longest mode, and the
      # central cleanup action below returns the final activation before the
      # editor-scoped organization lock is released.
      - name: Run Unity standalone tests
        id: run_standalone
        if: ${{ !cancelled() && steps.compute_standalone.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 150
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_TEST_ASSEMBLIES: ${{ steps.compute_standalone.outputs.assemblies }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!UnityRuntime;!PerfBench;!PerfGate;!PerfBaseline"
        run: |
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t\${{ matrix.unity-version }}-standalone'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode standalone `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-standalone' `
            -ProjectPath $projectPath `
            -CachePath $cachePath `
            -LicenseReturnOwner Central `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      # A mode failure is tolerated until all three modes have had a chance to
      # run. Preserve per-mode diagnostics and result verification, then fail
      # the editor-scoped job from one summary gate before central cleanup.
      - name: Dump EditMode log tail on failure or cancellation
        if: ${{ steps.run_editmode.outcome == 'failure' || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode
          label: Unity ${{ matrix.unity-version }} editmode

      - name: Dump PlayMode log tail on failure or cancellation
        if: ${{ steps.run_playmode.outcome == 'failure' || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode
          label: Unity ${{ matrix.unity-version }} playmode

      - name: Dump standalone log tail on failure or cancellation
        if: ${{ steps.run_standalone.outcome == 'failure' || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone
          label: Unity ${{ matrix.unity-version }} standalone

      # CLASS GUARD: Unity can fail before NUnit writes results. The shared
      # composite fails unless a results XML exists AND reports total > 0.
      # Skip on cancellation so a user-cancelled run does not emit the
      # generic "tests did not run" annotation -- the cancellation itself
      # is the explanation. Also skip if setup/editor-validation/lock work failed
      # before the Unity run step attempted; that earlier failure is then the
      # actionable signal. The guard still runs for intentional empty targets,
      # after a Unity-run failure (to surface "tests did not run" /
      # catastrophic-compile diagnostics), and on success (to confirm a real
      # result XML exists).
      - name: Verify EditMode tests actually ran
        id: verify_editmode
        if: >-
          ${{
            !cancelled() &&
            steps.compute.outcome == 'success' &&
            (steps.compute.outputs.is-empty == 'true' || steps.run_editmode.outcome != 'skipped')
          }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode
          label: Unity ${{ matrix.unity-version }} editmode
          expected-empty: ${{ steps.compute.outputs.is-empty }}

      - name: Verify PlayMode tests actually ran
        id: verify_playmode
        if: >-
          ${{
            !cancelled() &&
            steps.compute_playmode.outcome == 'success' &&
            (steps.compute_playmode.outputs.is-empty == 'true' || steps.run_playmode.outcome != 'skipped')
          }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode
          label: Unity ${{ matrix.unity-version }} playmode
          expected-empty: ${{ steps.compute_playmode.outputs.is-empty }}

      - name: Verify standalone tests actually ran
        id: verify_standalone
        if: >-
          ${{
            !cancelled() &&
            steps.compute_standalone.outcome == 'success' &&
            (steps.compute_standalone.outputs.is-empty == 'true' || steps.run_standalone.outcome != 'skipped')
          }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone
          label: Unity ${{ matrix.unity-version }} standalone
          expected-empty: ${{ steps.compute_standalone.outputs.is-empty }}

      - name: Upload EditMode test artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-editmode
          path: .artifacts/unity/${{ matrix.unity-version }}-editmode
          if-no-files-found: warn
          retention-days: 14

      - name: Upload PlayMode test artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-playmode
          path: .artifacts/unity/${{ matrix.unity-version }}-playmode
          if-no-files-found: warn
          retention-days: 14

      - name: Upload standalone test artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-standalone
          path: .artifacts/unity/${{ matrix.unity-version }}-standalone
          if-no-files-found: warn
          retention-days: 14

      - name: Require every Unity mode to pass
        if: ${{ !cancelled() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        shell: pwsh
        env:
          EDIT_COMPUTE: ${{ steps.compute.outcome }}
          EDIT_EMPTY: ${{ steps.compute.outputs.is-empty }}
          EDIT_RUN: ${{ steps.run_editmode.outcome }}
          EDIT_VERIFY: ${{ steps.verify_editmode.outcome }}
          PLAY_COMPUTE: ${{ steps.compute_playmode.outcome }}
          PLAY_EMPTY: ${{ steps.compute_playmode.outputs.is-empty }}
          PLAY_RUN: ${{ steps.run_playmode.outcome }}
          PLAY_VERIFY: ${{ steps.verify_playmode.outcome }}
          STANDALONE_COMPUTE: ${{ steps.compute_standalone.outcome }}
          STANDALONE_EMPTY: ${{ steps.compute_standalone.outputs.is-empty }}
          STANDALONE_RUN: ${{ steps.run_standalone.outcome }}
          STANDALONE_VERIFY: ${{ steps.verify_standalone.outcome }}
        run: |
          $failures = @()
          foreach ($mode in @(
            @{ Name = 'editmode'; Compute = $env:EDIT_COMPUTE; Empty = $env:EDIT_EMPTY; Run = $env:EDIT_RUN; Verify = $env:EDIT_VERIFY },
            @{ Name = 'playmode'; Compute = $env:PLAY_COMPUTE; Empty = $env:PLAY_EMPTY; Run = $env:PLAY_RUN; Verify = $env:PLAY_VERIFY },
            @{ Name = 'standalone'; Compute = $env:STANDALONE_COMPUTE; Empty = $env:STANDALONE_EMPTY; Run = $env:STANDALONE_RUN; Verify = $env:STANDALONE_VERIFY }
          )) {
            if ($mode.Compute -ne 'success') {
              $failures += "$($mode.Name): assembly discovery $($mode.Compute)"
            } elseif ($mode.Empty -eq 'true' -and $mode.Run -ne 'skipped') {
              $failures += "$($mode.Name): empty discovery unexpectedly ran tests ($($mode.Run))"
            } elseif ($mode.Empty -ne 'true' -and $mode.Run -ne 'success') {
              $failures += "$($mode.Name): test run $($mode.Run)"
            }
            if ($mode.Verify -ne 'success') {
              $failures += "$($mode.Name): result verification $($mode.Verify)"
            }
          }
          if ($failures.Count -gt 0) {
            throw "Unity mode failures: $($failures -join '; ')"
          }
          Write-Host 'All Unity modes completed and produced valid results.'

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@c054699118065984d49b97cce685da090d57ab37
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: unity-tests-${{ matrix.unity-version }}-all-modes

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@c054699118065984d49b97cce685da090d57ab37
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@c054699118065984d49b97cce685da090d57ab37 # post-v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-all-modes
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@c054699118065984d49b97cce685da090d57ab37
        with:
          # A leg that aborts before `Acquire organization Unity lock` runs never
          # took a seat, and this gate's own contract treats `acquired: false` as
          # proof that licensed cleanup was not required. Feeding it the skipped
          # step's EMPTY output instead made it fail closed on work that never
          # started, so a leg with one honest failure reported two (#327).
          #
          # This does not weaken the gate. It reads `outcome`, not `acquired`, and
          # only the two values that prove the step never executed map to 'false'.
          # An acquire that RAN and failed part-way reports outcome=failure while
          # `acquired` reads empty, so the empty value still flows through and the
          # gate still fails -- that ambiguous shape is the seat leak the bare
          # `if: always()` above exists to catch, and it stays caught.
          acquired: ${{ (steps.acquire_lock.outcome == 'skipped' || steps.acquire_lock.outcome == '') && 'false' || steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  # Single aggregate gate so branch protection can require ONE "Unity CI Success"
  # context instead of the individual matrix and preflight contexts.
  unity-ci-success:
    name: Unity CI Success
    needs:
      - head-check
      - runner-preflight
      - unity-tests
    # Exactly always() -- NEVER a falsifiable job-level if. A skipped required
    # check counts as passing and the latest run on a SHA wins, so a guard that
    # can be false on a pull_request could launder a red/pending gate into a
    # false green. The step below validates the four intentional skip shapes:
    # documentation-only, fork, and Dependabot PRs skip both licensed jobs
    # (the latter two cannot read the organization secrets those jobs require),
    # and a superseded head
    # skips them because the run for the current head is the one that counts.
    # A superseded run cannot launder anything -- branch protection reads only
    # the checks on the current head -- but it still has to report its shape
    # rather than go absent. head-check itself is never allowed to skip or
    # fail: it is what decides which of the two branches applies. Every other
    # run must execute Unity successfully.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Unity CI result shape
        shell: bash
        env:
          HEAD_CHECK_RESULT: ${{ needs.head-check.result }}
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          UNITY_TESTS_RESULT: ${{ needs.unity-tests.result }}
          RELEVANT: ${{ needs.head-check.outputs.relevant }}
          SUPERSEDED: ${{ needs.head-check.outputs.superseded }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          test "${HEAD_CHECK_RESULT}" = success
          if [ "${SUPERSEDED}" = "true" ] || [ "${RELEVANT}" = "false" ] || [ "${FORK_PR}" = "true" ] || [ "${DEPENDABOT_PR}" = "true" ]; then
            test "${RUNNER_PREFLIGHT_RESULT}" = skipped
            test "${UNITY_TESTS_RESULT}" = skipped
          else
            test "${RUNNER_PREFLIGHT_RESULT}" = success
            test "${UNITY_TESTS_RESULT}" = success
          fi
