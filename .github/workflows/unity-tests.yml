name: Unity Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths-ignore:
      - "docs/architecture/performance.md"
      - "docs/architecture/perf-baseline.csv"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: unity-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  head-check:
    name: Unity head freshness
    # A second push to a pull request queues a second full matrix and does not
    # retire the first. `cancel-in-progress: false` above is deliberate -- a
    # hard cancel mid-lock is the exact scenario the four-layer license-return
    # guarantee exists to avoid -- so the superseded run keeps the concurrency
    # group until it has burned through every leg, and the run for the commit
    # that matters cannot start. `Unity CI Success` is then absent on the
    # current head, which reads as a blocked pull request on a check nobody
    # misconfigured.
    #
    # Deciding it here, on GitHub-hosted infrastructure and before the lock is
    # in reach, costs a superseded run one cheap job instead of nine
    # self-hosted ones. The per-leg `Require current PR head before setup`
    # guard stays: it covers the push that lands after this job has already
    # passed.
    #
    # Fail open. Anything other than a pull request, and any lookup that does
    # not return a head SHA, reports `superseded=false` and runs the matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      superseded: ${{ steps.head.outputs.superseded }}
    steps:
      - name: Compare the event head against the live pull-request head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          superseded=false
          if [ "${EVENT_NAME}" = pull_request ]; then
            live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" || live=
            if [ -z "${live}" ]; then
              echo "::warning::Live head lookup failed; treating ${EVENT_HEAD_SHA} as current."
            elif [ "${live}" != "${EVENT_HEAD_SHA}" ]; then
              echo "::notice::${EVENT_HEAD_SHA} is superseded by ${live}; skipping the Unity matrix."
              superseded=true
            fi
          fi
          echo "superseded=${superseded}" >> "${GITHUB_OUTPUT}"

  runner-preflight:
    name: Self-hosted runner registration preflight
    # Runs on GitHub-hosted infrastructure before any self-hosted matrix entry
    # can queue. Reader-App or inventory failures are intentionally fail closed.
    #
    # Dependabot pull requests are excluded for the same reason fork pull
    # requests are: their jobs read from the separate Dependabot secret store,
    # so `secrets.BUILD_LOCK_READER_APP_ID` resolves empty and the fail-closed
    # preflight aborts with "Missing required input: reader-app-id" before it
    # can check anything. Running it there cannot pass, and the licensed Unity
    # secrets below are unreadable for the same reason. Dependency bumps are
    # validated by the full matrix on the post-merge push to master.
    needs:
      - head-check
    if: >-
      ${{
        needs.head-check.outputs.superseded != 'true' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require a registered Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@3741b56ceab4a68ba4c09fe7e91e804b53ff2412 # v1.10.0
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  unity-tests:
    name: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }}
    needs:
      - head-check
      - runner-preflight
    # Same-repository pull requests run licensed validation with organization
    # secrets and no environment approval. Fork pull requests and Dependabot
    # pull requests remain static-only: neither can read the organization Unity
    # serial or build-lock App secrets, so a licensed leg there fails on missing
    # credentials rather than on the change under test.
    if: >-
      ${{
        needs.head-check.outputs.superseded != 'true' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository))
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 900
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        unity-version:
          - 2021.3.45f1
          - 2022.3.45f1
          - 6000.3.16f1
        test-mode:
          - editmode
          - playmode
          - standalone
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@3741b56ceab4a68ba4c09fe7e91e804b53ff2412 # v1.10.0
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Remove stale Unity editor validator
        timeout-minutes: 2
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $parent = [IO.Path]::GetFullPath((Join-Path $workspace '.ci'))
          $target = [IO.Path]::GetFullPath((Join-Path $parent 'unity-helpers'))
          if (-not $target.StartsWith("$workspace\", [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Validator checkout path escaped the workspace.'
          }
          if (Test-Path -LiteralPath $parent) {
            $parentItem = Get-Item -LiteralPath $parent -Force
            if (($parentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Validator checkout parent is a reparse point.'
            }
          }
          if (Test-Path -LiteralPath $target) {
            $targetItem = Get-Item -LiteralPath $target -Force
            if (($targetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              $targetItem.Delete()
            } else {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          if (Test-Path -LiteralPath $target) {
            throw 'Validator checkout directory could not be removed.'
          }

      - name: Checkout trusted Unity editor validator
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
        with:
          repository: Ambiguous-Interactive/unity-helpers
          ref: 76712db791093a9c6b2eccdd9c7bd1b4f1cdb24d
          path: .ci/unity-helpers
          persist-credentials: false
          clean: true

      - name: Require manually installed Unity editor
        timeout-minutes: 10
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          & "$env:GITHUB_WORKSPACE/.ci/unity-helpers/scripts/unity/ensure-editor.ps1" `
            -UnityVersion '${{ matrix.unity-version }}' `
            -InstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -ProvisioningProfile ${{ fromJSON('{"editmode":"EditorOnly","playmode":"EditorOnly","standalone":"StandaloneWindowsIl2Cpp"}')[matrix.test-mode] }} `
            -DiagnosticsPath (Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation') `
            -CiManagedOnly `
            -RequireHealthyExisting

      - name: Bind validated Unity editor
        timeout-minutes: 2
        shell: pwsh
        run: |
          # ensure-editor writes this summary from a finally block, so the evidence
          # exists for a failed gate too, and writing it under RUNNER_TEMP keeps it
          # out of reach of the repository checkout that follows.
          $source = Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation\ensure-editor-summary.json'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Unity editor validation evidence was not written: $source"
          }
          $summary = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3\${{ matrix.unity-version }}\Editor\Unity.exe'))
          # A summary written by a failed gate can record no editor at all, and
          # GetFullPath('') throws an ArgumentException instead of saying so.
          $recorded = [string]$summary.editorPath
          $actual = if ($recorded) { [IO.Path]::GetFullPath($recorded) } else { '(none recorded)' }
          if (-not [string]::Equals($actual, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Validated editor '$actual' did not match the canonical editor '$expected'."
          }
          "UNITY_EDITOR_PATH=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Enable Git long paths
        timeout-minutes: 2
        shell: pwsh
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Print runner diagnostics
        timeout-minutes: 2
        # Composite action runs PowerShell internally; `shell: bash` on this
        # self-hosted Windows runner resolved to the WSL stub at
        # C:\Windows\System32\bash.exe and failed with "Windows Subsystem
        # for Linux has no installed distributions." See FIX #4 sweep
        # report in the dev/wallstop/swap branch: never use plain
        # `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "default (organization lock wraps the Unity section)"

      - name: Cache Unity Library and package caches
        timeout-minutes: 30
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          PACKAGE_HASH: >-
            ${{ hashFiles(
              'package.json',
              'Runtime/**',
              'Editor/**',
              'Tests/**',
              'scripts/unity/run-ci-tests.ps1',
              'scripts/unity/lib/asmdef-discovery.js',
              '.github/actions/compute-unity-assemblies/action.yml'
            ) }}
        with:
          path: |
            .artifacts/unity/projects/${{ matrix.unity-version }}-${{ matrix.test-mode }}/Library
            .artifacts/unity/cache/${{ matrix.unity-version }}
          key: Library-${{ runner.os }}-${{ runner.arch }}-${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ env.PACKAGE_HASH }}

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      # Single source of truth for the assembly include list: the canonical
      # asmdef-discovery.js module. Extracted into a composite action so all
      # three Unity workflows share one implementation. shell: pwsh is enforced
      # inside the composite.
      - name: Compute test assembly list
        id: compute
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: "${{ matrix.test-mode }}"
          runtime-only: "${{ matrix.test-mode == 'standalone' && 'true' || 'false' }}"

      # Unity work skips when no test assembly matched. Credential validation
      # and lock acquisition remain unconditional. The editor gate ran before
      # the repository checkout, so a failure there has already failed the job.
      # Editors and modules are installed manually by a runner administrator;
      # CI only verifies the exact trusted tool-cache install.
      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Require current PR head before lock acquisition
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@3741b56ceab4a68ba4c09fe7e91e804b53ff2412 # v1.10.0
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@3741b56ceab4a68ba4c09fe7e91e804b53ff2412 # v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Upload Unity editor validation diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-editor-validation-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: ${{ runner.temp }}/dx-unity-editor-validation
          if-no-files-found: warn
          retention-days: 14

      - name: Run Unity Test Runner
        id: run_tests
        if: ${{ steps.compute.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        # 150 (was 120): the standalone leg builds a NON-development IL2CPP
        # player with the Release C++ configuration. Measured PR runs showed the
        # Debug C++ configuration reduces native compile time but makes the
        # standalone player test run far slower, so Release remains faster
        # end-to-end and closer to shipped-player behavior. A run-ci-tests.ps1
        # change rotates the Library cache key, so first runs build cold. The
        # editmode/playmode legs finish far below this; stays well under the job
        # timeout (900) so the step clock fires first and releases the
        # shared Unity seat.
        timeout-minutes: 150
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!UnityRuntime;!PerfBench;!PerfGate;!PerfBaseline"
        run: |
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode '${{ matrix.test-mode }}' `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}' `
            -LicenseReturnOwner Central `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      # CANCELLATION + TIMEOUT DIAGNOSTIC: when Unity 2022 hangs in csc the
      # runner step times out (or the operator cancels), and the verify
      # step below skips -- so its catastrophic-pattern scan never fires
      # either. This step covers both
      # failure() AND cancelled() so the operator has SOMETHING to look at
      # in the GitHub summary (the tail of unity.log + any catastrophic
      # patterns the partial log happened to surface). Best-effort: never
      # fails the job, no-ops when unity.log doesn't exist (cancellation
      # before Unity launched).
      - name: Dump Unity log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          label: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }}

      # CLASS GUARD: Unity can fail before NUnit writes results. The shared
      # composite fails unless a results XML exists AND reports total > 0.
      # Skip on cancellation so a user-cancelled run does not emit the
      # generic "tests did not run" annotation -- the cancellation itself
      # is the explanation. Also skip if setup/editor-validation/lock work failed
      # before the Unity run step attempted; that earlier failure is then the
      # actionable signal. The guard still runs for intentional empty targets,
      # after a Unity-run failure (to surface "tests did not run" /
      # catastrophic-compile diagnostics), and on success (to confirm a real
      # result XML exists).
      - name: Verify tests actually ran
        if: >-
          ${{
            !cancelled() &&
            steps.compute.outcome == 'success' &&
            (steps.compute.outputs.is-empty == 'true' || steps.run_tests.outcome != 'skipped')
          }}
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          label: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }}
          expected-empty: ${{ steps.compute.outputs.is-empty }}

      - name: Upload Unity test artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          if-no-files-found: warn
          retention-days: 14

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@ce12fde93e67a27062350601fb97e4a2f546d405
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: unity-tests

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@ce12fde93e67a27062350601fb97e4a2f546d405
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@ce12fde93e67a27062350601fb97e4a2f546d405
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@ce12fde93e67a27062350601fb97e4a2f546d405
        with:
          acquired: ${{ steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  # Single aggregate gate so branch protection can require ONE "Unity CI Success"
  # context instead of the individual matrix and preflight contexts.
  unity-ci-success:
    name: Unity CI Success
    needs:
      - head-check
      - runner-preflight
      - unity-tests
    # Exactly always() -- NEVER a falsifiable job-level if. A skipped required
    # check counts as passing and the latest run on a SHA wins, so a guard that
    # can be false on a pull_request could launder a red/pending gate into a
    # false green. The step below validates the only three intentional skip
    # shapes: fork PRs and Dependabot PRs skip both licensed jobs (neither can
    # read the organization secrets those jobs require), and a superseded head
    # skips them because the run for the current head is the one that counts.
    # A superseded run cannot launder anything -- branch protection reads only
    # the checks on the current head -- but it still has to report its shape
    # rather than go absent. head-check itself is never allowed to skip or
    # fail: it is what decides which of the two branches applies. Every other
    # run must execute Unity successfully.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Unity CI result shape
        shell: bash
        env:
          HEAD_CHECK_RESULT: ${{ needs.head-check.result }}
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          UNITY_TESTS_RESULT: ${{ needs.unity-tests.result }}
          SUPERSEDED: ${{ needs.head-check.outputs.superseded }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          test "${HEAD_CHECK_RESULT}" = success
          if [ "${SUPERSEDED}" = "true" ] || [ "${FORK_PR}" = "true" ] || [ "${DEPENDABOT_PR}" = "true" ]; then
            test "${RUNNER_PREFLIGHT_RESULT}" = skipped
            test "${UNITY_TESTS_RESULT}" = skipped
          else
            test "${RUNNER_PREFLIGHT_RESULT}" = success
            test "${UNITY_TESTS_RESULT}" = success
          fi
