name: Sync Wiki

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/**"
      - "scripts/wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Wiki Content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Markdown files
        run: |
          echo "Validating Markdown structure..."
          find docs -name "*.md" -type f | while read -r file; do
            # Check for valid UTF-8
            if ! iconv -f UTF-8 -t UTF-8 "$file" > /dev/null 2>&1; then
              echo "ERROR: Invalid UTF-8 in $file"
              exit 1
            fi
            # Check file is not empty
            if [ ! -s "$file" ]; then
              echo "ERROR: Empty file: $file"
              exit 1
            fi
          done
          echo "Validation passed"

  sync:
    name: Sync to Wiki
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main
          persist-credentials: false

      - name: Clone wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Transform and copy documentation
        run: |
          cd main
          node scripts/wiki/transform-docs-to-wiki.js ../wiki

      - name: Generate sidebar
        run: |
          cd main
          node scripts/wiki/generate-wiki-sidebar.js ../wiki

      - name: Validate transformed content
        run: |
          cd wiki
          if [ ! -f "Home.md" ]; then
            echo "::error::Home.md not generated"
            exit 1
          fi
          echo "Content validation passed"

      - name: Commit and push to wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "Sync wiki from docs/ - ${{ github.sha }}"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          wiki_branch="$(git branch --show-current)"

          for i in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push; then
              echo "Push successful"
              exit 0
            fi
            if [ "$i" -eq 3 ]; then
              echo "::error::Failed to push after 3 attempts"
              exit 1
            fi
            echo "::warning::Wiki push attempt $i failed; fetching origin/${wiki_branch} before retry."
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              fetch --no-tags origin "${wiki_branch}"
            if ! git rebase "origin/${wiki_branch}"; then
              echo "::error::Failed to rebase wiki sync commit onto origin/${wiki_branch}."
              exit 1
            fi
            sleep 5
          done
