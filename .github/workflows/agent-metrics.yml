name: Agent Metrics

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to include
        type: string
        default: "90"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metrics:
    uses: Ambiguous-Interactive/review-tools/.github/workflows/agent-metrics.yml@35be03f3bcae96a5ae3a3032d7db8eb0a0738d66 # v1.1.1
    with:
      days: ${{ fromJSON(inputs.days || '90') }}
      timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
