name: Runner Audit (Windows)
# cspell:ignore PSHOME

# Operator-driven, workflow_dispatch-only audit of a self-hosted Windows
# runner's host prerequisites, exact Unity editors, and required modules.
# The optional #510 probes record outcome-free host sensors and validate one
# pilot IL2CPP comparison player's contract path on ELI-MACHINE.
# This workflow is intentionally validation-only: GitHub Actions does not have
# the administrator credentials required to install or repair runner software.
# An administrator performs all installation and repair directly on the host,
# then dispatches this audit to confirm the runner is ready.
#
# Targeting a SPECIFIC runner (HARD-FAIL on wrong target):
#   * ELI-MACHINE alone carries the `fast` label, so ELI requests select it.
#   * DAD-MACHINE shares the generic Windows labels. To guarantee a DAD audit,
#     take ELI offline before dispatch and restore it afterward.
#   * If the dispatch lands on the wrong runner the workflow HARD-FAILS with
#     `::error::` and exit 1 (NOT a silent ::warning::). This is by design:
#     a silent audit of the WRONG machine would be operator-fatal.
#   * Long-term fix: add machine-name labels to runner agents so the
#     `runs-on:` set can include the runner name itself.
#
# Windows PowerShell 5.1 is used because the audit must still report a missing
# PowerShell 7 prerequisite.

on:
  workflow_dispatch:
    inputs:
      runner-label:
        description: >-
          (HARD-FAIL on wrong target) Name of the runner you want to audit
          (DAD-MACHINE or ELI-MACHINE). Both runners share the same label set,
          so the scheduler may land on either machine. If it lands on the
          WRONG one, this workflow FAILS FAST with exit 1 -- it does NOT
          silently audit the unintended machine. Take the unwanted runner
          offline (Settings -> Runners) BEFORE dispatching to guarantee
          targeting.
        required: true
        type: choice
        options:
          - DAD-MACHINE
          - ELI-MACHINE
      perf-host-characterization:
        description: 'Capture the outcome-free #510 performance-host sensor probe on ELI-MACHINE.'
        required: false
        type: boolean
        default: false
      perf-host-load:
        description: 'Apply synthetic load to the selected ELI-MACHINE processors during the sensor probe.'
        required: false
        type: boolean
        default: false
      perf-host-monitor-smoke:
        description: 'Exercise #510 player-time sampler ready/stop signals without a Unity player.'
        required: false
        type: boolean
        default: false
      perf-pilot-contract-smoke:
        description: 'Build one pilot-only IL2CPP comparison player and run contract tests on ELI without throughput rows.'
        required: false
        type: boolean
        default: false
# Forbid concurrent audits OF THIS REPO across BOTH runners. The group
# is intentionally NOT parameterized by `inputs.runner-label` so that two
# dispatches (one per machine) cannot overlap. This is stricter than per-runner
# concurrency: any in-flight audit anywhere blocks another audit from starting.
# Distinct from `wallstop-organization-builds` (the Unity build lock) -- host
# audits do not enter the Unity license seat path. The optional IL2CPP contract
# smoke acquires that lock before using the Unity license seat.
concurrency:
  group: runner-audit-windows
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Preflight convention: every job whose runs-on declares `self-hosted`
  # must `needs:` a runner-registration preflight (see
  # docs/runbooks/unity-runners-after-transfer.md). This mirrors the
  # release.yml runner-preflight pattern exactly.
  runner-preflight:
    name: Self-hosted runner registration preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require a registered Windows Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  bootstrap:
    # F9: surface the mode (Audit vs Maintenance) in the job display name so
    # operators reading the Actions UI immediately see which mode this run is
    # without expanding the inputs.
    name: Audit ${{ inputs.runner-label }}
    needs:
      - runner-preflight
    # ELI has a unique fast label; DAD still needs the identity guard because
    # it has no unique label. The generic set remains available for DAD audits.
    runs-on: ${{ inputs.runner-label == 'ELI-MACHINE' && fromJSON('["self-hosted","Windows","RAM-64GB","fast"]') || fromJSON('["self-hosted","Windows","RAM-64GB"]') }}
    # F13: inherit workflow-level permissions (contents: read, actions: read).
    # No job-level override -- the previous explicit block silently dropped
    # `actions: read` and shadowed the workflow-level intent.
    timeout-minutes: 360
    steps:
      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        # Shallow checkout: the audit only needs scripts/unity/* and a
        # composite action; no history depth required.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          persist-credentials: false

      - name: Confirm runner identity (hard-fail on wrong target)
        # F15: Windows PowerShell 5.1, NOT pwsh, so the audit can report a
        # missing PowerShell 7 prerequisite.
        shell: powershell
        env:
          DXM_BOOTSTRAP_REQUESTED_RUNNER: ${{ inputs.runner-label }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $actual = $env:RUNNER_NAME
          $requested = $env:DXM_BOOTSTRAP_REQUESTED_RUNNER
          Write-Host "Requested runner: $requested"
          Write-Host "Actual runner:    $actual"
          # F2: HARD-FAIL on mismatch. The previous ::warning:: would silently
          # audit the wrong machine when the scheduler picked
          # the runner the operator did NOT intend.
          if (-not [string]::IsNullOrWhiteSpace($actual) -and -not [string]::IsNullOrWhiteSpace($requested)) {
              if (-not [string]::Equals($actual, $requested, [System.StringComparison]::OrdinalIgnoreCase)) {
                  Write-Host ("::error::Runner audit dispatched to '$actual' but operator requested '$requested'. Cancel this run, take '$actual' offline (Settings -> Runners or 'gh api -X POST " +
                  "orgs/<org>/actions/runners/<id>/...'), then re-dispatch so the run lands on '$requested'. Alternatively, add machine-name labels to runner agents so 'runs-on:' can pin to a " +
                  "specific runner.")
                  if ($env:GITHUB_STEP_SUMMARY) {
                      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("## Runner Audit (FAILED: wrong target)`n`n- Requested runner: ``$requested```n- Actual runner: ``$actual```n- Action: " +
                      "hard-fail; take ``$actual`` offline and re-dispatch.")
                  }
                  exit 1
              }
          }
          # Surface to the step summary for the Actions UI.
          $summary = @(
              "## Runner Audit"
              ""
              "- Requested runner: ``$requested``"
              "- Actual runner: ``$actual``"
              "- Mode: ``validation-only``"
          ) -join "`n"
          if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }

      - name: Capture outcome-free performance host conditions
        if: ${{ inputs['perf-host-characterization'] || inputs['perf-host-load'] }}
        shell: pwsh
        timeout-minutes: 6
        env:
          DXM_REQUESTED_RUNNER: ${{ inputs.runner-label }}
          DXM_PERF_HOST_LOAD: ${{ inputs.perf-host-load }}
        run: |
          if ($env:DXM_REQUESTED_RUNNER -cne 'ELI-MACHINE' -or $env:RUNNER_NAME -cne 'ELI-MACHINE') {
              throw 'Performance host characterization is pinned to ELI-MACHINE.'
          }
          $path = '.artifacts/runner-bootstrap/host-characterization.json'
          $profile = '.artifacts/runner-bootstrap/performance-cpu-profile.json'
          ./scripts/unity/resolve-performance-cpu-profile.ps1 -OutputJson $profile
          $applyLoad = $env:DXM_PERF_HOST_LOAD -eq 'true'
          ./scripts/unity/collect-perf-host-characterization.ps1 `
            -OutputPath $path -CpuProfilePath $profile -CpuLoad:$applyLoad -SampleCount 120
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "- Outcome-free host characterization SHA-256: ``$hash``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Smoke-test player-time host sampler signals
        if: ${{ inputs['perf-host-monitor-smoke'] }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          if ($env:RUNNER_NAME -cne 'ELI-MACHINE') {
              throw 'Performance host sampler smoke test is pinned to ELI-MACHINE.'
          }
          $root = '.artifacts/runner-bootstrap'
          $profile = Join-Path $root 'performance-cpu-profile.json'
          $output = Join-Path $root 'host-monitor-smoke.json'
          $ready = "$output.ready"
          $stop = "$output.stop"
          ./scripts/unity/resolve-performance-cpu-profile.ps1 -OutputJson $profile
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = Join-Path $PSHOME 'pwsh.exe'
          foreach ($argument in @(
              '-NoProfile', '-NonInteractive', '-File',
              (Join-Path $PWD 'scripts/unity/collect-perf-host-characterization.ps1'),
              '-OutputPath', (Join-Path $PWD $output),
              '-CpuProfilePath', (Join-Path $PWD $profile),
              '-ReadySignalPath', (Join-Path $PWD $ready),
              '-StopSignalPath', (Join-Path $PWD $stop),
              '-SampleCount', '20'
          )) { [void]$start.ArgumentList.Add($argument) }
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($start)
          try {
              $deadline = [DateTime]::UtcNow.AddSeconds(60)
              while (-not (Test-Path -LiteralPath $ready -PathType Leaf)) {
                  if ($process.HasExited -or [DateTime]::UtcNow -ge $deadline) {
                      throw 'Host sampler did not become ready.'
                  }
                  Start-Sleep -Milliseconds 100
              }
              Start-Sleep -Seconds 7
              Set-Content -LiteralPath $stop -Value ([DateTime]::UtcNow.ToString('O'))
              if (-not $process.WaitForExit(120000)) { throw 'Host sampler did not stop.' }
              if ($process.ExitCode -ne 0) {
                  throw "Host sampler failed: $($process.StandardError.ReadToEnd())"
              }
              $record = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
              if (
                  $record.purpose -cne 'player-time-host-telemetry' -or
                  $record.loadMode -cne 'player-workload-v1' -or
                  $record.stopReason -cne 'player-finished' -or
                  $record.actualSampleCount -lt 2 -or
                  $record.actualSampleCount -ge 20
              ) { throw 'Host sampler signal contract failed.' }
              $hash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
              "- Player-time sampler smoke SHA-256: ``$hash``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } finally {
              if (-not $process.HasExited) {
                  $process.Kill($true)
                  [void]$process.WaitForExit(5000)
              }
              $process.Dispose()
          }

      - name: Run runner audit (single-step transcript)
        # F5/F7: a single PowerShell 5.1 step opens the transcript, invokes
        # the audit script, and Stop-Transcripts in a finally{} -- the
        # previous design split Start-Transcript and the bootstrap into
        # separate pwsh processes, leaving the artifact empty.
        # F15: Windows PowerShell 5.1 -- see header comment.
        # F22: we deliberately do NOT `uses: ./.github/actions/assert-unity-host-prereqs`
        # here, even though that composite would normally own this orchestration.
        # The composite contains a PS 5.1 preflight (F14) that hard-fails when
        # pwsh is missing, which this workflow must report. This workflow's
        # logic stays thin: it owns only the transcript wrapper
        # and always passes DetectOnly. All detection logic lives inside
        # scripts/unity/maintain-windows-runner.ps1 and
        # scripts/unity/bootstrap-windows-runner.ps1.
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $artifactDir = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, '.artifacts', 'runner-bootstrap')
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $timestamp = (Get-Date -Format 'yyyyMMdd-HHmmss')
          $logPath = Join-Path $artifactDir ("maintenance-{0}-{1}-{2}.log" -f $timestamp, $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          Write-Host "Transcript: $logPath"

          Write-Host "Resolved mode: validation-only"

          # F6: drop the GITHUB_ACTION_PATH `../../../` ascent. We are inside
          # a workflow (not a composite), so $GITHUB_WORKSPACE is reliably
          # the repo root post-checkout (actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 above guarantees
          # the script is present at this path).
          $script = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, 'scripts', 'unity', 'maintain-windows-runner.ps1')
          if (-not (Test-Path -LiteralPath $script)) {
              Write-Host "::error::Runner maintenance script not found at $script"
              exit 1
          }

          $code = 0
          try {
              Start-Transcript -Path $logPath -Force | Out-Null
              . $script
              $unityVersions = @('2021.3.45f1', '2022.3.45f1', '6000.3.16f1', '6000.5.2f1')
              $provisioningProfile = 'StandaloneWindowsIl2Cpp'
              $installRoot = Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3'
              $maintenanceArgs = @{
                  UnityVersions = $unityVersions
                  ProvisioningProfile = $provisioningProfile
                  InstallRoot = $installRoot
                  DiagnosticsRoot = $artifactDir
                  DetectOnly = $true
              }
              $code = Invoke-WindowsRunnerMaintenance @maintenanceArgs
          } finally {
              try { Stop-Transcript | Out-Null } catch { Write-Host "::notice::Stop-Transcript: $($_.Exception.Message) (non-fatal)" }
          }

          Write-Host "Runner maintenance exit code: $code"
          if ($env:GITHUB_STEP_SUMMARY) {
              $label = switch ($code) {
                  0 { 'ok' }
                  2 { 'detect-only-missing' }
                  3 { 'mutex-busy' }
                  4 { 'runner-busy' }
                  default { "fail($code)" }
              }
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Runner maintenance result: ``" + $label + "`` (exit $code)")
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Transcript: ``" + $logPath + "``")
          }
          if ($code -ne 0) { exit $code }

      # F1: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 -- matches the repo-wide pinned
      # version used by release.yml/unity-tests.yml/unity-benchmarks.yml.
      # F19: if-no-files-found is `error` (not `warn`) so a missing transcript
      # is a HARD failure rather than a silent empty artifact upload.
      - name: Upload bootstrap transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-bootstrap-${{ inputs.runner-label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/runner-bootstrap/**
          if-no-files-found: error
          retention-days: 30

  pilot-contract-smoke:
    name: Pilot IL2CPP contract smoke on ELI
    if: ${{ inputs['perf-pilot-contract-smoke'] }}
    needs:
      - runner-preflight
      - bootstrap
    runs-on: [self-hosted, Windows, RAM-64GB, fast]
    timeout-minutes: 600
    steps:
      - name: Require ELI request and runner
        shell: pwsh
        timeout-minutes: 1
        run: |
          if ('${{ inputs.runner-label }}' -cne 'ELI-MACHINE' -or $env:RUNNER_NAME -cne 'ELI-MACHINE') {
            throw 'Pilot contract smoke requires an ELI-MACHINE request and the ELI-MACHINE runner.'
          }

      - name: Require manually installed Unity editor
        id: ensure_unity_editor
        timeout-minutes: 10
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/ensure-unity-editor@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          unity-version: 6000.5.2f1
          install-root: ${{ runner.tool_cache }}\u6-v3
          provisioning-profile: StandaloneWindowsIl2Cpp
          diagnostics-path: unity-editor-check.json
          ci-managed-only: true
          require-healthy-existing: true

      - name: Enable Git long paths
        shell: pwsh
        timeout-minutes: 2
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        id: setup_node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'

      - name: Install artifact tooling dependencies
        id: install_dependencies
        timeout-minutes: 2
        shell: pwsh
        run: |
          $tooling = Join-Path $env:GITHUB_WORKSPACE '.artifacts/node-tooling'
          New-Item -ItemType Directory -Path $tooling -Force | Out-Null
          Copy-Item package.json, package-lock.json -Destination $tooling
          npm ci --prefix "$tooling" --userconfig "$env:GITHUB_WORKSPACE/.npmrc" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NODE_PATH=$(Join-Path $tooling 'node_modules')" >> $env:GITHUB_ENV

      - name: Compute comparison assembly list
        id: compute_standalone
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          include-comparisons: 'true'
          target: standalone

      - name: Require comparison assemblies
        timeout-minutes: 1
        shell: pwsh
        run: |
          if ('${{ steps.compute_standalone.outputs.is-empty }}' -ne 'false') {
            throw 'Pilot contract smoke requires the comparison test assemblies.'
          }

      - name: Resolve pinned performance CPU profile
        id: cpu_profile
        timeout-minutes: 2
        shell: pwsh
        run: |
          $artifactsPath = '.artifacts/unity/pilot-contract-smoke/${{ github.run_id }}-${{ github.run_attempt }}'
          New-Item -ItemType Directory -Force -Path $artifactsPath | Out-Null
          $profilePath = Join-Path $artifactsPath 'performance-cpu-profile.json'
          ./scripts/unity/resolve-performance-cpu-profile.ps1 -OutputJson $profilePath
          $profile = Get-Content -LiteralPath $profilePath -Raw | ConvertFrom-Json
          if (
            $profile.schemaVersion -ne 1 -or
            $profile.executionProfileId -cne 'highest-efficiency-class-affinity-normal-v1' -or
            $profile.cpuModel -notmatch 'i9-13900KF' -or
            $profile.affinityMask -cne '0xFFFF' -or
            $profile.priorityClass -cne 'Normal'
          ) { throw 'Pilot contract smoke CPU profile does not match the pinned ELI selection.' }
          "affinity-mask=$($profile.affinityMask)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Require MSVC C++ toolchain
        timeout-minutes: 3
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: ./scripts/unity/assert-msvc-toolchain.ps1

      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: pilot-contract-${{ github.run_id }}-${{ github.run_attempt }}
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Build and run pilot comparison contracts
        id: run_contracts
        if: ${{ steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 120
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DX_PERF_COMMIT: ${{ github.sha }}
        run: |
          $artifactsPath = '.artifacts/unity/pilot-contract-smoke/${{ github.run_id }}-${{ github.run_attempt }}'
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\p\pc${{ github.run_id }}a${{ github.run_attempt }}'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\6000.5.2f1'
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion 6000.5.2f1 `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode standalone `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath $artifactsPath `
            -ProjectPath $projectPath `
            -CachePath $cachePath `
            -TestCategory ComparisonContract `
            -IncludeComparisons `
            -CanonicalProfilePath '.github/perf/canonical-il2cpp-profile.v1.json' `
            -StandalonePlayerRunCount 5 `
            -StandalonePlayerBatchOrders 'ABBABAAB,BAABABBA,ABBABAAB,BAABABBA,ABBABAAB' `
            -StandalonePilotCpuWorkIterationsPerBatch 0 `
            -StandalonePlayerProcessorAffinityMask 65535 `
            -StandalonePlayerPriorityClass Normal `
            -LicenseReturnOwner Central `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      - name: Require five contract-only player launches and valid host health
        if: ${{ steps.run_contracts.outcome == 'success' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = '.artifacts/unity/pilot-contract-smoke/${{ github.run_id }}-${{ github.run_attempt }}'
          $evidence = Get-Content -LiteralPath (Join-Path $root 'same-player-repeats/same-player-evidence.json') -Raw | ConvertFrom-Json
          if ($evidence.runCount -ne 5 -or @($evidence.runs).Count -ne 5 -or $evidence.playerDirectoryManifestMatches -ne $true) {
            throw 'Pilot contract smoke did not retain five launches of one unchanged player.'
          }
          foreach ($run in $evidence.runs) {
            $health = Get-Content -LiteralPath (Join-Path $root "same-player-repeats/$($run.hostTelemetryHealthFile)") -Raw | ConvertFrom-Json
            if ($health.valid -ne $true -or @($health.reasons).Count -ne 0) {
              throw "Pilot contract smoke host health failed on launch $($run.runIndex)."
            }
            if (Select-String -LiteralPath (Join-Path $root $run.resultsPath) -Pattern 'DXM_PAIRED_COMPARISON' -Quiet) {
              throw "Pilot contract smoke unexpectedly measured paired throughput on launch $($run.runIndex)."
            }
          }
          $build = Get-Content -LiteralPath (Join-Path $root 'pilot-build-evidence.json') -Raw | ConvertFrom-Json
          if ($build.projectWasAbsentBefore -ne $true -or $build.sourceCommit -cne '${{ github.sha }}') {
            throw 'Pilot contract smoke build provenance does not match the checked-out source.'
          }
          "- Pilot contract smoke: five healthy launches, no paired throughput rows; build invocation ``$($build.buildInvocationId)``." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Redact pilot contract artifacts
        id: redact_pilot
        if: ${{ always() && steps.setup_node.outcome == 'success' && steps.install_dependencies.outcome == 'success' }}
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/pilot-contract-smoke/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload pilot contract artifacts
        if: ${{ always() && steps.redact_pilot.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pilot-contract-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/unity/pilot-contract-smoke/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@d79e1cc2acc892b619db2ca46f78291ca427016b
        with:
          unity-version: 6000.5.2f1
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: pilot-contract-smoke

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@d79e1cc2acc892b619db2ca46f78291ca427016b
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@d79e1cc2acc892b619db2ca46f78291ca427016b # v1.14.2
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: pilot-contract-${{ github.run_id }}-${{ github.run_attempt }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@d79e1cc2acc892b619db2ca46f78291ca427016b
        with:
          acquired: ${{ steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
