name: Runner Bootstrap

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  observer-modes:
    name: Owned file sharing-mode observation on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen study source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Query unchanged observer around owned move and delete attempts
        shell: pwsh
        timeout-minutes: 3
        env:
          DXM_STUDY_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $resultsDirectory = Join-Path $PWD '.artifacts/680-observer-modes'
          New-Item -ItemType Directory -Force -Path $resultsDirectory | Out-Null
          $sourcePath = Join-Path $PWD 'Tests/Editor/EditorSettingsStateScope.cs'
          $source = [IO.File]::ReadAllText($sourcePath).Replace("`r`n", "`n")
          $start = $source.IndexOf('    internal static class EditorFileLockDiagnostics', [StringComparison]::Ordinal)
          $end = $source.IndexOf("#if UNITY_EDITOR_WIN`n    [TestFixture]", $start, [StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) { throw 'Could not extract the unchanged observer class.' }
          $observer = $source.Substring($start, $end - $start)
          $compilation = @'
          #define UNITY_EDITOR_WIN
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          namespace DxMessaging.Tests.Editor
          {
          '@
          $compilation += "`n" + $observer + @'
          public static class NativeFileLockModeStudy
          {
              public static string Describe(string path) => EditorFileLockDiagnostics.Describe(path);
          }
          }
          '@
          [IO.File]::WriteAllText((Join-Path $resultsDirectory 'compiled-observer.cs.txt'), $compilation)
          Add-Type -TypeDefinition $compilation -Language CSharp
          $temporaryDirectory = Join-Path ([IO.Path]::GetTempPath()) ([IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $temporaryDirectory | Out-Null
          $rows = [Collections.Generic.List[object]]::new()
          $violations = [Collections.Generic.List[string]]::new()
          $studyFailure = $null
          $cleanupFailure = $null
          $shareModes = @(
              @{ Name = 'None'; Value = [IO.FileShare]::None },
              @{ Name = 'Read'; Value = [IO.FileShare]::Read },
              @{ Name = 'ReadWrite'; Value = [IO.FileShare]::ReadWrite },
              @{ Name = 'ReadWriteDelete'; Value = ([IO.FileShare]::ReadWrite -bor [IO.FileShare]::Delete) }
          )

          function Invoke-OwnedHandleRow {
              param([string]$Access, [string]$ShareName, [IO.FileShare]$Share, [string]$Operation, [string]$Spelling)
              $id = "$Access-$ShareName-$Operation-$Spelling"
              $directory = Join-Path $temporaryDirectory $id
              New-Item -ItemType Directory -Path $directory | Out-Null
              $canonical = Join-Path $directory 'owned.rsp'
              $destination = Join-Path $directory 'moved.rsp'
              $path = if ($Spelling -ceq 'canonical') { $canonical } else { $directory + '/owned.rsp' }
              [IO.File]::WriteAllText($canonical, 'owned observer control payload')
              $stream = $null
              $row = $null
              try {
                  if ($Access -cne 'Unlocked') {
                      $stream = [IO.FileStream]::new($canonical, [IO.FileMode]::Open, [IO.FileAccess]::$Access, $Share)
                  }
                  $report = [DxMessaging.Tests.Editor.NativeFileLockModeStudy]::Describe($path)
                  $ownPidFound = $report.Contains('pid=' + [Environment]::ProcessId + ',')
                  $apisSucceeded = $report.StartsWith('RestartManager start=0, register=0, list=0,') -and $report.EndsWith(', end=0')
                  $operationSucceeded = $false
                  $errorType = $null
                  $errorMessage = $null
                  $errorHResult = $null
                  $errorCode = $null
                  try {
                      if ($Operation -ceq 'Move') { [IO.File]::Move($path, $destination) }
                      else { [IO.File]::Delete($path) }
                      $operationSucceeded = $true
                  } catch {
                      $exception = $_.Exception.GetBaseException()
                      $errorType = $exception.GetType().FullName
                      $errorMessage = $exception.Message
                      $errorHResult = $exception.HResult
                      $errorCode = $exception.HResult -band 65535
                  }
                  $held = $null -ne $stream
                  $heldThroughout = $held -and -not $stream.SafeFileHandle.IsClosed -and -not $stream.SafeFileHandle.IsInvalid
                  $expectedDenied = $held -and (($Share -band [IO.FileShare]::Delete) -eq 0)
                  $operationMatches = if ($expectedDenied) {
                      -not $operationSucceeded -and $errorType -ceq 'System.IO.IOException' -and $errorCode -eq 32
                  } else { $operationSucceeded }
                  $row = [ordered]@{
                      id = $id; access = $Access; share = $ShareName; operation = $Operation; spelling = $Spelling
                      heldThroughout = $heldThroughout; expectedDenied = $expectedDenied
                      operationSucceeded = $operationSucceeded; operationMatches = $operationMatches
                      errorType = $errorType; errorHResult = $errorHResult; errorCode = $errorCode; errorMessage = $errorMessage
                      apisSucceeded = $apisSucceeded; ownPidFound = $ownPidFound; report = $report; cleanupSucceeded = $false
                  }
                  $rows.Add($row)
                  if (-not $apisSucceeded -or -not $operationMatches -or ($held -and -not $heldThroughout)) {
                      $violations.Add("Unexpected API/operation/handle condition: $id")
                  }
                  if ($Access -ceq 'Unlocked' -and $ownPidFound) { $violations.Add("Unlocked control reports its process: $id") }
                  if ($Access -ceq 'ReadWrite' -and $ShareName -ceq 'None' -and -not $ownPidFound) {
                      $violations.Add("Original exclusive positive control misses its process: $id")
                  }
                  [GC]::KeepAlive($stream)
              } finally {
                  if ($null -ne $stream) { $stream.Dispose() }
                  foreach ($ownedPath in @($canonical, $destination)) {
                      if (Test-Path -LiteralPath $ownedPath) { Remove-Item -LiteralPath $ownedPath }
                  }
                  Remove-Item -LiteralPath $directory
                  if ($null -ne $row) { $row.cleanupSucceeded = $true }
              }
              Write-Host "$id denied=$($row.expectedDenied) success=$($row.operationSucceeded) owner=$($row.ownPidFound) APIs=$($row.apisSucceeded)"
          }

          try {
              foreach ($access in @('Read', 'Write', 'ReadWrite')) {
                  foreach ($share in $shareModes) {
                      foreach ($operation in @('Move', 'Delete')) {
                          foreach ($spelling in @('canonical', 'mixed')) {
                              Invoke-OwnedHandleRow $access $share.Name $share.Value $operation $spelling
                          }
                      }
                  }
              }
              foreach ($operation in @('Move', 'Delete')) {
                  foreach ($spelling in @('canonical', 'mixed')) {
                      Invoke-OwnedHandleRow 'Unlocked' 'NotHeld' ([IO.FileShare]::None) $operation $spelling
                  }
              }
              if ($rows.Count -ne 52) { $violations.Add('Expected exactly 52 rows.') }
          } catch {
              $studyFailure = $_.Exception.ToString()
          } finally {
              try { Remove-Item -LiteralPath $temporaryDirectory -Recurse -Force }
              catch { $cleanupFailure = $_.Exception.ToString() }
              $evidence = [ordered]@{
                  head = $env:DXM_STUDY_HEAD
                  observerSourceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash.ToLowerInvariant()
                  observerExtractSha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($observer))).ToLowerInvariant()
                  runtime = [Runtime.InteropServices.RuntimeInformation]::FrameworkDescription
                  os = [Runtime.InteropServices.RuntimeInformation]::OSDescription
                  processId = [Environment]::ProcessId; nativeUnityExecution = $false
                  studyFailure = $studyFailure; cleanupFailure = $cleanupFailure
                  violations = $violations.ToArray(); rows = $rows.ToArray()
              }
              [IO.File]::WriteAllText((Join-Path $resultsDirectory 'observations.json'), ($evidence | ConvertTo-Json -Depth 8))
          }
          if ($null -ne $studyFailure -or $null -ne $cleanupFailure -or $violations.Count -ne 0) {
              throw 'An unexpected study/API/operation/control condition occurred; retain evidence and stop.'
          }

      - name: Retain every observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-file-mode-observations
          path: .artifacts/680-observer-modes
          if-no-files-found: error
          retention-days: 30
