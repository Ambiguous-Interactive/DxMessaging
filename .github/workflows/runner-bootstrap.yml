name: Runner Bootstrap

# Research-only installed SDK source contract for issue 511.
# cspell:ignore libil2cpp vcvars vswhere FUNCSIG nologo EHsc Il2Cpp IL2CPP
on:
  workflow_dispatch:

concurrency:
  group: native-size-sdk-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sdk-contract:
    name: Read installed IL2CPP size API contracts
    runs-on: [self-hosted, Windows, X64, fast]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out admitted research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Capture exactly the declared SDK files
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:RUNNER_NAME -ne 'ELI-MACHINE') { throw 'Unexpected source endpoint.' }
          $editor = Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3/6000.5.2f1/Editor'
          $sdk = Join-Path $editor 'Data/il2cpp/libil2cpp'
          $unity = Get-Item -LiteralPath (Join-Path $editor 'Unity.exe')
          $files = @(
            'il2cpp-api-functions.h', 'il2cpp-api.cpp', 'il2cpp-object-internals.h',
            'vm/Object.cpp', 'vm/Profiler.cpp', 'vm/Profiler.h',
            'gc/GarbageCollector.cpp', 'gc/GCHandle.cpp'
          )
          $dest = Join-Path $env:GITHUB_WORKSPACE '.artifacts/native-size-sdk-contract'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $records = [System.Collections.Generic.List[object]]::new()
          [long]$total = 0
          foreach ($relative in $files) {
            $source = Get-Item -LiteralPath (Join-Path $sdk $relative)
            if ($source.Length -gt 4MB) { throw 'SDK source exceeds declared per-file bound.' }
            $total += $source.Length
            if ($total -gt 16MB) { throw 'SDK source exceeds declared total bound.' }
            $target = Join-Path $dest ('sdk/' + $relative)
            New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
            Copy-Item -LiteralPath $source.FullName -Destination $target
            $digest = (Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) {
              throw 'SDK source copy differs.'
            }
            $records.Add([ordered]@{ path = $relative; bytes = $source.Length; sha256 = $digest })
          }
          [ordered]@{
            head = $env:GITHUB_SHA
            runner = $env:RUNNER_NAME
            declaredUnityVersion = '6000.5.2f1'
            executableProductVersion = $unity.VersionInfo.ProductVersion
            executableFileVersion = $unity.VersionInfo.FileVersion
            executableSha256 = (Get-FileHash -LiteralPath $unity.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            sdkRoot = $sdk
            files = @($records)
            totalSourceBytes = $total
            sdkModified = $false
            unityInvoked = $false
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $dest 'source-manifest.json') -Encoding utf8
      - name: Compile and run owned declaration reporter
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $dest = Join-Path $env:GITHUB_WORKSPACE '.artifacts/native-size-sdk-contract'
          $manifest = Get-Content -LiteralPath (Join-Path $dest 'source-manifest.json') -Raw | ConvertFrom-Json
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = @(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $install.Count -ne 1) { throw 'One existing C++ toolchain is required.' }
          Import-Module (Join-Path $install[0] 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install[0] -SkipAutomaticLocation -DevCmdArguments '-arch=amd64 -host_arch=amd64'
          $compiler = (Get-Command cl.exe -CommandType Application).Source
          $source = @'
          #include <cstdio>
          #include <type_traits>
          #include "il2cpp-api.h"
          #include "il2cpp-object-internals.h"
          static int owned_control(int a, int b) { return a + b; }
          static_assert(std::is_same<decltype(&owned_control), int (*)(int, int)>::value, "owned type control");
          static_assert(sizeof(void*) == 8, "x64 compiler control");
          template<typename T> static void record(const char* name) {
              std::printf("%s=%s\n", name, __FUNCSIG__);
          }
          int main() {
              std::printf("ownedControl=%d\n", owned_control(19, 23));
              std::printf("pointerSize=%zu\n", sizeof(void*));
              std::printf("objectHeaderSize=%zu\n", sizeof(Il2CppObject));
              record<decltype(&il2cpp_class_instance_size)>("il2cpp_class_instance_size");
              record<decltype(&il2cpp_class_get_name)>("il2cpp_class_get_name");
              record<decltype(&il2cpp_class_get_namespace)>("il2cpp_class_get_namespace");
              record<decltype(&il2cpp_object_get_size)>("il2cpp_object_get_size");
              record<decltype(&il2cpp_profiler_install)>("il2cpp_profiler_install");
              record<decltype(&il2cpp_profiler_install_allocation)>("il2cpp_profiler_install_allocation");
              record<decltype(&il2cpp_profiler_set_events)>("il2cpp_profiler_set_events");
              return 0;
          }
          '@
          $cpp = Join-Path $dest 'sdk-declarations.cpp'
          $exe = Join-Path $dest 'sdk-declarations.exe'
          [System.IO.File]::WriteAllText($cpp, ($source -replace "`r`n", "`n") + "`n")
          $preprocessed = Join-Path $dest 'sdk-declarations.i'
          $includeRoots = @(
            $manifest.sdkRoot,
            (Join-Path (Split-Path $manifest.sdkRoot) 'external/baselib/Include'),
            (Join-Path (Split-Path $manifest.sdkRoot) 'external/baselib/Platforms/Windows')
          )
          $includeArgs = @($includeRoots | ForEach-Object { '/I' + $_ })
          & $compiler /nologo /std:c++17 /EHsc /P ('/Fi' + $preprocessed) @includeArgs $cpp 2>&1 |
            Tee-Object -FilePath (Join-Path $dest 'preprocess.log')
          if ($LASTEXITCODE -ne 0) { throw 'SDK preprocessing failed; no retry.' }
          if ((Get-Item -LiteralPath $preprocessed).Length -gt 16MB) { throw 'Preprocessed declaration input exceeds its bound.' }
          & $compiler /nologo /std:c++17 /EHsc /TP ('/Fe:' + $exe) ('/Fo:' + (Join-Path $dest 'sdk-declarations.obj')) $preprocessed 2>&1 |
            Tee-Object -FilePath (Join-Path $dest 'compile.log')
          if ($LASTEXITCODE -ne 0) { throw 'SDK declaration compilation failed; no retry.' }
          $output = @(& $exe)
          if ($LASTEXITCODE -ne 0) { throw 'Owned declaration reporter failed; no retry.' }
          foreach ($record in $manifest.files) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $manifest.sdkRoot $record.path) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $record.sha256) { throw 'SDK source changed during capture.' }
          }
          [ordered]@{
            head = $env:GITHUB_SHA
            includeRoots = $includeRoots
            preprocessedSha256 = (Get-FileHash -LiteralPath $preprocessed -Algorithm SHA256).Hash.ToLowerInvariant()
            compilerSha256 = (Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
            compilerFileVersion = (Get-Item -LiteralPath $compiler).VersionInfo.FileVersion
            sourceSha256 = (Get-FileHash -LiteralPath $cpp -Algorithm SHA256).Hash.ToLowerInvariant()
            reporterSha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            output = $output
            sdkApiInvocations = 0
            playerOrUnityInvocations = 0
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $dest 'declaration-report.json') -Encoding utf8
      - name: Retain complete or failed source packet
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-size-sdk-contract
          path: .artifacts/native-size-sdk-contract
          if-no-files-found: error
          retention-days: 30
