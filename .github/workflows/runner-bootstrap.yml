name: Runner Bootstrap

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  observer-path:
    name: Owned file path observation on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen study source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Query the same owned file through both path spellings
        shell: pwsh
        timeout-minutes: 3
        env:
          DXM_STUDY_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsDirectory = Join-Path $PWD '.artifacts/680-observer-path'
          New-Item -ItemType Directory -Force -Path $resultsDirectory | Out-Null
          $sourcePath = Join-Path $PWD 'Tests/Editor/EditorSettingsStateScope.cs'
          $source = [System.IO.File]::ReadAllText($sourcePath).Replace("`r`n", "`n")
          $start = $source.IndexOf('    internal static class EditorFileLockDiagnostics', [StringComparison]::Ordinal)
          $end = $source.IndexOf("#if UNITY_EDITOR_WIN`n    [TestFixture]", $start, [StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) { throw 'Could not extract the exact observer class.' }
          $observer = $source.Substring($start, $end - $start)
          $compilation = @'
          #define UNITY_EDITOR_WIN
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          namespace DxMessaging.Tests.Editor
          {
          '@
          $compilation += "`n" + $observer + @'
          public static class NativeFileLockPathStudy
          {
              public static string Describe(string path) => EditorFileLockDiagnostics.Describe(path);
          }
          }
          '@
          [System.IO.File]::WriteAllText((Join-Path $resultsDirectory 'compiled-observer.cs.txt'), $compilation)
          Add-Type -TypeDefinition $compilation -Language CSharp
          $temporaryDirectory = Join-Path ([System.IO.Path]::GetTempPath()) ([System.IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $temporaryDirectory | Out-Null
          $canonical = Join-Path $temporaryDirectory 'owned.rsp'
          $mixed = $temporaryDirectory + '/owned.rsp'
          $stream = $null
          $rows = [System.Collections.Generic.List[object]]::new()
          try {
            $stream = [System.IO.FileStream]::new(
              $canonical, [System.IO.FileMode]::CreateNew,
              [System.IO.FileAccess]::ReadWrite, [System.IO.FileShare]::None)
            foreach ($order in @('canonical-first', 'mixed-first')) {
              $paths = if ($order -eq 'canonical-first') { @($canonical, $mixed) } else { @($mixed, $canonical) }
              foreach ($path in $paths) {
                $spelling = if ($path -ceq $canonical) { 'canonical' } else { 'mixed' }
                $report = [DxMessaging.Tests.Editor.NativeFileLockPathStudy]::Describe($path)
                $ownPidFound = $report.Contains('pid=' + [Environment]::ProcessId + ',')
                $apisSucceeded = $report.StartsWith('RestartManager start=0, register=0, list=0,') -and $report.EndsWith(', end=0')
                $rows.Add([ordered]@{ order = $order; spelling = $spelling; ownPidFound = $ownPidFound; apisSucceeded = $apisSucceeded; report = $report })
                Write-Host "$order $spelling $report"
              }
            }
            [GC]::KeepAlive($stream)
          } finally {
            if ($null -ne $stream) { $stream.Dispose() }
            if (Test-Path -LiteralPath $canonical) { Remove-Item -LiteralPath $canonical }
            Remove-Item -LiteralPath $temporaryDirectory
          }
          $evidence = [ordered]@{
            head = $env:DXM_STUDY_HEAD
            observerSourceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash.ToLowerInvariant()
            observerExtractSha256 = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($observer))).ToLowerInvariant()
            runtime = [System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            processId = [Environment]::ProcessId
            nativeUnityExecution = $false
            queries = $rows.ToArray()
          }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $resultsDirectory 'observations.json')
          if ($rows.Count -ne 4 -or @($rows | Where-Object { -not $_.ownPidFound -or -not $_.apisSucceeded }).Count -ne 0) {
            throw 'A controlled path spelling did not report the same held file owner; retain all observations.'
          }

      - name: Retain every control observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-file-path-observations
          path: .artifacts/680-observer-path
          if-no-files-found: error
          retention-days: 30
