name: Runner Audit (Windows)

# Operator-driven, workflow_dispatch-only audit of a self-hosted Windows
# runner's host prerequisites, exact Unity editors, and required modules.
# This workflow is intentionally validation-only: GitHub Actions does not have
# the administrator credentials required to install or repair runner software.
# An administrator performs all installation and repair directly on the host,
# then dispatches this audit to confirm the runner is ready.
#
# Targeting a SPECIFIC runner (HARD-FAIL on wrong target):
#   * The repo's runner topology currently labels both Windows runners
#     uniformly (`self-hosted, Windows, RAM-64GB`); only ELI-MACHINE carries
#     the additional `fast` label (per docs/ops/ci-and-github-settings.md).
#   * To audit one specific machine without affecting the other, take
#     the OTHER runner offline (gh CLI or Actions UI -> Runners) BEFORE
#     dispatching this workflow, then bring it back online afterwards.
#   * If the dispatch lands on the wrong runner the workflow HARD-FAILS with
#     `::error::` and exit 1 (NOT a silent ::warning::). This is by design:
#     a silent audit of the WRONG machine would be operator-fatal.
#   * Long-term fix: add machine-name labels to runner agents so the
#     `runs-on:` set can include the runner name itself.
#
# Windows PowerShell 5.1 is used because the audit must still report a missing
# PowerShell 7 prerequisite.

on:
  workflow_dispatch:
    inputs:
      shipping-editor-verification:
        description: "Run the complete shipping Editor and sample scope on Unity 2021.3."
        type: boolean
        default: false
      runner-label:
        description: >-
          (HARD-FAIL on wrong target) Name of the runner you want to audit
          (DAD-MACHINE or ELI-MACHINE). Both runners share the same label set,
          so the scheduler may land on either machine. If it lands on the
          WRONG one, this workflow FAILS FAST with exit 1 -- it does NOT
          silently audit the unintended machine. Take the unwanted runner
          offline (Settings -> Runners) BEFORE dispatching to guarantee
          targeting.
        required: true
        type: choice
        options:
          - DAD-MACHINE
          - ELI-MACHINE
# Forbid concurrent audits OF THIS REPO across BOTH runners. The group
# is intentionally NOT parameterized by `inputs.runner-label` so that two
# dispatches (one per machine) cannot overlap. This is stricter than per-runner
# concurrency: any in-flight audit anywhere blocks another audit from starting.
# Distinct from `wallstop-organization-builds` (the Unity build lock). Default
# audits are license-free; the optional shipping Editor job acquires the central
# lock and completes its automatic license-return and cleanup sequence.
concurrency:
  group: runner-audit-windows
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Preflight convention: every job whose runs-on declares `self-hosted`
  # must `needs:` a runner-registration preflight (see
  # docs/runbooks/unity-runners-after-transfer.md). This mirrors the
  # release.yml runner-preflight pattern exactly.
  runner-preflight:
    name: Self-hosted runner registration preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require a registered Windows Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@03518ac5ac2a4a223243c593cc9b453688c92b99 # v1.15.0
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  bootstrap:
    if: ${{ !inputs['shipping-editor-verification'] }}
    # F9: surface the mode (Audit vs Maintenance) in the job display name so
    # operators reading the Actions UI immediately see which mode this run is
    # without expanding the inputs.
    name: Audit ${{ inputs.runner-label }}
    needs:
      - runner-preflight
    # Cannot dynamically pin to a specific runner without machine-name labels
    # configured on the runners themselves (operator action; not yet done in
    # this org). Use the documented allowlisted set; operator takes the
    # unwanted runner offline before dispatching when targeting is needed.
    # The "Confirm runner identity" step below HARD-FAILS if the dispatch
    # lands on the wrong machine (see header comment for the chicken-and-egg
    # rationale around `shell: powershell` for the rest of this job).
    runs-on: [self-hosted, Windows, RAM-64GB]
    # F13: inherit workflow-level permissions (contents: read, actions: read).
    # No job-level override -- the previous explicit block silently dropped
    # `actions: read` and shadowed the workflow-level intent.
    timeout-minutes: 360
    steps:
      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        # Shallow checkout: the audit only needs scripts/unity/* and a
        # composite action; no history depth required.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          persist-credentials: false

      - name: Confirm runner identity (hard-fail on wrong target)
        # F15: Windows PowerShell 5.1, NOT pwsh, so the audit can report a
        # missing PowerShell 7 prerequisite.
        shell: powershell
        env:
          DXM_BOOTSTRAP_REQUESTED_RUNNER: ${{ inputs.runner-label }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $actual = $env:RUNNER_NAME
          $requested = $env:DXM_BOOTSTRAP_REQUESTED_RUNNER
          Write-Host "Requested runner: $requested"
          Write-Host "Actual runner:    $actual"
          # F2: HARD-FAIL on mismatch. The previous ::warning:: would silently
          # audit the wrong machine when the scheduler picked
          # the runner the operator did NOT intend.
          if (-not [string]::IsNullOrWhiteSpace($actual) -and -not [string]::IsNullOrWhiteSpace($requested)) {
              if (-not [string]::Equals($actual, $requested, [System.StringComparison]::OrdinalIgnoreCase)) {
                  Write-Host ("::error::Runner audit dispatched to '$actual' but operator requested '$requested'. Cancel this run, take '$actual' offline (Settings -> Runners or 'gh api -X POST " +
                  "orgs/<org>/actions/runners/<id>/...'), then re-dispatch so the run lands on '$requested'. Alternatively, add machine-name labels to runner agents so 'runs-on:' can pin to a " +
                  "specific runner.")
                  if ($env:GITHUB_STEP_SUMMARY) {
                      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("## Runner Audit (FAILED: wrong target)`n`n- Requested runner: ``$requested```n- Actual runner: ``$actual```n- Action: " +
                      "hard-fail; take ``$actual`` offline and re-dispatch.")
                  }
                  exit 1
              }
          }
          # Surface to the step summary for the Actions UI.
          $summary = @(
              "## Runner Audit"
              ""
              "- Requested runner: ``$requested``"
              "- Actual runner: ``$actual``"
              "- Mode: ``validation-only``"
          ) -join "`n"
          if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }

      - name: Run runner audit (single-step transcript)
        # F5/F7: a single PowerShell 5.1 step opens the transcript, invokes
        # the audit script, and Stop-Transcripts in a finally{} -- the
        # previous design split Start-Transcript and the bootstrap into
        # separate pwsh processes, leaving the artifact empty.
        # F15: Windows PowerShell 5.1 -- see header comment.
        # F22: we deliberately do NOT `uses: ./.github/actions/assert-unity-host-prereqs`
        # here, even though that composite would normally own this orchestration.
        # The composite contains a PS 5.1 preflight (F14) that hard-fails when
        # pwsh is missing, which this workflow must report. This workflow's
        # logic stays thin: it owns only the transcript wrapper
        # and always passes DetectOnly. All detection logic lives inside
        # scripts/unity/maintain-windows-runner.ps1 and
        # scripts/unity/bootstrap-windows-runner.ps1.
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $artifactDir = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, '.artifacts', 'runner-bootstrap')
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $timestamp = (Get-Date -Format 'yyyyMMdd-HHmmss')
          $logPath = Join-Path $artifactDir ("maintenance-{0}-{1}-{2}.log" -f $timestamp, $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          Write-Host "Transcript: $logPath"

          Write-Host "Resolved mode: validation-only"

          # F6: drop the GITHUB_ACTION_PATH `../../../` ascent. We are inside
          # a workflow (not a composite), so $GITHUB_WORKSPACE is reliably
          # the repo root post-checkout (actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 above guarantees
          # the script is present at this path).
          $script = [System.IO.Path]::Combine($env:GITHUB_WORKSPACE, 'scripts', 'unity', 'maintain-windows-runner.ps1')
          if (-not (Test-Path -LiteralPath $script)) {
              Write-Host "::error::Runner maintenance script not found at $script"
              exit 1
          }

          $code = 0
          try {
              Start-Transcript -Path $logPath -Force | Out-Null
              . $script
              $unityVersions = @('2021.3.45f1', '2022.3.45f1', '6000.3.16f1', '6000.5.2f1')
              $provisioningProfile = 'StandaloneWindowsIl2Cpp'
              $installRoot = Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3'
              $maintenanceArgs = @{
                  UnityVersions = $unityVersions
                  ProvisioningProfile = $provisioningProfile
                  InstallRoot = $installRoot
                  DiagnosticsRoot = $artifactDir
                  DetectOnly = $true
              }
              $code = Invoke-WindowsRunnerMaintenance @maintenanceArgs
          } finally {
              try { Stop-Transcript | Out-Null } catch { Write-Host "::notice::Stop-Transcript: $($_.Exception.Message) (non-fatal)" }
          }

          Write-Host "Runner maintenance exit code: $code"
          if ($env:GITHUB_STEP_SUMMARY) {
              $label = switch ($code) {
                  0 { 'ok' }
                  2 { 'detect-only-missing' }
                  3 { 'mutex-busy' }
                  4 { 'runner-busy' }
                  default { "fail($code)" }
              }
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Runner maintenance result: ``" + $label + "`` (exit $code)")
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Transcript: ``" + $logPath + "``")
          }
          if ($code -ne 0) { exit $code }

      # F1: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 -- matches the repo-wide pinned
      # version used by release.yml/unity-tests.yml/unity-benchmarks.yml.
      # F19: if-no-files-found is `error` (not `warn`) so a missing transcript
      # is a HARD failure rather than a silent empty artifact upload.
      - name: Upload bootstrap transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-bootstrap-${{ inputs.runner-label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/runner-bootstrap/**
          if-no-files-found: error
          retention-days: 30

  shipping-editor-runner-preflight:
    name: Shipping Editor ELI registration preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['shipping-editor-verification'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the registered ELI runner labels
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@03518ac5ac2a4a223243c593cc9b453688c92b99 # v1.15.0
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB","fast"]]'

  shipping-editor-verification:
    name: Unity 2021.3 shipping Editor and samples on ELI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['shipping-editor-verification'] }}
    needs:
      - runner-preflight
      - shipping-editor-runner-preflight
    runs-on: [self-hosted, Windows, RAM-64GB, fast]
    timeout-minutes: 600
    steps:
      - name: Require ELI request and runner
        timeout-minutes: 1
        shell: pwsh
        env:
          DXM_REQUESTED_RUNNER: ${{ inputs.runner-label }}
        run: |
          if ($env:DXM_REQUESTED_RUNNER -cne 'ELI-MACHINE' -or $env:RUNNER_NAME -cne 'ELI-MACHINE') {
              throw 'Shipping Editor verification requires the ELI-MACHINE request and runner.'
          }

      - name: Require manually installed Unity editor
        id: ensure_unity_editor
        timeout-minutes: 10
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/ensure-unity-editor@03518ac5ac2a4a223243c593cc9b453688c92b99 # v1.15.0
        with:
          unity-version: 2021.3.45f1
          install-root: ${{ runner.tool_cache }}\u6-v3
          provisioning-profile: StandaloneWindowsIl2Cpp
          diagnostics-path: unity-editor-check.json
          ci-managed-only: true
          require-healthy-existing: true

      - name: Enable Git long paths
        timeout-minutes: 2
        shell: pwsh
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        id: setup_node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install artifact tooling dependencies
        id: install_dependencies
        timeout-minutes: 2
        shell: pwsh
        run: |
          $tooling = Join-Path $env:GITHUB_WORKSPACE '.artifacts/node-tooling'
          New-Item -ItemType Directory -Path $tooling -Force | Out-Null
          Copy-Item .github/artifact-tooling/package.json, .github/artifact-tooling/package-lock.json -Destination $tooling
          npm ci --prefix "$tooling" --userconfig "$env:GITHUB_WORKSPACE/.npmrc" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NODE_PATH=$(Join-Path $tooling 'node_modules')" >> $env:GITHUB_ENV

      - name: Compute EditMode test assembly list
        id: compute
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: editmode
          include-integrations: "true"

      - name: Require a shipping Editor test scope
        timeout-minutes: 1
        shell: pwsh
        env:
          DXM_SELECTED_ASSEMBLIES: ${{ steps.compute.outputs.assemblies }}
          DXM_EMPTY_SCOPE: ${{ steps.compute.outputs.is-empty }}
        run: |
          if ($env:DXM_EMPTY_SCOPE -cne 'false' -or [string]::IsNullOrWhiteSpace($env:DXM_SELECTED_ASSEMBLIES)) {
              throw 'Shipping Editor verification requires a nonempty complete shipping selection.'
          }

      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@03518ac5ac2a4a223243c593cc9b453688c92b99 # v1.15.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: shipping-editor-${{ github.run_id }}-${{ github.run_attempt }}
          require-resource-lifecycle: "true"
          minimum-release-cooldown-seconds: "0"
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Run shipping Editor and sample tests
        id: run_editor
        if: ${{ steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 120
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_TEST_ASSEMBLIES: ${{ steps.compute.outputs.assemblies }}
          DXM_UNITY_TEST_CATEGORY: "!Stress;!Performance;!Allocation;!MemoryReclaim;!UnityRuntime;!PerfBench;!PerfGate;!PerfBaseline"
          DX_PERF_COMMIT: ${{ github.sha }}
        run: |
          $artifactsPath = '.artifacts/unity/shipping-editor/${{ github.run_id }}-${{ github.run_attempt }}'
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\t\se${{ github.run_id }}a${{ github.run_attempt }}'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\shipping-editor-2021.3.45f1'
          if (Test-Path -LiteralPath $projectPath) { throw 'Shipping Editor verification requires a fresh owned project.' }
          New-Item -ItemType Directory -Force -Path $artifactsPath | Out-Null
          @{
              sourceCommit = $env:DX_PERF_COMMIT
              sourceTree = [string](& git rev-parse 'HEAD^{tree}')
              unityVersion = '2021.3.45f1'
              assemblies = $env:DXM_TEST_ASSEMBLIES
              categories = $env:DXM_UNITY_TEST_CATEGORY
              projectWasAbsentBefore = $true
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifactsPath 'scope-inputs.json') -Encoding UTF8
          if ($LASTEXITCODE -ne 0) { throw 'Shipping Editor source tree lookup failed.' }
          $arguments = @{
              UnityVersion = '2021.3.45f1'
              TestMode = 'editmode'
              AssemblyNames = $env:DXM_TEST_ASSEMBLIES
              ArtifactsPath = $artifactsPath
              ProjectPath = $projectPath
              CachePath = $cachePath
          }
          ./scripts/unity/run-ci-tests.ps1 -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') -LicenseReturnOwner Central @arguments

      - name: Verify shipping Editor tests actually ran
        if: ${{ !cancelled() && steps.compute.outcome == 'success' && steps.run_editor.outcome != 'skipped' }}
        timeout-minutes: 2
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/shipping-editor/${{ github.run_id }}-${{ github.run_attempt }}
          results-file: .artifacts/unity/shipping-editor/${{ github.run_id }}-${{ github.run_attempt }}/results.xml
          label: Shipping Editor and samples
          expected-empty: "false"

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@03518ac5ac2a4a223243c593cc9b453688c92b99
        with:
          unity-version: 2021.3.45f1
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: shipping-editor

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@03518ac5ac2a4a223243c593cc9b453688c92b99
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@03518ac5ac2a4a223243c593cc9b453688c92b99 # v1.15.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: shipping-editor-${{ github.run_id }}-${{ github.run_attempt }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@03518ac5ac2a4a223243c593cc9b453688c92b99
        with:
          acquired: ${{ steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}

      - name: Redact shipping Editor artifacts
        id: redact_editor
        if: ${{ always() && steps.setup_node.outcome == 'success' && steps.install_dependencies.outcome == 'success' }}
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/shipping-editor/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload shipping Editor artifacts
        if: ${{ always() && steps.redact_editor.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shipping-editor-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/unity/shipping-editor/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
