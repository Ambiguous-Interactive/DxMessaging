name: Restart Manager owned-layout qualification
# cspell:ignore winrt offsetof

on:
  workflow_dispatch:

concurrency:
  group: restart-manager-owned-layout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    name: SDK layout and owned multi-process controls
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare actual SDK and production observers
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if (-not $IsWindows) { throw 'Owned native SDK comparison requires Windows.' }
          $base = [IO.Path]::GetFullPath('.artifacts/restart-manager-layout')
          New-Item -ItemType Directory -Path $base -Force | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'An existing MSVC installation is required.' }
          $toolsets = @(Get-ChildItem (Join-Path $installation 'VC/Tools/MSVC') -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending)
          if ($toolsets.Count -eq 0) { throw 'No existing versioned MSVC toolset.' }
          $kits = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $versions = @(Get-ChildItem (Join-Path $kits 'Lib') -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending)
          if ($versions.Count -eq 0) { throw 'No existing Windows SDK.' }
          $sdkVersion = $versions[0].Name
          $env:PATH = (Join-Path $toolsets[0].FullName 'bin/Hostx64/x64') + ';' + $env:PATH
          $env:INCLUDE = @(
           (Join-Path $toolsets[0].FullName 'include'), (Join-Path $kits "Include/$sdkVersion/ucrt"),
           (Join-Path $kits "Include/$sdkVersion/shared"), (Join-Path $kits "Include/$sdkVersion/um"),
           (Join-Path $kits "Include/$sdkVersion/winrt")
          ) -join ';'
          $env:LIB = @((Join-Path $toolsets[0].FullName 'lib/x64'), (Join-Path $kits "Lib/$sdkVersion/ucrt/x64"), (Join-Path $kits "Lib/$sdkVersion/um/x64")) -join ';'
          $nativeSource = @'
          #include <windows.h>
          #include <restartmanager.h>
          #include <stddef.h>
          #include <stdio.h>
          int main(void) {
           printf("{\"PointerSize\":%zu,\"AppCharacters\":%d,\"ServiceCharacters\":%d,"
           "\"UniqueProcessSize\":%zu,\"ProcessInfoSize\":%zu,\"Process\":%zu,"
           "\"ApplicationName\":%zu,\"ServiceName\":%zu,\"ApplicationType\":%zu,"
           "\"Status\":%zu,\"SessionId\":%zu,\"Restartable\":%zu}\n",
           sizeof(void*), CCH_RM_MAX_APP_NAME + 1, CCH_RM_MAX_SVC_NAME + 1,
           sizeof(RM_UNIQUE_PROCESS), sizeof(RM_PROCESS_INFO), offsetof(RM_PROCESS_INFO, Process),
           offsetof(RM_PROCESS_INFO, strAppName), offsetof(RM_PROCESS_INFO, strServiceShortName),
           offsetof(RM_PROCESS_INFO, ApplicationType), offsetof(RM_PROCESS_INFO, AppStatus),
           offsetof(RM_PROCESS_INFO, TSSessionId), offsetof(RM_PROCESS_INFO, bRestartable));
           return 0;
          }
          '@
          $cpp = Join-Path $base 'sdk-layout.cpp'
          [IO.File]::WriteAllText($cpp, $nativeSource)
          $exe = Join-Path $base 'sdk-layout.exe'
          & cl.exe /nologo /EHsc /W4 /WX "/Fo$base/sdk-layout.obj" "/Fe$exe" $cpp 2>&1 | Tee-Object (Join-Path $base 'sdk-compile.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native SDK layout compilation failed.' }
          $nativeJson = & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Native SDK layout probe failed.' }
          $nativeJson | Set-Content (Join-Path $base 'native-sdk-layout.json')
          $sdk = $nativeJson | ConvertFrom-Json -AsHashtable
          $header = Join-Path $kits "Include/$sdkVersion/um/RestartManager.h"
          [ordered]@{
           SdkVersion = $sdkVersion
           HeaderSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $header).Hash.ToLowerInvariant()
           PointerSize = $sdk.PointerSize
          } | ConvertTo-Json | Set-Content (Join-Path $base 'sdk-source.json')
          $baseline = (& git show '57da0228a612642fd8f13c109c552023d03920aa:Tests/Editor/EditorSettingsStateScope.cs') -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Exact baseline source read failed.' }
          $candidate = [IO.File]::ReadAllText('Tests/Editor/EditorSettingsStateScope.cs').Replace("`r`n", "`n")
          function Get-Observer([string]$Source) {
           $start = $Source.IndexOf('    internal static class EditorFileLockDiagnostics', [StringComparison]::Ordinal)
           $end = $Source.IndexOf("#if UNITY_EDITOR_WIN`n    [TestFixture]", $start, [StringComparison]::Ordinal)
           if ($start -lt 0 -or $end -le $start) { throw 'Production observer extraction failed.' }
           return $Source.Substring($start, $end - $start)
          }
          $helperStart = $candidate.IndexOf('    internal sealed class EditorOwnedFileLockProcesses', [StringComparison]::Ordinal)
          $helperEnd = $candidate.IndexOf("#endif`n`n    /// <summary>Preserves the real generated inputs", $helperStart, [StringComparison]::Ordinal)
          if ($helperStart -lt 0 -or $helperEnd -le $helperStart) { throw 'Shared owned-process helper extraction failed.' }
          $helper = $candidate.Substring($helperStart, $helperEnd - $helperStart)
          $adapter = @'
          public static class Adapter {
           public static string Describe(string path) => EditorFileLockDiagnostics.Describe(path);
           public static object Create(int count) => new EditorOwnedFileLockProcesses(count);
           public static string PathOf(object owner) => ((EditorOwnedFileLockProcesses)owner).ResourcePath;
           public static int[] Ids(object owner) => ((EditorOwnedFileLockProcesses)owner).ProcessIds;
           public static Dictionary<string,int> Layout() {
            Type unique = typeof(EditorFileLockDiagnostics).GetNestedType("UniqueProcess", BindingFlags.NonPublic);
            Type process = typeof(EditorFileLockDiagnostics).GetNestedType("ProcessInfo", BindingFlags.NonPublic);
            Dictionary<string,int> d = new Dictionary<string,int>();
            d.Add("UniqueProcessSize", Marshal.SizeOf(unique)); d.Add("ProcessInfoSize", Marshal.SizeOf(process));
            foreach (string name in new[] { "Process", "ApplicationName", "ServiceName",
                "ApplicationType", "Status", "SessionId", "Restartable" })
             d.Add(name, Marshal.OffsetOf(process,name).ToInt32());
            return d;
           }
          }
          '@
          $sources = @{}
          foreach ($item in @(@{ Name = 'Baseline'; Source = $baseline }, @{ Name = 'Candidate'; Source = $candidate })) {
           $observer = Get-Observer $item.Source
           $preamble = "#define UNITY_EDITOR_WIN`nusing System; using System.IO; using System.Text; using System.Reflection;`n"
           $preamble += "using System.Collections.Generic; using System.Runtime.InteropServices;`n"
           $code = $preamble + "namespace DxmOwned$($item.Name) {`n" + $observer + "`n" + $helper + "`n" + $adapter + "`n}"
           [IO.File]::WriteAllText((Join-Path $base "$($item.Name)-compiled-source.cs.txt"), $code)
           Add-Type -TypeDefinition $code -Language CSharp
           $sources[$item.Name] = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $base "$($item.Name)-compiled-source.cs.txt")).Hash.ToLowerInvariant()
          }
          $oldLayout = [DxmOwnedBaseline.Adapter]::Layout()
          $newLayout = [DxmOwnedCandidate.Adapter]::Layout()
          function Read-Report([string]$Report, [int[]]$Expected) {
           $query = [regex]::Match($Report, '^RestartManager start=0, register=0, list=0, needed=(\d+), returned=(\d+), reasons=(\d+)')
           $ids = @([regex]::Matches($Report, '; pid=(\d+),') | ForEach-Object { [uint32]$_.Groups[1].Value })
           $same = $ids.Count -eq $Expected.Count -and @($Expected | Where-Object { [uint32]$_ -notin $ids }).Count -eq 0
           return [ordered]@{
            Report = $Report; QuerySucceeded = ($query.Success -and $Report.EndsWith(', end=0'))
            Needed = $(if ($query.Success) { [int]$query.Groups[1].Value } else { -1 })
            Returned = $(if ($query.Success) { [int]$query.Groups[2].Value } else { -1 })
            ProcessIds = $ids; ExactExpectedProcessIds = $same
           }
          }
          $rows = @()
          foreach ($count in @(0,1,2,3)) {
           $owner = [DxmOwnedCandidate.Adapter]::Create($count)
           $row = [ordered]@{ Holders = $count; CleanupConfirmed = $false }
           try {
            $path = [DxmOwnedCandidate.Adapter]::PathOf($owner)
            $expected = @([DxmOwnedCandidate.Adapter]::Ids($owner))
            $row.ExpectedProcessIds = $expected
            $denial = $null
            if ($count -ne 0) {
             try { [IO.File]::Delete($path); throw 'Owned holders unexpectedly allowed deletion.' }
             catch {
              $failure = $_.Exception
              while ($null -ne $failure.InnerException) { $failure = $failure.InnerException }
              if ($failure -isnot [IO.IOException]) { throw }
              $denial = $failure.HResult -band 65535
              if ($denial -ne 32) { throw "Unexpected owned-file deletion error: $denial" }
             }
            }
            $row.DeleteError = $denial
            $row.FileExistsBeforeQueries = [IO.File]::Exists($path)
            $row.Baseline = Read-Report ([DxmOwnedBaseline.Adapter]::Describe($path)) $expected
            $row.Candidate = Read-Report ([DxmOwnedCandidate.Adapter]::Describe($path)) $expected
           } finally {
            ([IDisposable]$owner).Dispose()
            $row.CleanupConfirmed = $true
           }
           $rows += $row
          }
          [ordered]@{
           Platform = [Environment]::OSVersion.ToString()
           Framework = [Runtime.InteropServices.RuntimeInformation]::FrameworkDescription
           NativeSdk = $sdk; BaselineLayout = $oldLayout; CandidateLayout = $newLayout
           CompiledSourceSha256 = $sources; Rows = $rows
           AllOwnedChildrenCleanupConfirmed = (@($rows | Where-Object { -not $_.CleanupConfirmed }).Count -eq 0)
           NativeUnityCalled = $false
          } | ConvertTo-Json -Depth 12 | Set-Content (Join-Path $base 'comparison.json')
          Write-Host 'Owned SDK-layout/multiple-process observation complete; raw output retained without a post-data acceptance change.'
      - name: Retain owned comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restart-manager-owned-layout
          path: .artifacts/restart-manager-layout
          retention-days: 14
          if-no-files-found: error
