name: Performance Numbers

# CI owns the documented dispatch-throughput numbers end to end. On every trusted
# same-repository pull request change, every push to master/main, or a controlled
# manual dispatch, this workflow runs the dispatch benchmarks on ELI-MACHINE
# (the `fast` runner)
# at the LATEST Unity version in two isolated Standalone IL2CPP Release players:
# one for internal benchmarks and one for comparisons. This is the AOT backend
# shipped games run, and Standalone is the only published scope. A Release player
# strips the GC.Alloc profiler recorder, so the renderer omits allocation columns
# rather than publishing editor-only Mono measurements. The committed regression
# baseline uses the same Standalone scope (extract-perf-baseline.js --scope Standalone).
# Pull requests receive one updated delta-table comment linked to the exact
# measured head commit and workflow run. Fork and Dependabot pull requests do not
# receive Unity credentials and skip the licensed jobs. On push to master or main
# (after the PR merges) -- or on a manual
# workflow_dispatch from the default
# branch, the supported recovery path after a failed publish -- the same
# benchmarks run and, if the numbers moved, CI lands the refreshed doc AND the
# regenerated master baseline CSV on the default branch in two tiers:
#   1. DIRECT PUSH with a GitHub App installation token (the built-in
#      GITHUB_TOKEN cannot push to a protected branch; github-actions[bot] is a
#      system account and is not a selectable bypass actor).
#   2. FALLBACK AUTO-MERGE PULL REQUEST when the direct push is rejected
#      (GH006): the same commit is pushed to a ci/perf-auto-update-* branch and
#      delivered via a PR opened with the App token, with squash auto-merge
#      requested. The refreshed numbers are therefore NEVER lost -- worst case
#      they wait in a visible PR for one human click.
# If the branch advances before this long benchmark run reaches the push step,
# the job warns and skips the stale artifacts. App-token pushes DO re-trigger
# workflows, so recursion is broken the simple way: the push trigger ignores
# docs/architecture/performance.md and docs/architecture/perf-baseline.csv below,
# so the auto-commit cannot re-run the benchmark. Fallback PRs change only the
# two ignored generated paths, so they cannot run licensed benchmarks either. The committed
# numbers are therefore owned by CI, not by committed state, manual runs, or
# PR-body text.
#
# PREREQUISITE: a GitHub App (App ID in secrets.AUTO_COMMIT_APP_ID, private key in
# secrets.AUTO_COMMIT_APP_PRIVATE_KEY) with Contents: read and write PLUS Pull
# requests: read and write (for the fallback PR), installed on this repo and --
# for the tier-1 fast path -- allowed to bypass the master/main branch
# protection. Without the bypass the push is rejected with GH006 and tier 2
# takes over; if the secrets are absent entirely the commit job degrades to a
# logged no-op. See docs/runbooks/perf-numbers-auto-commit.md for the exact
# setup + click-paths.
on:
  push:
    branches:
      - master
    # Loop break: the commit-perf-doc job pushes a doc + baseline commit with a
    # GitHub App token, which (unlike the built-in GITHUB_TOKEN) DOES re-trigger
    # workflows. Ignoring BOTH the perf doc AND the regenerated baseline CSV here
    # means that auto-commit cannot re-run the benchmark. A normal code merge still
    # touches non-ignored paths and runs.
    paths-ignore:
      - docs/architecture/performance.md
      - docs/architecture/perf-baseline.csv
  pull_request:
    branches:
      - master
    # The generated fallback PR changes only these two files. Ignoring them keeps
    # that delivery path from consuming a second licensed benchmark run.
    paths-ignore:
      - docs/architecture/performance.md
      - docs/architecture/perf-baseline.csv
  workflow_dispatch:

# Serialize merge-path runs on the same ref so two post-merge push jobs from
# this workflow do not race each other. A separate freshness check still guards
# against unrelated default-branch pushes landing while the benchmarks run. We do
# NOT cancel in-progress runs -- that would abort an in-flight benchmark.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Top-level least-privilege. The default-branch refresh job (commit-perf-doc)
# pushes with a GitHub App token, so its own GITHUB_TOKEN needs only
# contents:read. It grants that scope on the job itself so the licensed Unity job
# never inherits write.
permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: read

jobs:
  head-check:
    name: Performance head freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.head.outputs.relevant }}
      superseded: ${{ steps.head.outputs.superseded }}
    steps:
      - name: Compare the event head against the live pull-request head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          relevant=true
          superseded=false
          if [ "${EVENT_NAME}" = pull_request ]; then
            live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" || live=
            if [ -z "${live}" ]; then
              echo "::warning::Live head lookup failed; treating ${EVENT_HEAD_SHA} as current."
            elif [ "${live}" != "${EVENT_HEAD_SHA}" ]; then
              echo "::notice::${EVENT_HEAD_SHA} is superseded by ${live}; skipping the performance matrix."
              superseded=true
            fi
            if files="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')"; then
              documentation_only_pattern='^(docs/|progress/|\.llm/|\.agents/|\.claude/|Samples~/.*\.(md|markdown)(\.meta)?$|(AGENTS|GOAL|PLAN)\.md(\.meta)?$|llms\.txt$|mkdocs\.yml$|requirements-docs\.txt$)'
              non_documentation="$(printf '%s\n' "${files}" | grep -Ev "${documentation_only_pattern}" || true)"
              if [ -n "${files}" ] && [ -z "${non_documentation}" ]; then
                echo "::notice::Only documentation and agent-context files changed; skipping licensed performance benchmarks."
                relevant=false
              fi
            else
              echo "::warning::Changed-file lookup failed; running licensed performance benchmarks."
            fi
          fi
          echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"
          echo "superseded=${superseded}" >> "${GITHUB_OUTPUT}"

  runner-preflight:
    name: Self-hosted runner registration preflight
    # Runs on GitHub-hosted infrastructure before the self-hosted matrix can
    # queue. The dedicated reader App makes missing inventory a hard failure.
    needs:
      - head-check
    if: >-
      ${{
        needs.head-check.outputs.superseded != 'true' &&
        needs.head-check.outputs.relevant != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      has-autocommit-app: ${{ steps.check-autocommit-app.outputs.has-app }}
    steps:
      - name: Require a registered performance runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@e6fa595a336e95d800c1139bdebf6d749ee6f186 # post-v1.10.0
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB","fast"]]'

      - name: Check for the auto-commit GitHub App credentials
        id: check-autocommit-app
        if: github.event_name != 'pull_request'
        # Gates the post-merge commit job so a repo that has not yet provisioned
        # the AUTO_COMMIT_APP_* GitHub App degrades to a logged no-op (the PR
        # comment still posts) instead of a red push-build. See
        # docs/runbooks/perf-numbers-auto-commit.md.
        env:
          AUTO_COMMIT_APP_ID: ${{ secrets.AUTO_COMMIT_APP_ID }}
          AUTO_COMMIT_APP_PRIVATE_KEY: ${{ secrets.AUTO_COMMIT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AUTO_COMMIT_APP_ID:-}" ] && \
             [ -n "${AUTO_COMMIT_APP_PRIVATE_KEY:-}" ]; then
            echo "has-app=true" >> "${GITHUB_OUTPUT}"
          else
            if [ "${GITHUB_EVENT_NAME:-}" = "push" ] || [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
              echo "::warning::AUTO_COMMIT_APP_* secrets are not set; skipping the perf doc auto-commit. See docs/runbooks/perf-numbers-auto-commit.md."
            fi
            echo "has-app=false" >> "${GITHUB_OUTPUT}"
          fi

  perf-benchmarks:
    name: Perf benchmarks ${{ matrix.unity-version }} ${{ matrix.test-mode }} ${{ matrix.benchmark-suite }}
    needs:
      - runner-preflight
    # Licensed Unity runs only for protected code, controlled dispatches, and trusted
    # same-repository pull requests. Fork and Dependabot pull requests cannot
    # reach this job or its Unity/build-lock credentials.
    # Both published matrix entries use isolated Standalone IL2CPP Release players.
    # Pinned to ELI-MACHINE via the `fast` label (the only self-hosted Windows
    # runner carrying it). Keep in sync with the preflight REQUIRED_LABELS.
    env:
      MEASURED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    runs-on: [self-hosted, Windows, RAM-64GB, fast]
    timeout-minutes: 900
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # LATEST Unity version only -- the documented numbers track the newest
        # supported runtime. This static mirror is enforced against
        # .github/unity-versions.json by validate-unity-versions.js and remains
        # statically attestable by the organization lock analyzer.
        unity-version:
          - 6000.5.2f1
        # One published scope: the Standalone IL2CPP Release player that shipped
        # games run. The stripped player cannot measure GC.Alloc, so the renderer
        # omits allocation columns instead of adding a second Mono benchmark leg.
        test-mode:
          - standalone
        # Internal diagnostics and cross-library comparisons run in separate
        # players so destructive registration benchmarks cannot leave heap or
        # global-library state behind for the comparison matrix.
        benchmark-suite:
          - internal
          - comparisons
    steps:
      - name: Require current PR head before self-hosted setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@e6fa595a336e95d800c1139bdebf6d749ee6f186 # post-v1.10.0
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Remove stale Unity editor validator
        timeout-minutes: 2
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $parent = [IO.Path]::GetFullPath((Join-Path $workspace '.ci'))
          $target = [IO.Path]::GetFullPath((Join-Path $parent 'unity-helpers'))
          if (-not $target.StartsWith("$workspace\", [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Validator checkout path escaped the workspace.'
          }
          if (Test-Path -LiteralPath $parent) {
            $parentItem = Get-Item -LiteralPath $parent -Force
            if (($parentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Validator checkout parent is a reparse point.'
            }
          }
          if (Test-Path -LiteralPath $target) {
            $targetItem = Get-Item -LiteralPath $target -Force
            if (($targetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              $targetItem.Delete()
            } else {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          if (Test-Path -LiteralPath $target) {
            throw 'Validator checkout directory could not be removed.'
          }

      - name: Checkout trusted Unity editor validator
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_NOSYSTEM: 1
          GIT_CONFIG_GLOBAL: /dev/null
        with:
          repository: Ambiguous-Interactive/unity-helpers
          ref: 76712db791093a9c6b2eccdd9c7bd1b4f1cdb24d
          path: .ci/unity-helpers
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Require manually installed Unity editor
        timeout-minutes: 10
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          & "$env:GITHUB_WORKSPACE/.ci/unity-helpers/scripts/unity/ensure-editor.ps1" `
            -UnityVersion '${{ matrix.unity-version }}' `
            -InstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -ProvisioningProfile ${{ fromJSON('{"editmode":"EditorOnly","playmode":"EditorOnly","standalone":"StandaloneWindowsIl2Cpp"}')[matrix.test-mode] }} `
            -DiagnosticsPath (Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation') `
            -CiManagedOnly `
            -RequireHealthyExisting

      - name: Bind validated Unity editor
        timeout-minutes: 2
        shell: pwsh
        run: |
          # ensure-editor writes this summary from a finally block, so the evidence
          # exists for a failed gate too, and writing it under RUNNER_TEMP keeps it
          # out of reach of the repository checkout that follows.
          $source = Join-Path $env:RUNNER_TEMP 'dx-unity-editor-validation\ensure-editor-summary.json'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Unity editor validation evidence was not written: $source"
          }
          $summary = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3\${{ matrix.unity-version }}\Editor\Unity.exe'))
          # A summary written by a failed gate can record no editor at all, and
          # GetFullPath('') throws an ArgumentException instead of saying so.
          $recorded = [string]$summary.editorPath
          $actual = if ($recorded) { [IO.Path]::GetFullPath($recorded) } else { '(none recorded)' }
          if (-not [string]::Equals($actual, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Validated editor '$actual' did not match the canonical editor '$expected'."
          }
          "UNITY_EDITOR_PATH=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Enable Git long paths
        timeout-minutes: 2
        shell: pwsh
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dxm-gitconfig
        with:
          lfs: true
          persist-credentials: false
          ref: ${{ env.MEASURED_SHA }}

      - name: Print runner diagnostics
        timeout-minutes: 2
        # Composite action runs PowerShell internally; `shell: bash` on this
        # self-hosted Windows runner resolves to the WSL stub and fails:
        # never use plain `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "perf (organization lock wraps the Unity section)"
          requested-labels: "self-hosted, Windows, RAM-64GB, fast"

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      # Each suite opts into only its own test assemblies. The separate matrix
      # entries build separate players and therefore separate managed heaps.
      - name: Compute benchmark assembly list
        id: compute
        timeout-minutes: 5
        uses: ./.github/actions/compute-unity-assemblies
        with:
          include-perf: ${{ matrix.benchmark-suite == 'internal' }}
          include-comparisons: ${{ matrix.benchmark-suite == 'comparisons' }}
          target: "${{ matrix.test-mode }}"

      # Capture privacy-safe machine specs for the doc/comment provenance line
      # (CPU/RAM/OS only -- collect-machine-specs.ps1 deliberately emits NO
      # hostname or runner name). Runs BEFORE the org lock so it never holds the
      # shared Unity seat, and writes into THIS leg's artifact dir so the existing
      # "Upload perf benchmark artifacts" step (which uploads the whole leg dir)
      # carries the specs to the doc/comment jobs. The script exits 0 even on
      # failure, so a probe error never reds the benchmark leg.
      - name: Collect machine specs
        timeout-minutes: 2
        shell: pwsh
        run: |
          $artifactsPath = '.artifacts/unity/perf/${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}'
          New-Item -ItemType Directory -Force -Path $artifactsPath | Out-Null
          ./scripts/unity/collect-machine-specs.ps1 `
            -OutputJson (Join-Path $artifactsPath 'machine-specs.json') `
            -OutputSummary (Join-Path $artifactsPath 'machine-specs.txt')

      # IL2CPP compiles generated C++ with `cl.exe`.
      # `assert-unity-host-prereqs` covers the VC++ RUNTIME (so the Editor
      # launches) but not the BUILD TOOLS (so IL2CPP can compile), and that gap
      # cost three licence seats and ~2h on 2026-07-31 (#333): three standalone
      # legs each took the organization lock, consumed a seat, built for twenty
      # minutes, then died with a message naming neither the host nor the cause.
      # Runs BEFORE the lock so a broken host costs seconds, not a seat.
      - name: Require an MSVC C++ toolchain for IL2CPP
        if: ${{ matrix.test-mode == 'standalone' }}
        timeout-minutes: 3
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: ./scripts/unity/assert-msvc-toolchain.ps1

      - name: Validate Unity license secrets
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Acquire organization Unity lock
        id: acquire_lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@e6fa595a336e95d800c1139bdebf6d749ee6f186 # post-v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: perf-${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire_lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Upload Unity editor validation diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-editor-validation-${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}
          path: ${{ runner.temp }}/dx-unity-editor-validation
          if-no-files-found: warn
          retention-days: 14

      - name: Run comparison contracts
        id: run_contracts
        if: ${{ matrix.benchmark-suite == 'comparisons' && steps.compute.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 30
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DXM_UNITY_TEST_CATEGORY: ComparisonContract
        run: |
          # Investigation (2026-08-13): keep this name distinct from
          # PerfComparison. Unity's category filter uses substring matching,
          # so the old Comparison name ran the entire published matrix during
          # the contract preflight.
          $contractProjectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\p\${{ matrix.unity-version }}-comparison-contracts'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode 'playmode' `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/perf-contracts/${{ matrix.unity-version }}' `
            -ProjectPath $contractProjectPath `
            -CachePath $cachePath `
            -LicenseReturnOwner Central `
            -IncludeComparisons

      - name: Verify comparison contracts actually ran
        if: ${{ matrix.benchmark-suite == 'comparisons' && steps.run_contracts.outcome == 'success' }}
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/perf-contracts/${{ matrix.unity-version }}
          label: Comparison contracts ${{ matrix.unity-version }}

      - name: Upload comparison contract artifacts
        if: ${{ always() && matrix.benchmark-suite == 'comparisons' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: comparison-contracts-${{ matrix.unity-version }}
          path: .artifacts/unity/perf-contracts/${{ matrix.unity-version }}
          if-no-files-found: warn
          retention-days: 14

      - name: Dump comparison contract log tail on failure or cancellation
        if: ${{ (failure() || cancelled()) && matrix.benchmark-suite == 'comparisons' }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/perf-contracts/${{ matrix.unity-version }}
          label: Comparison contracts ${{ matrix.unity-version }}

      - name: Run Unity Test Runner
        id: run_tests
        if: ${{ success() && steps.compute.outputs.is-empty != 'true' && steps.acquire_lock.outputs.acquired == 'true' }}
        # 180 (not 120): the Standalone leg builds an IL2CPP player and may run
        # cold after runner maintenance. Stays strictly below the job-level
        # timeout (900) so the step clock fires first and releases the shared
        # Unity seat. Must stay >= the validator's RUN_BUDGET (120).
        timeout-minutes: 180
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          DX_PERF_COMMIT: ${{ env.MEASURED_SHA }}
          DXM_UNITY_TEST_CATEGORY: ${{ matrix.benchmark-suite == 'internal' && 'PerfBench' || 'PerfComparison' }}
        run: |
          # HASHTABLE splat (not an array): array splatting passes elements
          # POSITIONALLY, so '-IncludeComparisons' would bind to $RepoRoot. A
          # hashtable binds by parameter name. run-ci-tests.ps1 strips
          # BuildOptions.Development from the test player UNCONDITIONALLY (the
          # Unity Test Framework injects it by default; Release is the runner's
          # contract and -ReleasePlayerBuild is a kept-for-clarity no-op), so the
          # published numbers come from a true Release IL2CPP player
          # (Release C++ config, isDebugBuild=false).
          $extra = @{
              IncludeComparisons = '${{ matrix.benchmark-suite }}' -eq 'comparisons'
              ReleaseCodeOptimization = $true
              ReleasePlayerBuild = $true
              StandaloneScriptingBackend = 'IL2CPP'
          }
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\p\${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}'
          $cachePath = Join-Path $env:RUNNER_WORKSPACE 'dxm-c\${{ matrix.unity-version }}'
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -UnityInstallRoot (Join-Path $env:RUNNER_TOOL_CACHE 'u6-v3') `
            -TestMode '${{ matrix.test-mode }}' `
            -AssemblyNames $env:DXM_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/perf/${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}' `
            -ProjectPath $projectPath `
            -CachePath $cachePath `
            -LicenseReturnOwner Central `
            @extra

      - name: Capture exact standalone player size
        if: ${{ matrix.test-mode == 'standalone' && matrix.benchmark-suite == 'internal' && steps.run_tests.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $projectPath = Join-Path $env:RUNNER_WORKSPACE 'dxm-u\p\${{ matrix.unity-version }}-standalone-internal'
          $playerDir = Join-Path $projectPath 'Build\DxmTestPlayer'
          $playerExe = Join-Path $playerDir 'DxmTestPlayer.exe'
          if (-not (Test-Path -LiteralPath $playerExe -PathType Leaf)) {
            throw "Validated standalone player was not found at $playerExe"
          }
          $files = @(Get-ChildItem -LiteralPath $playerDir -File -Recurse -Force)
          [long]$totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          $manifest = [ordered]@{
            commit = '${{ env.MEASURED_SHA }}'
            unityVersion = '${{ matrix.unity-version }}'
            scriptingBackend = 'IL2CPP'
            codeOptimization = 'Release'
            il2CppConfiguration = 'Release'
            apiCompatibility = '.NET Standard 2.1'
            totalBytes = $totalBytes
            executableBytes = (Get-Item -LiteralPath $playerExe).Length
            fileCount = $files.Count
          }
          $artifactsPath = '.artifacts/unity/perf/${{ matrix.unity-version }}-standalone-internal'
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifactsPath 'player-size.json') -Encoding utf8
          "totalBytes=$totalBytes executableBytes=$($manifest.executableBytes) fileCount=$($files.Count)" |
            Set-Content -LiteralPath (Join-Path $artifactsPath 'player-size.txt') -Encoding utf8
          Write-Host "Exact standalone player size: $totalBytes bytes across $($files.Count) files."

      - name: Dump Unity log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/perf/${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}
          label: Perf ${{ matrix.unity-version }} ${{ matrix.test-mode }} ${{ matrix.benchmark-suite }}

      - name: Verify tests actually ran
        if: >-
          ${{
            !cancelled() &&
            steps.compute.outcome == 'success' &&
            (steps.compute.outputs.is-empty == 'true' || steps.run_tests.outcome != 'skipped')
          }}
        timeout-minutes: 10
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/perf/${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}
          label: Perf ${{ matrix.unity-version }} ${{ matrix.test-mode }} ${{ matrix.benchmark-suite }}
          expected-empty: ${{ steps.compute.outputs.is-empty }}

      - name: Require every supported comparison row
        if: ${{ matrix.benchmark-suite == 'comparisons' && steps.run_tests.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $artifactsPath = '.artifacts/unity/perf/${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}'
          $inputs = @(Get-ChildItem -LiteralPath $artifactsPath -File -Recurse |
              Where-Object { $_.Name -in @('unity.log', 'results.xml') } |
              ForEach-Object { @('--input', $_.FullName) })
          if ($inputs.Count -eq 0) {
            throw "No comparison result inputs were found under $artifactsPath."
          }
          $currentBaseline = Join-Path $artifactsPath 'comparison-rows.csv'
          & node scripts/unity/extract-perf-baseline.js @inputs `
            --scope Standalone `
            --output $currentBaseline
          if ($LASTEXITCODE -ne 0) {
            throw 'Comparison baseline extraction failed.'
          }
          ./scripts/unity/require-comparison-rows.ps1 -BaselinePath $currentBaseline

      - name: Upload perf benchmark artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}
          path: .artifacts/unity/perf/${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}
          if-no-files-found: warn
          retention-days: 14

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@e6fa595a336e95d800c1139bdebf6d749ee6f186
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: perf

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.acquire_lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@e6fa595a336e95d800c1139bdebf6d749ee6f186
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@e6fa595a336e95d800c1139bdebf6d749ee6f186 # post-v1.10.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: perf-${{ matrix.unity-version }}-${{ matrix.test-mode }}-${{ matrix.benchmark-suite }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@e6fa595a336e95d800c1139bdebf6d749ee6f186
        with:
          # A leg that aborts before `Acquire organization Unity lock` runs never
          # took a seat, and this gate's own contract treats `acquired: false` as
          # proof that licensed cleanup was not required. Feeding it the skipped
          # step's EMPTY output instead made it fail closed on work that never
          # started, so a leg with one honest failure reported two (#327).
          #
          # This does not weaken the gate. It reads `outcome`, not `acquired`, and
          # only the two values that prove the step never executed map to 'false'.
          # An acquire that RAN and failed part-way reports outcome=failure while
          # `acquired` reads empty, so the empty value still flows through and the
          # gate still fails -- that ambiguous shape is the seat leak the bare
          # `if: always()` above exists to catch, and it stays caught.
          acquired: ${{ (steps.acquire_lock.outcome == 'skipped' || steps.acquire_lock.outcome == '') && 'false' || steps.acquire_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  perf-unity-success:
    name: Performance Unity Success
    if: always()
    needs:
      - head-check
      - runner-preflight
      - perf-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRUSTED_PR: >-
        ${{
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'
          )
        }}
      SUPERSEDED: ${{ needs.head-check.outputs.superseded }}
      RELEVANT: ${{ needs.head-check.outputs.relevant }}
    steps:
      - name: Require complete performance validation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.head-check.result }}" = success
          if [ "${SUPERSEDED}" = "true" ] || [ "${RELEVANT}" = "false" ] || [ "${TRUSTED_PR}" != "true" ]; then
            test "${{ needs.runner-preflight.result }}" = skipped
            test "${{ needs.perf-benchmarks.result }}" = skipped
            echo "Licensed performance benchmarks skip superseded, documentation-only, or untrusted pull requests."
          else
            test "${{ needs.runner-preflight.result }}" = success
            test "${{ needs.perf-benchmarks.result }}" = success
          fi

  comment-perf-doc:
    name: Report performance deltas on PR
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        always() &&
        needs.head-check.outputs.superseded != 'true' &&
        needs.head-check.outputs.relevant != 'false'
      }}
    needs:
      - head-check
      - perf-benchmarks
      - perf-unity-success
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      LATEST_VERSION: 6000.5.2f1
      PERF_BASELINE: docs/architecture/perf-baseline.csv
      PERF_DELTA: .artifacts/perf-pr-delta.md
      MEASURED_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BENCHMARK_RESULT: ${{ needs.perf-benchmarks.result }}
    steps:
      - name: Initialize current-head performance status
        shell: bash
        run: |
          set -euo pipefail
          PERF_COMMENT="${RUNNER_TEMP}/perf-pr-comment.md"
          echo "PERF_COMMENT=${PERF_COMMENT}" >> "${GITHUB_ENV}"
          short_sha="${MEASURED_SHA:0:7}"
          mkdir -p "$(dirname "${PERF_COMMENT}")"
          {
            echo '<!-- dxmessaging-performance-numbers -->'
            echo '## Performance Numbers'
            echo
            echo "Measured commit: [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${MEASURED_SHA})"
            echo "Workflow run: [\`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT})"
            echo
            echo "Current benchmark matrix result: **${BENCHMARK_RESULT}**."
            echo
            echo 'Detailed evidence for this head was not produced. Inspect the linked workflow run; this status deliberately replaces any older successful result.'
          } > "${PERF_COMMENT}"

      - name: Checkout trusted PR base reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download perf benchmark artifacts
        if: needs.perf-benchmarks.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: perf-${{ env.LATEST_VERSION }}-*
          path: .artifacts/perf-download

      - name: Require current PR head before reporting
        if: needs.perf-benchmarks.result == 'success'
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@e6fa595a336e95d800c1139bdebf6d749ee6f186 # post-v1.10.0
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ env.MEASURED_SHA }}

      - name: Classify benchmark comparison compatibility
        if: needs.perf-benchmarks.result == 'success'
        id: compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | [.filename, .previous_filename] | .[] | select(. != null)')"
          methodology_pattern='^(Tests/(Runtime|Editor)/(Benchmarks|Comparisons|Allocations)/'
          methodology_pattern+='|Tests/Runtime/Scripts/Messages/Simple(Targeted|Untargeted|Broadcast)Message\.cs$'
          methodology_pattern+='|scripts/unity/(extract-perf-baseline|perf-scenarios|render-perf|run-ci-tests)'
          methodology_pattern+='|scripts/unity/lib/asmdef-discovery\.js$'
          methodology_pattern+='|\.github/comparison-packages\.json$'
          methodology_pattern+='|\.github/unity-versions\.json$'
          methodology_pattern+='|\.github/actions/compute-unity-assemblies/)'
          # perf-numbers.yml itself is intentionally not a blanket incompatibility.
          # Its runner labels, category, comparison/perf opt-ins, Release flags,
          # emitted platform, complete scenario set, and commit stamp are pinned
          # separately. Reporting/orchestration-only changes therefore retain the
          # current-baseline delta without allowing a profile change to compare.
          incompatible="$(printf '%s\n' "${changed_files}" | grep -E \
            "${methodology_pattern}" \
            || true)"
          if [ -n "${incompatible}" ]; then
            echo 'comparable=false' >> "${GITHUB_OUTPUT}"
            {
              echo 'Benchmark or harness paths changed, so historical deltas are non-comparable:'
              printf '%s\n' "${incompatible}" | sed 's/^/- `/' | sed 's/$/`/'
            } > .artifacts/perf-comparison-status.md
          else
            echo 'comparable=true' >> "${GITHUB_OUTPUT}"
            echo 'Benchmark methodology is unchanged; the historical Standalone comparison is diagnostic regression smoke.' > .artifacts/perf-comparison-status.md
          fi

      - name: Render current PR performance evidence
        if: needs.perf-benchmarks.result == 'success'
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          inputs=()
          while IFS= read -r -d '' file; do
            inputs+=(--input "${file}")
          done < <(find .artifacts/perf-download \
            -type f \( -name 'unity.log' -o -name 'results.xml' \) -print0)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::error::No unity.log/results.xml found for ${LATEST_VERSION}."
            exit 1
          fi

          regressed=false
          baseline_commit=''
          current_baseline=.artifacts/perf-current-Standalone.csv
          node scripts/unity/extract-perf-baseline.js \
            "${inputs[@]}" \
            --scope Standalone \
            --output "${current_baseline}"
          current_commits="$(awk -F, 'NR > 1 && $3 != "" { print $3 }' \
            "${current_baseline}" | sort -u)"
          if [ "${current_commits}" != "${MEASURED_SHA}" ]; then
            echo "::error::Current Standalone rows were not stamped only with ${MEASURED_SHA}."
            exit 1
          fi
          current_platforms="$(awk -F, 'NR > 1 && $2 != "" { print $2 }' \
            "${current_baseline}" | sort -u)"
          expected_platform="Standalone IL2CPP x64 Release (WindowsPlayer; Unity ${LATEST_VERSION})"
          if [ "${current_platforms}" != "${expected_platform}" ]; then
            echo "::error::Current Standalone platform did not match ${expected_platform}."
            printf '%s\n' "${current_platforms}"
            exit 1
          fi
          if [ '${{ steps.compatibility.outputs.comparable }}' = true ]; then
            baseline_rows=0
            if [ -f "${PERF_BASELINE}" ]; then
              baseline_rows="$(awk -F, 'NR > 1 && $1 != "" { count++ } END { print count + 0 }' \
                "${PERF_BASELINE}")"
            fi
            if [ "${baseline_rows}" -eq 0 ]; then
              echo '_Historical delta omitted because the trusted baseline has no measured rows yet._' > "${PERF_DELTA}"
            else
              baseline_platforms="$(awk -F, 'NR > 1 && $2 != "" { print $2 }' \
                "${PERF_BASELINE}" | sort -u)"
              if [ "${baseline_platforms}" != "${expected_platform}" ]; then
                echo "::error::Standalone baseline platform did not match ${expected_platform}."
                printf '%s\n' "${baseline_platforms}"
                exit 1
              fi
              if ! diff -u \
                <(tail -n +2 "${PERF_BASELINE}" | cut -d, -f1 | sort) \
                <(tail -n +2 "${current_baseline}" | cut -d, -f1 | sort); then
                echo '::error::Current Standalone scenario set does not match the trusted historical baseline.'
                exit 1
              fi
              output="$(node scripts/unity/render-perf-deltas.js \
                "${inputs[@]}" \
                --baseline-csv "${PERF_BASELINE}" \
                --unity-version "${LATEST_VERSION}" \
                --scope Standalone \
                --output "${PERF_DELTA}")"
              changed="$(printf '%s\n' "${output}" | sed -n 's/^changed=//p')"
              regressed="$(printf '%s\n' "${output}" | sed -n 's/^regressed=//p')"
              if [ "${changed}" != true ] && [ "${changed}" != false ]; then
                echo "::error::Delta renderer omitted a valid changed signal."
                exit 1
              fi
              if [ "${regressed}" != true ] && [ "${regressed}" != false ]; then
                echo "::error::Delta renderer omitted a valid regressed signal."
                exit 1
              fi
              baseline_commit="$(awk -F, 'NR > 1 && $3 != "" { print $3 }' \
                "${PERF_BASELINE}" | sort -u)"
              if [ "$(printf '%s\n' "${baseline_commit}" | sed '/^$/d' | wc -l)" -ne 1 ]; then
                echo '::error::Standalone baseline does not name exactly one measured commit.'
                exit 1
              fi
            fi
          else
            echo '_Historical delta omitted because benchmark or harness code changed in this pull request._' > "${PERF_DELTA}"
          fi
          echo "regressed=${regressed}" >> "${GITHUB_OUTPUT}"

          : > .artifacts/perf-target-map-current.txt
          while IFS= read -r file; do
            grep 'DXM_TARGET_MAP_' "${file}" \
              | sed -E 's/^.*(DXM_TARGET_MAP_(BENCHMARK|CONSTRUCTION))/\1/' \
              | sed 's/^/[Standalone] /' \
              >> .artifacts/perf-target-map-current.txt || true
          done < <(find .artifacts/perf-download -type f \
            -name player.log -print | sort)
          sort -o .artifacts/perf-target-map-current.txt .artifacts/perf-target-map-current.txt

          awk '
            $1 == "[Standalone]" && $2 == "DXM_TARGET_MAP_BENCHMARK" { print $2, $4, $5 }
            $1 == "[Standalone]" && $2 == "DXM_TARGET_MAP_CONSTRUCTION" { print $2, $3 }
          ' .artifacts/perf-target-map-current.txt \
            > .artifacts/perf-target-map-Standalone-identities.txt
          duplicate_target_keys="$(sort \
            .artifacts/perf-target-map-Standalone-identities.txt | uniq -d)"
          if [ -n "${duplicate_target_keys}" ]; then
            echo '::error::Current Standalone TargetMap evidence repeated scenario identities.'
            printf '%s\n' "${duplicate_target_keys}"
            exit 1
          fi
          sort -u \
            .artifacts/perf-target-map-Standalone-identities.txt \
            > .artifacts/perf-target-map-Standalone-keys.txt

          expected_target_keys=.artifacts/perf-target-map-expected-keys.txt
          : > "${expected_target_keys}"
          for key_count in 1 4 16 256 4096; do
            for operation in Hit Miss Churn; do
              echo "DXM_TARGET_MAP_BENCHMARK keyCount=${key_count} operation=${operation}" \
                >> "${expected_target_keys}"
            done
            echo "DXM_TARGET_MAP_CONSTRUCTION keyCount=${key_count}" \
              >> "${expected_target_keys}"
          done
          sort -u -o "${expected_target_keys}" "${expected_target_keys}"
          if ! diff -u \
            "${expected_target_keys}" \
            .artifacts/perf-target-map-Standalone-keys.txt; then
            echo '::error::Current Standalone TargetMap identity set does not exactly match the trusted harness.'
            exit 1
          fi

          short_sha="${MEASURED_SHA:0:7}"
          base_short="${BASE_SHA:0:7}"
          final_comment="${PERF_COMMENT}.complete"
          {
            echo '<!-- dxmessaging-performance-numbers -->'
            echo '## Performance Numbers'
            echo
            echo "Measured commit: [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${MEASURED_SHA})"
            echo "Trusted reporting code (PR base): [\`${base_short}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${BASE_SHA})"
            if [ -n "${baseline_commit}" ]; then
              echo "Measured historical baseline: [\`${baseline_commit:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${baseline_commit})"
            fi
            echo "Workflow run: [\`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT})"
            echo
            cat .artifacts/perf-comparison-status.md
            echo
            echo '### Historical Standalone delta'
            echo
            echo 'Delta direction: **+ is better; - is worse.**'
            echo
            cat "${PERF_DELTA}"
            echo
            echo '### Current TargetMap evidence'
            echo
            echo 'These raw rows are current-run diagnostics. Use fresh bracketed controls before accepting a micro-optimization.'
            echo
            echo '```text'
            cat .artifacts/perf-target-map-current.txt
            echo '```'
          } > "${final_comment}"
          mv "${final_comment}" "${PERF_COMMENT}"

      - name: Require current PR head before comment update
        id: report-freshness
        if: always()
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@e6fa595a336e95d800c1139bdebf6d749ee6f186 # post-v1.10.0
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ env.MEASURED_SHA }}

      - name: Create or update PR performance comment
        if: ${{ always() && steps.report-freshness.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dxmessaging-performance-numbers -->';
            const body = fs.readFileSync(process.env.PERF_COMMENT, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail after reporting a measured regression
        if: steps.delta.outputs.regressed == 'true'
        shell: bash
        run: |
          echo "::error::Standalone performance exceeded the diagnostic regression threshold; see the PR delta comment."
          exit 1

  commit-perf-doc:
    name: Commit refreshed perf doc to the default branch
    needs:
      - runner-preflight
      - perf-benchmarks
      - perf-unity-success
    # DEFAULT-BRANCH REFRESH path: after a PR merges (push event) -- or on a
    # manual workflow_dispatch from the default branch, which is the supported
    # RECOVERY path when an earlier auto-commit failed -- re-render the doc from
    # the just-benchmarked code, regenerate the master baseline CSV from the same
    # run, and if either moved, land them on the default branch. The landing is
    # attempted in two tiers:
    #   1. DIRECT PUSH with a GitHub App installation token (the built-in
    #      GITHUB_TOKEN cannot push to a protected branch). Requires the App to
    #      be a branch-protection/ruleset bypass actor.
    #   2. FALLBACK PULL REQUEST: if the direct push is rejected (GH006 --
    #      bypass not granted, or required status checks on a classic rule), the
    #      job pushes the commit to a ci/perf-auto-update-* branch, opens a PR
    #      with the App token, and enables squash auto-merge. The numbers are
    #      then NEVER lost: worst case the PR waits for a human merge (which can
    #      require an admin if a required check never reports on doc-only
    #      diffs -- see the runbook's fallback prerequisites). The pull_request
    #      trigger ignores the generated doc and baseline paths, so the fallback
    #      PR cannot run licensed benchmarks.
    # Recursion is broken by the push trigger's paths-ignore on the perf doc +
    # baseline, not by token identity, so the doc + baseline auto-commit cannot
    # re-run the benchmark -- no loop guard needed. Gated on a clean benchmark
    # AND the App credentials being present (otherwise this job degrades to a
    # logged no-op); stale benchmark artifacts also warn and skip if another
    # merge advanced the branch first. See
    # docs/runbooks/perf-numbers-auto-commit.md.
    if: >-
      ${{
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          )
        ) &&
        needs.perf-benchmarks.result == 'success' &&
        needs.runner-preflight.outputs.has-autocommit-app == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The push/PR is authenticated by the GitHub App installation token (minted
    # below), NOT the job's GITHUB_TOKEN, so contents:read is all this job's own
    # token needs (checkout fallback + artifact download). The fallback PR is
    # also created with the App token, so no pull-requests scope is needed here
    # either -- but the App itself must hold Contents AND Pull requests
    # read-and-write (see the runbook).
    permissions:
      contents: read
    env:
      LATEST_VERSION: 6000.5.2f1
      PERF_DOC: docs/architecture/performance.md
      # The committed master baseline used by the PR's diagnostic historical
      # delta. Regenerated from the real post-merge run and committed
      # alongside performance.md so the seeded bootstrap baseline becomes REAL
      # after the first master push. Added to the push trigger's paths-ignore so
      # this auto-commit cannot re-trigger the benchmark workflow.
      PERF_BASELINE: docs/architecture/perf-baseline.csv
    steps:
      - name: Generate auto-commit GitHub App token
        id: app-token
        # The App must have Contents + Pull requests read-and-write, be installed
        # on this repo, and (for the fast path) be allowed to bypass the
        # master/main branch protection. The job `if` above already proved both
        # secrets are present. The action's v3 metadata requires app-id; keep
        # this name aligned with actionlint instead of using legacy aliases.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_PRIVATE_KEY }}

      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Check default branch is still current
        id: default-branch
        env:
          GH_FETCH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GH_FETCH_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 origin \
            "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          latest_sha="$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")"
          if [ "${latest_sha}" != "${GITHUB_SHA}" ]; then
            message="Default branch ${GITHUB_REF_NAME} advanced from ${GITHUB_SHA} to ${latest_sha}; "
            message+="skipping the perf doc auto-commit for stale benchmark artifacts. "
            message+="A newer push run will publish current numbers."
            echo "::warning::${message}"
            echo "fresh=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "fresh=true" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        if: steps.default-branch.outputs.fresh == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        if: steps.default-branch.outputs.fresh == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i --no-audit --no-fund
          fi

      - name: Download perf benchmark artifacts
        if: steps.default-branch.outputs.fresh == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: perf-${{ env.LATEST_VERSION }}-*
          path: .artifacts/perf-download

      - name: Render dispatch-throughput table from this run
        id: render
        if: steps.default-branch.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          inputs=()
          while IFS= read -r -d '' file; do
            inputs+=(--input "${file}")
          done < <(find .artifacts/perf-download \
            -type f \( -name 'unity.log' -o -name 'results.xml' \) -print0)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::error::No unity.log/results.xml found for ${LATEST_VERSION}."
            exit 1
          fi
          # Embed the real runner provenance in the committed doc's "Runner:" line
          # from the privacy-safe machine-specs JSON the perf leg uploaded (glob;
          # first match). render-perf-doc.js falls back to a neutral description
          # when it is absent, so a missing probe never blocks the commit.
          machine_specs_json="$(find .artifacts/perf-download \
            -type f -name 'machine-specs.json' -print 2>/dev/null | sort | head -n1)"
          machine_specs_args=()
          if [ -n "${machine_specs_json}" ]; then
            machine_specs_args=(--machine-specs "${machine_specs_json}")
          fi
          node scripts/unity/render-perf-doc.js \
            "${inputs[@]}" \
            --doc "${PERF_DOC}" \
            --unity-version "${LATEST_VERSION}" \
            "${machine_specs_args[@]}"
          npx prettier --write "${PERF_DOC}"
          # Regenerate the committed master baseline from the SAME real run so the
          # diagnostic PR delta compares against REAL numbers after
          # the first master push (the committed seed is only a bootstrap).
          # --replace overwrites the existing rows with this run's Standalone rows.
          node scripts/unity/extract-perf-baseline.js \
            "${inputs[@]}" \
            --output "${PERF_BASELINE}" \
            --replace \
            --scope Standalone
          node -e \
            "require('./scripts/unity/perf-scenarios.js').COMPARISON_SUPPORTED_SCENARIO_IDS.forEach((id) => console.log(id))" \
            | sort > .artifacts/perf-expected-comparison-rows.txt
          awk -F, 'NR > 1 && $1 ~ /^Comparison_/ { print $1 }' "${PERF_BASELINE}" \
            | sort > .artifacts/perf-actual-comparison-rows.txt
          if ! diff -u \
            .artifacts/perf-expected-comparison-rows.txt \
            .artifacts/perf-actual-comparison-rows.txt; then
            echo '::error::Published comparison rows do not match the pinned capability manifest.'
            exit 1
          fi
          # The doc OR the baseline moving counts as a change to commit. Check both
          # tracked paths so a baseline-only refresh is still committed.
          if git diff --quiet -- "${PERF_DOC}" "${PERF_BASELINE}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify rendered doc passes the required prettier and markdownlint gates
        if: steps.default-branch.outputs.fresh == 'true' && steps.render.outputs.changed == 'true'
        # Belt-and-suspenders, now load-bearing: this push lands DIRECTLY on the
        # default branch, where the required prettier AND markdownlint workflows
        # run on the resulting commit. The perf doc is the only file in this push
        # and it is machine-generated, so verify both gates HERE and fail loudly
        # rather than push a doc that reds a required check on master (prettier
        # alone does not enforce markdownlint rules such as MD001 heading-increment
        # -- the renderer's headings must sit correctly under the doc's h2 parent).
        run: |
          npx prettier --check "${PERF_DOC}"
          npx markdownlint-cli2 "${PERF_DOC}"

      - name: Commit and push refreshed perf doc
        if: steps.default-branch.outputs.fresh == 'true' && steps.render.outputs.changed == 'true'
        env:
          GH_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_BRANCH_PREFIX: ci/perf-auto-update
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GH_PUSH_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 origin \
            "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          latest_sha="$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")"
          if [ "${latest_sha}" != "${GITHUB_SHA}" ]; then
            message="Default branch ${GITHUB_REF_NAME} advanced from ${GITHUB_SHA} to ${latest_sha}; "
            message+="skipping the perf doc auto-commit for stale benchmark artifacts. "
            message+="A newer push run will publish current numbers."
            echo "::warning::${message}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "${PERF_DOC}"
          # Stage the regenerated baseline in the SAME commit so the gate + delta
          # baselines become real on master. paths-ignore covers both files, so
          # this commit cannot re-trigger the benchmark workflow.
          git add -- "${PERF_BASELINE}"
          if git diff --cached --quiet -- "${PERF_DOC}" "${PERF_BASELINE}"; then
            echo "No staged perf doc/baseline changes remain; nothing to commit."
            exit 0
          fi
          git commit -m "docs(perf): auto-update dispatch throughput numbers"

          # Best-effort: close superseded fallback PRs from earlier failed runs.
          # Their rendered numbers are stale the moment a newer run lands (or is
          # about to land) fresher ones. Never let cleanup fail the job.
          close_stale_fallback_prs() {
            keep_branch="${1:-}"
            GH_TOKEN="${GH_PUSH_TOKEN}" gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"${FALLBACK_BRANCH_PREFIX}\")) | select(.headRefName != \"${keep_branch}\") | .number" \
              2>/dev/null | while read -r stale_pr; do
                echo "Closing superseded perf fallback PR #${stale_pr}."
                GH_TOKEN="${GH_PUSH_TOKEN}" gh pr close "${stale_pr}" \
                  --repo "${GITHUB_REPOSITORY}" --delete-branch 2>/dev/null || true
              done || true
          }

          # TIER 1: direct push. Works when the App is a branch-protection /
          # ruleset bypass actor (the documented fast path).
          set +e
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tee "${RUNNER_TEMP}/perf-push.log"
          push_status=${PIPESTATUS[0]}
          set -e
          if [ "${push_status}" -eq 0 ]; then
            close_stale_fallback_prs
            exit 0
          fi

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 origin \
            "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          latest_after_push="$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")"
          if [ "${latest_after_push}" != "${GITHUB_SHA}" ]; then
            message="Default branch ${GITHUB_REF_NAME} advanced from ${GITHUB_SHA} "
            message+="to ${latest_after_push} during the perf doc push; skipping stale "
            message+="benchmark artifacts. A newer push run will publish current numbers."
            echo "::warning::${message}"
            exit 0
          fi

          if grep -q "GH006" "${RUNNER_TEMP}/perf-push.log"; then
            message="Direct perf doc push was rejected by branch protection (GH006): the "
            message+="auto-commit App is not a bypass actor for ${GITHUB_REF_NAME} (or a classic "
            message+="rule requires status checks, which classic bypass cannot waive). Falling "
            message+="back to an auto-merge pull request. Fix the bypass per "
            message+="docs/runbooks/perf-numbers-auto-commit.md to restore the fast path."
            echo "::warning::${message}"
          else
            echo "::warning::Direct perf doc push failed (exit ${push_status}); falling back to a pull request."
          fi

          # TIER 2: fallback pull request. Push the SAME commit to a unique
          # ci/perf-auto-update-* branch, open a PR with the App token, and enable
          # squash auto-merge. The pull_request trigger ignores its generated
          # doc+baseline-only diff, so this PR cannot run the benchmark. Superseded
          # fallback PRs are closed AFTER the replacement exists, so a failure
          # here never destroys the only pending copy of valid (if stale) numbers.
          fallback_branch="${FALLBACK_BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${fallback_branch}"

          pr_body_file="${RUNNER_TEMP}/perf-pr-body.md"
          {
            echo "Automated fallback: the Performance Numbers workflow could not push the"
            echo "refreshed \`${PERF_DOC}\` + \`${PERF_BASELINE}\` directly to"
            echo "\`${GITHUB_REF_NAME}\` (branch protection rejected the App push), so the"
            echo "same commit is delivered as a pull request instead."
            echo
            echo "- Measured commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Auto-merge (squash) is requested; if it does not complete, merge manually."
            echo
            echo "To restore the direct-push fast path, grant the auto-commit App bypass on"
            echo "the default branch protection: see docs/runbooks/perf-numbers-auto-commit.md."
          } > "${pr_body_file}"

          set +e
          pr_create_err="${RUNNER_TEMP}/perf-pr-create.err"
          pr_create_out="$(GH_TOKEN="${GH_PUSH_TOKEN}" gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${GITHUB_REF_NAME}" \
            --head "${fallback_branch}" \
            --title "docs(perf): auto-update dispatch throughput numbers" \
            --body-file "${pr_body_file}" 2>"${pr_create_err}")"
          pr_create_status=$?
          set -e
          # gh prints the PR URL on stdout, but keep this robust against extra
          # notice lines: extract the canonical /pull/<n> URL explicitly.
          pr_url="$(printf '%s\n' "${pr_create_out}" \
            | grep -Eo 'https://[^[:space:]]+/pull/[0-9]+' | tail -n1 || true)"
          if [ "${pr_create_status}" -ne 0 ] || [ -z "${pr_url}" ]; then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${fallback_branch}"
            message="Fallback PR creation failed (the App likely lacks Pull requests: write -- "
            message+="see docs/runbooks/perf-numbers-auto-commit.md). The refreshed numbers are "
            message+="preserved on branch ${fallback_branch}; open the PR manually: ${compare_url}"
            echo "::error::${message}"
            echo "gh stdout: ${pr_create_out}"
            cat "${pr_create_err}" || true
            exit 1
          fi
          echo "Fallback PR created: ${pr_url}"
          close_stale_fallback_prs "${fallback_branch}"

          set +e
          GH_TOKEN="${GH_PUSH_TOKEN}" gh pr merge "${pr_url}" \
            --repo "${GITHUB_REPOSITORY}" --squash --auto --delete-branch
          automerge_status=$?
          set -e
          if [ "${automerge_status}" -ne 0 ]; then
            # Enabling auto-merge fails when the PR is ALREADY mergeable ("clean
            # status", e.g. no required checks) and when repo auto-merge is
            # disabled. Try one direct squash merge to cover the first case
            # before settling for the manual-merge warning.
            set +e
            GH_TOKEN="${GH_PUSH_TOKEN}" gh pr merge "${pr_url}" \
              --repo "${GITHUB_REPOSITORY}" --squash --delete-branch
            direct_merge_status=$?
            set -e
            if [ "${direct_merge_status}" -eq 0 ]; then
              echo "Fallback PR squash-merged directly: ${pr_url}"
            else
              message="Auto-merge could not be enabled on the fallback PR (repo may have "
              message+="auto-merge disabled) and a direct merge was refused (checks pending "
              message+="or branch protection). The refreshed numbers are waiting for a manual "
              message+="merge: ${pr_url}"
              echo "::warning::${message}"
            fi
          else
            echo "Auto-merge (squash) enabled on ${pr_url}; it lands once required checks pass."
          fi
          message="Perf numbers were delivered via fallback PR instead of a direct push: ${pr_url} "
          message+="-- grant the auto-commit App branch-protection bypass to restore the fast path "
          message+="(docs/runbooks/perf-numbers-auto-commit.md)."
          echo "::warning::${message}"
