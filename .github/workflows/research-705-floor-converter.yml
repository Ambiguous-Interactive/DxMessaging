      - name: Convert integer control and pointer fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          cd "$RUNNER_TEMP/dxm-705"
          {
            uname -m
            cat /etc/os-release
            printf '%s\n' "$GITHUB_SHA"
          } > evidence/environment.log
          curl --fail --show-error --silent --location --retry 2 \
            https://download.unity3d.com/download_unity/0da89fac8e79/LinuxEditorInstaller/Unity-2021.3.45f1.tar.xz \
            --output unity.tar.xz
          echo 'bb5be9cc5faee3b05aac2aa19caaaa9b62d373f6fc06964db286897d7e4efa5c  unity.tar.xz' | sha256sum --check | tee evidence/archive.log
          tar -xJf unity.tar.xz --wildcards --no-same-owner \
            'Editor/Data/il2cpp/build/deploy/*' \
            'Editor/Data/MonoBleedingEdge/lib/mono/unityaot-linux/*'
          sha256sum --check evidence/closure.sha256 > evidence/closure.log
          root="$PWD"
          converter="$root/Editor/Data/il2cpp/build/deploy/il2cpp"
          chmod u+x "$converter"
          "$converter" --help > evidence/converter-help.log 2>&1

          convert() (
            arm="$1"
            result="$root/evidence/$arm"
            mkdir -p "$result" "$root/$arm"/{cpp,data,symbols}
            cd "$root/$arm"
            base64 --decode "$root/$arm.b64" > JaggedCase.dll
            sha256sum --check "$root/$arm.sha256" > "$result/input.log"
            printf '%s\n' --convert-to-cpp "--assembly=$PWD/JaggedCase.dll" \
              "--assembly=$root/Editor/Data/MonoBleedingEdge/lib/mono/unityaot-linux/mscorlib.dll" \
              "--generatedcppdir=$PWD/cpp" "--data-folder=$PWD/data" "--symbols-folder=$PWD/symbols" \
              --dotnetprofile=unityaot-linux --emit-null-checks --enable-array-bounds-check --jobs=2 \
              > "$result/invocation.rsp"
            code=0
            "$converter" "@$result/invocation.rsp" > "$result/stdout.log" 2> "$result/stderr.log" || code=$?
            printf '%s\n' "$code" > "$result/exit.txt"
            if test "$code" != 0; then
              tail -n 40 "$result/stdout.log" "$result/stderr.log"
              return "$code"
            fi
            python3 - "$result" <<'PYTHON'
          from pathlib import Path
          import hashlib
          import json
          import re
          import sys

          result = Path(sys.argv[1])
          cpp = Path("cpp/JaggedCase.cpp")
          body = cpp.read_text()
          caller = re.search(r"(?m)^[^\n]*\bCaller_Read_m[0-9A-F]+ *\([^;\n]*\) *\n\{.*?^\}", body, re.S)
          assert caller, "Caller.Read body missing"
          snippet = caller[0].split("\n", 1)[1]
          assert snippet.count("SZArrayNew(") == 2, "Expected two array allocations"
          assert re.search(r"\bSetAt(?:Unchecked)?\(|il2cpp_array_setref\s*\(", snippet), "Expected reference store"
          paths = sorted(Path("data").rglob("global-metadata.dat"))
          assert len(paths) == 1, "Expected one metadata file"
          metadata = paths[0].read_bytes()
          assert metadata[:4] == bytes.fromhex("af1bb1fa") and len(metadata) > 8, "Invalid metadata"
          (result / "caller.cpp.txt").write_text(snippet + "\n")
          (result / "outputs.json").write_text(json.dumps({
              "cppSha256": hashlib.sha256(cpp.read_bytes()).hexdigest(),
              "metadataSha256": hashlib.sha256(metadata).hexdigest(),
              "metadataBytes": len(metadata),
          }, indent=2) + "\n")
          PYTHON
          )

          convert integer
          convert original
