name: Prettier Auto Fix

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.json"
      - "**/*.asmdef"
      - "**/*.asmref"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/**"
      - ".prettierrc*"
      - "**/.prettierrc*"
      - "prettier.config.*"
      - "**/prettier.config.*"
      - ".prettierignore"
      - "**/.prettierignore"
      - ".editorconfig"
      - "**/.editorconfig"
      - ".gitignore"
      - "**/.gitignore"
      - "package.yaml"
      - "**/package.yaml"
      - ".markdownlint*"
      - "**/.markdownlint*"
      - ".markdownlintignore"
      - "**/.markdownlintignore"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: Format and propose changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm i --ignore-scripts --no-audit --no-fund
          fi
          npm audit --audit-level=high

      - name: Run Prettier (write fixes)
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          npx prettier --write "**/*.{md,markdown}"
          npx prettier --write "**/*.{json,asmdef,asmref}"
          npx prettier --write "**/*.{yml,yaml}"

      - name: Markdownlint (auto-fix)
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: npx --no-install markdownlint-cli2 "**/*.md" "**/*.markdown" --fix

      - name: Renormalize line endings
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        shell: bash
        run: |
          # Renormalize each extension separately to avoid "pathspec did not match" failures
          # when certain file types don't exist or aren't accessible in this checkout context
          # yaml excluded: dotfiles (.pre-commit-config.yaml) match git ls-files but not git add globs
          for ext in md markdown json asmdef asmref yml; do
            if git ls-files "*.$ext" "**/*.$ext" | grep -q .; then
              git add --renormalize -- "*.$ext" "**/*.$ext"
            fi
          done

      - name: Configure push credentials
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'dependabot[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Commit formatting changes to PR branch (Dependabot only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'dependabot[bot]' }}
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore(format): apply Prettier/markdownlint fixes"
          branch: ${{ github.head_ref }}
          add_options: --renormalize
          # NOTE: yaml excluded - all .yaml files are dotfiles, which git add patterns don't match
          file_pattern: |
            **/*.md
            **/*.markdown
            **/*.json
            **/*.asmdef
            **/*.asmref
            **/*.yml

      - name: Clear push credentials
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Refresh checkout after auto-commit
        if: ${{ steps.auto-commit.outputs.changes_detected == 'true' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Fetch the newly pushed commit and checkout to get normalized line endings in working tree
          git fetch origin "$HEAD_REF"
          git checkout -f FETCH_HEAD

      - name: Prettier check (Markdown)
        run: npx prettier --check "**/*.{md,markdown}"

      - name: Prettier check (JSON / asmdef / asmref)
        run: npx prettier --check "**/*.{json,asmdef,asmref}"

      - name: Prettier check (YAML)
        run: npx prettier --check "**/*.{yml,yaml}"

      - name: Markdown lint (CI gate)
        run: npm run lint:markdown
