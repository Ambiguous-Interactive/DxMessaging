version: 2
updates:
  # GitHub Actions workflow updates.
  #
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
    ignore:
      # The build-lock actions are first-party infrastructure whose immutable
      # commit pins are copied into the docs/ops examples. Dependabot cannot
      # edit those pages, so an automated bump would fail the copyable-example
      # contract in scripts/__tests__/ci-aggregate-workflow.test.js. Bump these
      # actions manually in one commit across .github/workflows and docs/ops.
      - dependency-name: "Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/*"

  # NuGet: SourceGenerator project - Roslyn packages pinned for Unity compiler compatibility
  - package-ecosystem: "nuget"
    directory: "/SourceGenerators/WallstopStudios.DxMessaging.SourceGenerators"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      sourcegenerators-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
    ignore:
      # SourceGenerator Roslyn packages - pinned for Unity compiler compatibility.
      # Unity's embedded compiler requires specific Roslyn versions; updating breaks SourceGenerator loading.
      # See: https://docs.unity3d.com/Manual/roslyn-analyzers.html
      - dependency-name: "Microsoft.CodeAnalysis*"
      - dependency-name: "System.Collections.Immutable"
      - dependency-name: "System.Reflection.Metadata"
      - dependency-name: "System.Runtime.CompilerServices.Unsafe"

  # NuGet: SourceGenerator tests - uses newer Roslyn but ignores shared Roslyn dependencies
  # Tests use newer Roslyn (4.14.0) than production (3.8.0), but ignoring shared Roslyn deps
  # prevents Dependabot churn and keeps dependency versions aligned.
  - package-ecosystem: "nuget"
    directory: "/SourceGenerators/WallstopStudios.DxMessaging.SourceGenerators.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      sourcegenerators-tests-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
    ignore:
      # Shared Roslyn dependencies (pinned for Unity compatibility in SourceGenerator project)
      - dependency-name: "Microsoft.CodeAnalysis*"
      - dependency-name: "System.Collections.Immutable"
      - dependency-name: "System.Reflection.Metadata"
      - dependency-name: "System.Runtime.CompilerServices.Unsafe"

  # NuGet: documentation tests - uses the same Roslyn test harness policy
  - package-ecosystem: "nuget"
    directory: "/.docs-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      docs-tests-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
    ignore:
      # Keep Roslyn aligned with the source-generator test harness.
      - dependency-name: "Microsoft.CodeAnalysis*"
      - dependency-name: "System.Collections.Immutable"
      - dependency-name: "System.Reflection.Metadata"
      - dependency-name: "System.Runtime.CompilerServices.Unsafe"

  # npm/UPM: package.json at repo root (Unity package manifest)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
    versioning-strategy: increase

  # uv: the compiled Python locks. Both pairs in this directory
  # (requirements-docs for the site build, requirements-brand for the card
  # render) are compiled with uv, so a dependency change must arrive as a
  # reviewed pull request, not as a silent re-resolve on the day a job
  # happens to run. Dependabot's uv updater discovers every requirements file
  # here, maps each .txt to its same-named .in, and recompiles it with uv.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-locks-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
