name: Redact sensitive data from Unity artifacts
description: >-
  Remove credential material and private identifiers from text Unity build output before upload.
  Unity writes its license serial into unity.log and configure.log during
  activation. GitHub masks registered secrets in rendered job logs but not in
  the bytes of an uploaded artifact, so on a public repository those logs
  publish the serial to anyone who can download the artifact. Run it after the
  last producer for each covered path and before that path is uploaded.
inputs:
  paths:
    description: >-
      Newline-separated directories to scrub. A directory that does not exist is
      skipped, so one call can cover every test mode a job may or may not run.
    required: true
  parallel-paths:
    description: Newline-separated disjoint paths to process with up to four workers; empty uses paths sequentially.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # This step is allowed to fail the job. A text file that still holds sensitive
    # data after redaction was attempted must not reach an artifact, and a
    # silent pass would recreate the exact leak this exists to close.
    - name: Redact sensitive data from Unity artifacts
      shell: pwsh
      env:
        DXM_REDACT_PATHS: ${{ inputs.paths }}
        DXM_REDACT_PARALLEL_PATHS: ${{ inputs.parallel-paths }}
      run: |
        $ErrorActionPreference = 'Stop'
        function Split-ArtifactPaths {
          param([string]$Value)
          return @(
            $Value -split "`n" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
          )
        }
        function Get-NormalizedRoot {
          param([string]$Path)
          return [System.IO.Path]::TrimEndingDirectorySeparator([System.IO.Path]::GetFullPath($Path))
        }
        $paths = @(Split-ArtifactPaths $env:DXM_REDACT_PATHS)
        $parallelPaths = @(Split-ArtifactPaths $env:DXM_REDACT_PARALLEL_PATHS)
        if ($paths.Count + $parallelPaths.Count -eq 0) {
          throw 'The redact-unity-artifacts action requires at least one path.'
        }
        Write-Host "::group::Redacting sensitive data from Unity artifacts"
        try {
          $comparison = if ($IsWindows) { [System.StringComparison]::OrdinalIgnoreCase } else { [System.StringComparison]::Ordinal }
          function Test-SameOrDescendant {
            param([string]$Candidate, [string]$Parent)
            if ($Candidate.Equals($Parent, $comparison)) {
              return $true
            }
            $left = $Candidate.TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
            $right = $Parent.TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
            return $left.StartsWith($right, $comparison)
          }
          $normalizedPaths = @($paths | ForEach-Object { Get-NormalizedRoot $_ })
          $roots = [System.Collections.Generic.List[string]]::new()
          foreach ($parallelPath in $parallelPaths) {
            $roots.Add((Get-NormalizedRoot $parallelPath))
          }
          function Add-AutoRoot {
            param([string]$Candidate)
            $normalized = Get-NormalizedRoot $Candidate
            foreach ($existing in $roots) {
              if (
                (Test-SameOrDescendant $normalized $existing) -or
                (Test-SameOrDescendant $existing $normalized)
              ) {
                return
              }
            }
            $roots.Add($normalized)
          }
          foreach ($artifactPath in @($paths | ForEach-Object { Get-NormalizedRoot $_ })) {
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Container)) {
              continue
            }
            if (Test-Path -LiteralPath (Join-Path $artifactPath 'shipping-matrix-evidence.json') -PathType Leaf) {
              foreach ($cell in Get-ChildItem -LiteralPath $artifactPath -Directory -Force) {
                Add-AutoRoot $cell.FullName
              }
              continue
            }
            foreach ($child in Get-ChildItem -LiteralPath $artifactPath -Directory -Force) {
              if ($child.Name -match '-(editmode|playmode|standalone)$') {
                Add-AutoRoot $child.FullName
                continue
              }
              if (
                $child.Name -match '-shipping$' -or
                (Test-Path -LiteralPath (Join-Path $child.FullName 'shipping-matrix-evidence.json') -PathType Leaf)
              ) {
                foreach ($cell in Get-ChildItem -LiteralPath $child.FullName -Directory -Force) {
                  Add-AutoRoot $cell.FullName
                }
              }
            }
          }
          for ($i = 0; $i -lt $roots.Count; $i++) {
            for ($j = 0; $j -lt $i; $j++) {
              if (
                (Test-SameOrDescendant $roots[$i] $roots[$j]) -or
                (Test-SameOrDescendant $roots[$j] $roots[$i])
              ) {
                throw 'Parallel artifact paths must not overlap.'
              }
            }
          }
          $relativeScopePaths = [System.Collections.Generic.List[string]]::new()
          foreach ($root in $roots) {
            foreach ($artifactPath in $normalizedPaths) {
              if (Test-SameOrDescendant $root $artifactPath) {
                $relativeRoot = [System.IO.Path]::GetRelativePath($artifactPath, $root)
                if ($relativeRoot -ne '.') {
                  foreach ($segment in $relativeRoot.Split([System.IO.Path]::DirectorySeparatorChar)) {
                    if ($segment -match '^\s|\s$') {
                      throw "Artifact scope names must not have leading or trailing whitespace: $relativeRoot"
                    }
                  }
                  $relativeScopePaths.Add($relativeRoot)
                }
              }
            }
          }
          if ($relativeScopePaths.Count -ne 0) {
            $sensitiveNameCheck = 'const {findSensitiveData}=require("./scripts/unity/credential-patterns.js"); ' +
              'for (const p of process.argv.slice(1)) if (findSensitiveData(p).length || /\p{Cf}/u.test(p)) { ' +
              'console.error("Sensitive artifact scope name."); process.exit(2); }'
            node -e $sensitiveNameCheck -- @relativeScopePaths
            if ($LASTEXITCODE -ne 0) {
              throw 'Artifact scope names below the requested root must not contain sensitive data.'
            }
          }
          $normalizedPaths = @(
            $normalizedPaths | Where-Object {
              $normalizedPath = $_
              @($roots | Where-Object { Test-SameOrDescendant $normalizedPath $_ }).Count -eq 0
            }
          )
          $excludedRoots = @(
            $roots | Where-Object {
              $root = $_
              @($normalizedPaths | Where-Object { Test-SameOrDescendant $root $_ }).Count -ne 0
            } | Sort-Object -Unique
          )
          $failedParallel = $false
          if ($roots.Count -ne 0) {
            $processor = (Resolve-Path -LiteralPath 'scripts/unity/redact-unity-artifacts.js').Path
            $outcomes = @($roots | ForEach-Object -Parallel {
              $ErrorActionPreference = 'Stop'
              try {
                node $using:processor $_ 2>&1 | ForEach-Object { Write-Host "$_" }
                [pscustomobject]@{ Succeeded = ($LASTEXITCODE -eq 0) }
              } catch {
                Write-Host "Artifact processing worker failed: $_"
                [pscustomobject]@{ Succeeded = $false }
              }
            } -ThrottleLimit 4)
            $failed = @($outcomes | Where-Object { -not $_.Succeeded })
            if ($outcomes.Count -ne $roots.Count -or $failed.Count -ne 0) {
              $failedParallel = $true
            }
          }
          $failedSequential = $false
          $sequentialExitCode = 0
          if ($normalizedPaths.Count -ne 0) {
            $processorArguments = @()
            foreach ($excludedRoot in $excludedRoots) {
              $processorArguments += @('--exclude', $excludedRoot)
            }
            $processorArguments += $normalizedPaths
            node scripts/unity/redact-unity-artifacts.js @processorArguments
            if ($LASTEXITCODE -ne 0) {
              $failedSequential = $true
              $sequentialExitCode = $LASTEXITCODE
              Write-Host "Sensitive-data redaction failed with exit code $LASTEXITCODE."
            }
          }
          if ($failedParallel) {
            throw 'Sensitive-data redaction failed in one or more workers.'
          }
          if ($failedSequential) {
            throw "Sensitive-data redaction failed with exit code $sequentialExitCode."
          }
        } finally {
          Write-Host '::endgroup::'
        }
